<script>
/* ================================================================
   دورة اللعب
   ================================================================ */
const veil=$("#veil"), sheet=$("#sheet"), screenEl=$("#screen"), app=$("#app"), bigMsg=$("#bigMsg");
let toastT;
function toast(m){document.querySelectorAll(".toast").forEach(e=>e.remove());
  const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);
  clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2200);}
function openSheet(h){sheet.innerHTML=h;veil.className="veil on";}
function closeSheet(){veil.className="veil";sheet.innerHTML="";}
let bigT;
function big(txt,col,tx){
  if(!bigMsg||!bigMsg.firstElementChild) return;
  bigMsg.firstElementChild.textContent=txt;
  bigMsg.style.setProperty("--mc",col); bigMsg.style.setProperty("--mtx",tx||col);
  bigMsg.classList.add("on"); clearTimeout(bigT);
  bigT=setTimeout(()=>bigMsg.classList.remove("on"),1500);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* متابعة موحّدة: تُستدعى بالزر أو بمفتاح الإدخال/المسافة */
let pendingContinue=null, keyPick=null;
function waitContinue(){ return new Promise(res=>{ pendingContinue=res; }); }
function continueNow(){ if(!pendingContinue) return false;
  const r=pendingContinue; pendingContinue=null; SFX.ui(); closeSheet(); r(); return true; }

function renderPlayers(){
  $("#players").innerHTML=G.players.map((p,i)=>{
    const t=G.turn===i&&!G.over;
    return `<div class="pl ${t?"turn":""}" style="--tc:${PCOL[i].sd};--tbg:${PCOL[i].bg}">
      <span class="av" style="background:${PCOL[i].sd}">${AR(i+1)}</span>
      <span style="min-width:0">
        <span class="nm">${esc(p.name)} ${p.streak>=3?`<span class="streak">🔥 ${AR(p.streak)}</span>`:""}</span>
        <span class="sq">المربع <b class="num">${AR(p.sq)}</b> من <b class="num">٤٩</b>
          · ✓ <b class="num">${AR(p.right)}</b> ✕ <b class="num">${AR(p.wrong)}</b></span>
      </span>
      <span class="pts" style="color:${PCOL[i].sd}">${AR(p.pts)}<small>نقطة</small></span>
      <span class="prog" style="width:${Math.round(p.sq/BOARD.last*100)}%"></span>
    </div>`;}).join("");
  /* وميض عند زيادة النقاط */
  G.players.forEach((p,i)=>{
    if(G._pts&&G._pts[i]!==undefined&&p.pts>G._pts[i]){
      const box=$("#players"), el=box&&box.children?box.children[i]:null;
      if(el&&el.classList){ el.classList.add("gain"); setTimeout(()=>el.classList.remove("gain"),320); }
    }
  });
  G._pts=G.players.map(p=>p.pts);
}
function setHint(txt){$("#hint").innerHTML=txt;}
/* شريط علوي يوضّح أن الخصم يلعب */
function turnbar(on,ms,col){
  const b=$("#turnbar").firstElementChild; if(!b) return;
  $("#turnbar").style.setProperty("--tc",col||"var(--y-sd)");
  if(!on){ b.style.transition="none"; b.style.width="0"; return; }
  b.style.transition="none"; b.style.width="0";
  requestAnimationFrame(()=>{ b.style.transition=`width ${ms}ms linear`; b.style.width="100%"; });
}
function updateCtl(){
  const p=cur();
  const ready=!(G.over||G.busy||!p.human);
  $("#btnRoll").disabled = !ready;
  $("#btnRoll").textContent = G.extraRoll?"رمية إضافية":"ارمِ الزهر";
  $("#dice").classList.toggle("ready",ready);
}

/* ---------------- تحريك القطعة ---------------- */
async function moveTo(pi,from,to,slide){
  const p=G.players[pi];
  if(slide){
    /* الانزلاق على مسار: تقريب سينمائي يتبع القطعة ثم إبعاد */
    await sleep(320);
    const steps=52;
    for(let i=1;i<=steps;i++){
      const t=i/steps, e=t<.5? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      const X=cx0(from)+(cx0(to)-cx0(from))*e, Y=cy0(from)+(cy0(to)-cy0(from))*e;
      G.anim={pi, x:X, y:Y};
      drawBoard(); await sleep(17);
    }
    await sleep(340);
  } else {
    const dir=to>from?1:-1;
    const total=Math.abs(to-from);
    for(let n=from+dir, k=0; dir>0? n<=to : n>=to; n+=dir, k++){
      const a=Math.max(1,n-dir), b=Math.max(1,n);
      const steps=16;
      const last=(k===total-1);
      for(let i=1;i<=steps;i++){
        const t=i/steps;
        const e=t<.5? 2*t*t : 1-Math.pow(-2*t+2,2)/2;     /* تسارع ثم تباطؤ */
        G.anim={pi, x:cx0(a)+(cx0(b)-cx0(a))*e,
          y:cy0(a)+(cy0(b)-cy0(a))*e - Math.sin(t*Math.PI)*CELL*0.34};
        drawBoard(); await sleep(total>4?13:17);
      }
      G.land={sq:b, t:1};                                  /* موجة ارتطام */
      SFX.step(k, total);
      await sleep(last?170:(total>4?55:95));                            /* وقفة قصيرة بين القفزات */
    }
    /* تقريب خفيف يتبع الحركة العادية */
    await sleep(180);
  }
  p.sq=to; G.anim=null; drawBoard(); renderPlayers();
}


/* ---------------- النرد الطائر وبطاقة المربع ---------------- */
function drawDiceOn(g2,v,S){
  g2.clearRect(0,0,S,S);
  g2.fillStyle="#FFFFFF"; g2.fillRect(0,0,S,S);
  const pips={1:[[.5,.5]],2:[[.28,.28],[.72,.72]],3:[[.26,.26],[.5,.5],[.74,.74]],
    4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],
    5:[[.26,.26],[.74,.26],[.5,.5],[.26,.74],[.74,.74]],
    6:[[.28,.24],[.72,.24],[.28,.5],[.72,.5],[.28,.76],[.72,.76]]}[v]||[];
  g2.fillStyle="#16232F";
  pips.forEach(p=>{g2.beginPath();g2.arc(p[0]*S,p[1]*S,S*.085,0,7);g2.fill();});
}
/* موضع مربع على الشاشة مع مراعاة تقريب الكاميرا */
function sqScreenRect(n){
  const r=bcv.getBoundingClientRect();
  const cxp=cx0(n), cyp=cy0(n);
  const X=r.left+((cxp-CAM.x)*CAM.z+BW/2);
  const Y=r.top +((cyp-CAM.y)*CAM.z+BW/2);
  const W=CELL*CAM.z;
  return {x:X-W/2, y:Y-W/2, w:W, h:W, cx:X, cy:Y};
}
/* البطاقة تنمو من المربع نفسه */
let morphRect=null;
function growFromSquare(n){
  /* البطاقة تظهر بوثبة كرتونية من الأسفل بدل التكبير من المربع */
  morphRect=null;
  veil.classList.add("lit");
  const el=sheet; if(REDUCED) return;
  el.classList.add("popin");
  setTimeout(()=>el.classList.remove("popin"),600);
}
function shrinkToSquare(){
  const el=sheet;
  veil.classList.remove("lit");
  if(REDUCED){ el.classList.remove("popin","popout"); return Promise.resolve(); }
  el.classList.remove("popin"); el.classList.add("popout");
  return new Promise(r=>setTimeout(()=>{ el.classList.remove("popout"); r(); },260));
}

/* ---------------- الدور ---------------- */
/* توليد بيانات الدور — في اللعب الشبكي يولّدها المضيف وحده */
function rollTurn(p){
  const v=1+Math.floor(Math.random()*6);
  const target=Math.min(BOARD.last,p.sq+v);
  const cat=BOARD.zoneOf(Math.max(1,target));
  if(!G.pool[cat]||!G.pool[cat].length) G.pool[cat]=shuffle(QUESTIONS[cat].map((_,i)=>i));
  return {pi:p.i, v, cat, idx:G.pool[cat][0]};
}
async function takeTurn(){
  if(G.over||G.busy) return;
  const p=cur();
  if(NET.on){
    if(p.i!==NET.me) return;
    if(NET.mode==="guest"){ NET.send({t:"req"}); G.busy=true; updateCtl();
      setHint("بانتظار المضيف…"); return; }
  }
  const d=rollTurn(p);
  if(NET.on) NET.send({t:"turn", ...d});
  await runTurn(d);
}
/* تنفيذ الدور بالبيانات نفسها على الجهازين */
async function runTurn(d){
  if(G.over) return;
  G.turn=d.pi;
  const p=G.players[d.pi];
  if(p.skip){ p.skip=false;
    setHint(`<b>${esc(p.name)}</b> في محطة تأمل — يمرّ الدور`);
    log(p,"تخطّى الدور بسبب محطة التأمل","gray");
    await sleep(900); endTurn(); return; }
  G.busy=true; updateCtl();
  const pos=G.pool[d.cat]?G.pool[d.cat].indexOf(d.idx):-1;
  if(pos>=0) G.pool[d.cat].splice(pos,1);
  const q={cat:d.cat, idx:d.idx, ...QUESTIONS[d.cat][d.idx]};

  $("#dice").classList.add("roll"); SFX.roll();
  const spins=[70,70,80,95,110,130,155,185,220,260];
  for(let i=0;i<spins.length;i++){ drawDice(1+Math.floor(Math.random()*6)); await sleep(spins[i]); }
  drawDice(d.v); $("#dice").classList.remove("roll"); $("#dice").classList.add("landed");
  SFX.diceLand(); await sleep(REDUCED?60:420); $("#dice").classList.remove("landed");
  G.extraRoll=false;

  const target=Math.min(BOARD.last,p.sq+d.v);
  setHint(`الزهر <b class="num">${AR(d.v)}</b> — ${esc(p.name)} يتقدّم إلى <b class="num">${AR(target)}</b>`);
  await sleep(REDUCED?40:280);
  if(target!==p.sq) await moveTo(p.i,p.sq,target,false);
  G.landedOn=target;
  await sleep(REDUCED?40:340);
  setHint(`مربع <b class="num">${AR(target)}</b> — سؤال ${CATS[d.cat].n}`);

  let correct;
  const mine = !NET.on || d.pi===NET.me;
  if(NET.on && !mine) correct = await waitRemoteAnswer(q,p,d.v);
  else {
    correct = p.human ? await askQuestion(q,p,d.v) : await aiAnswer(q,p,d.v);
    if(NET.on) NET.send({t:"ans", pi:d.pi, correct});
  }
  await resolveAnswer(p,d.v,correct,q);
}
/* عرض السؤال للطرف الآخر بانتظار إجابته */
let remoteResolve=null;
function waitRemoteAnswer(q,p,v){
  const C=CATS[q.cat], KEYS=["أ","ب","ج","د"];
  const order=shuffle(q.o.map((_,i)=>i));
  veil.classList.add("grow");
  openSheet(`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="qcat" style="background:${C.bg};border-color:${C.bd};color:${C.tx}">${C.icon} ${C.n}</span>
      <span class="faint" style="font-size:12.5px">دور <b style="color:${PCOL[p.i].sd}">${esc(p.name)}</b>
        · المربع <b class="num">${AR(p.sq)}</b></span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div id="opts">${order.map((oi,k)=>`<button class="opt" data-o="${oi}" disabled>
      <span class="k">${KEYS[k]}</span>${esc(q.o[oi])}</button>`).join("")}</div>
    <p class="faint" style="text-align:center;margin:8px 0 0">
      <span class="dotpulse"></span> ${esc(p.name)} يجيب الآن…</p>`);
  growFromSquare(p.sq);
  return new Promise(res=>{ remoteResolve=(okAns)=>{
    remoteResolve=null;
    const bs=sheet.querySelectorAll?[...sheet.querySelectorAll("[data-o]")]:[];
    bs.forEach(b=>{ b.className = (+b.dataset.o)===q.a ? "opt right" : "opt mute"; });
    setTimeout(()=>res(okAns),700);
  }; });
}

/* ---------------- عرض السؤال ---------------- */
function askQuestion(q,p,v){
  return new Promise(resolve=>{
    const C=CATS[q.cat];
    const order=shuffle(q.o.map((_,i)=>i));
    const tLimit=G.lv.time;
    let done=false, left=tLimit;
    const KEYS=["أ","ب","ج","د"];
    openSheet(`
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="qcat" style="background:${C.bg};border-color:${C.bd};color:${C.tx}">${C.icon} ${C.n}</span>
        <span class="faint" style="font-size:12.5px">دور <b style="color:${PCOL[p.i].sd}">${esc(p.name)}</b>
          · المربع <b class="num" style="color:${PCOL[p.i].sd}">${AR(p.sq)}</b></span>
      </div>
      ${tLimit?`<div class="timer" style="margin-top:12px"><i id="tbar" style="width:100%"></i></div>`:""}
      <div class="qtext">${esc(q.q)}</div>
      <div id="opts">${order.map((oi,k)=>`<button class="opt" data-o="${oi}">
        <span class="k">${KEYS[k]}</span>${esc(q.o[oi])}</button>`).join("")}</div>
      <p class="faint" style="text-align:center;font-size:11.5px;margin:8px 0 0">يمكنك الاختيار بالأرقام <span class="num">1</span>–<span class="num">4</span></p>`);
    veil.classList.add("grow");
    growFromSquare(p.sq);
    const finish=(ok)=>{ if(done) return; done=true; keyPick=null; turnbar(false); clearInterval(iv);
      const btns=[...sheet.querySelectorAll("[data-o]")];
      btns.forEach(b=>{ const oi=+b.dataset.o;
        if(oi===q.a) b.className="opt right";
        else if(b.dataset.picked) b.className="opt wrong";
        else b.className="opt mute"; b.disabled=true; });
      setTimeout(()=>resolve(ok),260);
    };
    const btns0=[...sheet.querySelectorAll("[data-o]")];
    btns0.forEach(b=>b.addEventListener("click",()=>{
      if(done) return; b.dataset.picked="1"; finish(+b.dataset.o===q.a);
    }));
    /* اختيار بلوحة المفاتيح: ١ ٢ ٣ ٤ أو أ ب ج د */
    keyPick=(idx)=>{ if(done) return; const b=btns0[idx]; if(!b) return;
      b.dataset.picked="1"; SFX.ui(); finish(+b.dataset.o===q.a); };
    let iv=null;
    if(tLimit){
      iv=setInterval(()=>{ left-=0.1;
        const bar=$("#tbar"); if(bar){ bar.style.width=Math.max(0,left/tLimit*100)+"%";
          bar.style.background = left<tLimit*0.3?"var(--r-sd)":left<tLimit*0.6?"var(--a-sd)":"var(--c-sd)"; }
        if(left<=3 && Math.abs(left-Math.round(left))<0.06) SFX.tick();
        if(left<=0) finish(false);
      },100);
    }
  });
}
async function aiAnswer(q,p,v){
  const C=CATS[q.cat];
  const KEYS=["أ","ب","ج","د"];
  const order=shuffle(q.o.map((_,i)=>i));
  const ok=Math.random()<G.lv.ai;
  const pick= ok? q.a : shuffle(q.o.map((_,i)=>i).filter(i=>i!==q.a))[0];
  openSheet(`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="qcat" style="background:${C.bg};border-color:${C.bd};color:${C.tx}">${C.n}</span>
      <span class="faint" style="font-size:12.5px">دور <b style="color:${PCOL[p.i].sd}">${esc(p.name)}</b>
        · المربع <b class="num">${AR(p.sq)}</b></span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div id="opts">${order.map((oi,k)=>`<button class="opt" data-o="${oi}" disabled>
      <span class="k">${KEYS[k]}</span>${esc(q.o[oi])}</button>`).join("")}</div>
    <p class="faint" style="text-align:center;margin:6px 0 0">الخصم يفكّر…</p>`);
  await sleep(2100);
  sheet.querySelectorAll("[data-o]").forEach(b=>{ const oi=+b.dataset.o;
    if(oi===q.a) b.className="opt right";
    else if(oi===pick) b.className="opt wrong";
    else b.className="opt mute"; });
  turnbar(false);
  await sleep(1400);
  return ok;
}

/* ---------------- نتيجة الإجابة ---------------- */
function log(p,txt,c){ G.log.unshift({p:p.i,txt,c:c||"gray",sq:p.sq}); G.log=G.log.slice(0,60); }

async function resolveAnswer(p,v,correct,q){
  await shrinkToSquare();
  closeSheet(); veil.classList.remove("grow","lit");
  await sleep(REDUCED?40:180);
  const C=CATS[q.cat];
  if(correct){
    p.right++; p.streak++; p.bestStreak=Math.max(p.bestStreak,p.streak);
    p.cats[q.cat]=(p.cats[q.cat]||0)+1;
    p.pts += 10 + (p.streak>=3?5:0);
    SFX.right(); big("إجابة صحيحة ✓ — ثبتّ مكانك","var(--g-sd)","var(--g-tx)"); burst("good");
    log(p,`أجاب صحيحاً وثبت في المربع ${p.sq}`,"green");
    await sleep(1000);
  } else {
    p.wrong++; p.streak=0;
    SFX.wrong(); big("إجابة غير صحيحة ✕ — تتراجع","var(--r-sd)","var(--r-tx)");
    CAM.shake=REDUCED?0:.5;
    await sleep(1000);
    const back=Math.max(0,p.sq-G.lv.back);
    if(back!==p.sq){ await moveTo(p.i,p.sq,back,false);
      log(p,`أجاب خطأً وتراجع إلى المربع ${back}`,"red"); }
    else log(p,"أجاب خطأً ولم يتراجع أبعد من البداية","red");
  }
  /* شرح الإجابة دائماً — هذا هو جوهر اللعبة التعليمي */
  await showExplain(q,correct,C);
  /* المسارات والمربعات الخاصة تُحسم فقط عند الإجابة الصحيحة */
  if(correct && p.sq>0) await resolveSquare(p);
  if(correct && p.sq>=BOARD.last){ return finish(p); }
  G.landedOn=null;
  endTurn();
}

function showExplain(q,correct,C){
  return new Promise(res=>{
    openSheet(`<div class="qcat" style="background:${C.bg};border-color:${C.bd};color:${C.tx}">${C.icon} ${C.n}</div>
      <div style="margin-top:12px;font-weight:700;font-size:15px">${correct?"✓ صحيح":"✕ الإجابة الصحيحة"}</div>
      <div class="card" style="margin:10px 0;border-color:${correct?"var(--g-bd)":"var(--r-bd)"};
        background:${correct?"var(--g-bg)":"var(--r-bg)"}">
        <b>${esc(q.o[q.a])}</b></div>
      <p style="font-size:15px">${esc(q.e)}</p>
      <div class="srcnote" style="margin:10px 0 12px">المرجع التوعوي: ${esc(C.src||"")}</div>
      <div style="text-align:end"><button class="btn primary" data-continue="1">متابعة
        <span class="faint" style="font-size:11px">↵</span></button></div>`);
    pendingContinue=res;
  });
}

/* ---------------- المربع الذي حطّ عليه ---------------- */
async function resolveSquare(p){
  const L=ladderAt(p.sq);
  if(L){ p.ladders++; p.pts+=15; SFX.ladder();
    big("مسار حماية ↑","var(--g-sd)","var(--g-tx)"); burst("ladder");
    await sleep(850); await moveTo(p.i,L.a,L.b,true);
    log(p,`صعد بمسار حماية: ${L.t} → ${L.b}`,"green");
    await note("مسار حماية",L.t,L.d,"green"); return; }
  const S=snakeAt(p.sq);
  if(S){ p.snakes++; p.pts=Math.max(0,p.pts-5); SFX.snake(); CAM.shake=REDUCED?0:1;
    big("منزلق خطر ↓","var(--r-sd)","var(--r-tx)");
    await sleep(850); await moveTo(p.i,S.a,S.b,true);
    log(p,`انزلق: ${S.t} → ${S.b}`,"red");
    await note("منزلق خطر",S.t,S.d,"red"); return; }
  const sp=BOARD.special[p.sq];
  if(sp){
    if(sp.kind==="extra"){ G.extraRoll=true; p.pts+=5; SFX.extra();
      big("رمية إضافية ⭑","var(--y-sd)","var(--y-tx)");
      log(p,"حصل على رمية إضافية","gold"); }
    else { p.skip=true; SFX.pause2();
      big("محطة تأمل ⏸","var(--c-sd)","var(--c-tx)");
      log(p,"محطة تأمل: يمرّ دوره القادم","cyan"); }
    await sleep(1100);
    await note(sp.t,"",sp.d,sp.kind==="extra"?"gold":"cyan");
  }
}
function note(title,sub,body,col){
  return new Promise(res=>{
    const map={green:["var(--g-bd)","var(--g-bg)","var(--g-tx)"],red:["var(--r-bd)","var(--r-bg)","var(--r-tx)"],
      gold:["var(--y-bd)","var(--y-bg)","var(--y-tx)"],cyan:["var(--c-bd)","var(--c-bg)","var(--c-tx)"]}[col];
    openSheet(`<div class="qcat" style="background:${map[1]};border-color:${map[0]};color:${map[2]}">${title}</div>
      ${sub?`<h2 style="margin:12px 0 8px">${esc(sub)}</h2>`:'<div style="height:8px"></div>'}
      <p style="font-size:15.5px">${esc(body)}</p>
      <div style="text-align:end"><button class="btn primary" data-continue="1">متابعة
        <span class="faint" style="font-size:11px">↵</span></button></div>`);
    pendingContinue=res;
  });
}

function endTurn(){
  G.busy=false;
  if(G.extraRoll){ setHint(`<b>${esc(cur().name)}</b> — رمية إضافية`); }
  else { G.turn=1-G.turn; setHint(`دور <b style="color:${PCOL[G.turn].sd}">${esc(cur().name)}</b>`); }
  renderPlayers(); updateCtl(); drawBoard();
  if(!cur().human && !G.over) setTimeout(takeTurn,1250);
}

</script>
<script>
/* ================================================================
   النهاية والشاشات والإقلاع
   ================================================================ */
function medalsOf(p,won){
  const m=[];
  if(won) m.push("win");
  if(p.wrong===0) m.push("perfect");
  if(p.bestStreak>=5) m.push("streak");
  if(p.ladders>=3) m.push("climber");
  if(p.snakes===0) m.push("nofall");
  if(Object.values(p.cats).every(v=>v>0)) m.push("scholar");
  return m;
}
function finish(winner){
  G.over=true; G.winner=winner.i;
  G.turn=winner.i; burst('win'); setTimeout(()=>burst('win'),450); setTimeout(()=>burst('win'),900);
  const me=G.players[0];
  const won=G.mode==="solo" ? winner.i===0 : true;
  const md=medalsOf(me, winner.i===0);
  const bonus=winner.i===0?50:0;
  me.pts+=bonus;
  if(G.mode==="solo"){
    P.xp+=me.pts;
    md.forEach(x=>{ if(!P.medals.includes(x)) P.medals.push(x); });
    P.bestStreak=Math.max(P.bestStreak,me.bestStreak);
    P.games.push({at:Date.now(),pts:me.pts,won:winner.i===0,lv:G.lv.id,
      right:me.right,wrong:me.wrong});
    saveP();
  }
  (winner.i===0||G.mode==="duo")?SFX.win():SFX.lose();
  showResult(winner,md,bonus);
}
function showResult(winner,md,bonus){
  const acc=p=>p.right+p.wrong?Math.round(p.right/(p.right+p.wrong)*100):0;
  const catRows=Object.keys(CATS).map(k=>{
    const C=CATS[k];
    return [{v:pill(C.icon+" "+C.n,C.c)},
      ...G.players.map(p=>({v:`<b class="num">${AR(p.cats[k])}</b>`,cls:"num"}))];
  });
  const statRows=[
    ["الموقع النهائي", ...G.players.map(p=>`<b class="num">${AR(p.sq)}</b> / ٤٩`)],
    ["إجابات صحيحة",   ...G.players.map(p=>`<b class="num">${AR(p.right)}</b>`)],
    ["إجابات خاطئة",   ...G.players.map(p=>`<b class="num">${AR(p.wrong)}</b>`)],
    ["نسبة الدقة",     ...G.players.map(p=>`<b class="num" style="color:${acc(p)>=70?"var(--g-sd)":acc(p)>=45?"var(--a-sd)":"var(--r-sd)"}">${AR(acc(p))}٪</b>`)],
    ["أطول سلسلة",     ...G.players.map(p=>`<b class="num">${AR(p.bestStreak)}</b>`)],
    ["مسارات حماية",   ...G.players.map(p=>`<span class="pill green">${AR(p.ladders)}</span>`)],
    ["منزلقات خطر",    ...G.players.map(p=>`<span class="pill red">${AR(p.snakes)}</span>`)]
  ].map(r=>[{v:`<b>${r[0]}</b>`},{v:r[1],cls:"num"},{v:r[2],cls:"num"}]);
  const logRows=G.log.slice(0,18).map(l=>[
    {v:pill(AR(l.p+1),l.p===0?"blue":"red"),cls:"num"},
    {v:esc(l.txt)},
    {v:`<span class="num">${AR(l.sq)}</span>`,cls:"num"}]);
  const r=rankOf(P.xp);
  const winName=G.players[G.winner].name;
  app.classList.remove("on");
  screenEl.className="screen on";
  screenEl.innerHTML=`<div class="wrap">
    <div class="eyebrow">انتهت الجولة</div>
    <h1 style="margin:10px 0 4px;font-size:clamp(24px,5.5vw,42px);color:${PCOL[G.winner].sd}">
      ${esc(winName)} وصل أولاً 🏁</h1>
    <p class="dim">${G.mode==="solo"
      ? (G.winner===0?"أنهيت المسار قبل خصمك.":"وصل الخصم أولاً هذه المرة — الأسئلة نفسها تنتظرك في الجولة القادمة.")
      : "أنهى المسار قبل الفريق الآخر."}</p>
    <div class="grid2" style="margin:16px 0">
      <div class="card"><h3 style="margin-bottom:9px">نقاطك</h3>
        <div style="font-size:34px;font-weight:800;font-family:var(--num);color:${PCOL[0].sd}">${AR(G.players[0].pts)}</div>
        <div class="faint" style="font-size:12.5px">
          ${AR(G.players[0].right)} صحيحة × ١٠ ${bonus?` + ${AR(bonus)} فوز`:""}
          ${G.players[0].ladders?` + ${AR(G.players[0].ladders*15)} مسارات`:""}
          ${G.players[0].snakes?` − ${AR(G.players[0].snakes*5)} منزلقات`:""}</div>
        ${G.mode==="solo"?`<div class="row" style="margin-top:9px"><span class="dim">الرتبة</span>
          <b>${r.n}</b></div><div class="row"><span class="dim">مجموع الخبرة</span>
          <b class="num">${AR(P.xp)}</b></div>`:""}</div>
      <div class="card"><h3 style="margin-bottom:9px">الأوسمة</h3>
        ${MEDALS.map(m=>`<span class="chip ${md.includes(m.id)?"won":""}">${m.n}</span>`).join("")}
        <div class="faint" style="font-size:12px;margin-top:8px">
          ${md.length?`حصلت على ${AR(md.length)} في هذه الجولة`:"لم تحصل على وسام هذه الجولة"}</div></div>
    </div>
    ${tbl("مقارنة الأداء","",[["المؤشر"],[G.players[0].name,"num"],[G.players[1].name,"num"]],statRows)}
    <div style="height:14px"></div>
    ${tbl("الإجابات الصحيحة حسب الفئة","أين معرفتك أقوى وأين تحتاج مراجعة",
      [["الفئة"],[G.players[0].name,"num"],[G.players[1].name,"num"]],catRows)}
    <div style="height:14px"></div>
    ${tbl("سجل الجولة","آخر ثماني عشرة حركة",[["اللاعب","num"],["الحدث"],["المربع","num"]],logRows)}
    <div style="display:flex;gap:9px;margin:20px 0 40px;flex-wrap:wrap">
      <button class="btn primary" data-act="again">جولة جديدة</button>
      <button class="btn" data-act="menu">القائمة الرئيسية</button></div></div>`;
}

/* ================================================================
   الشبكة — لعب لحظي بين جهازين اتصالاً مباشراً بلا خادم خاص
   ================================================================ */
const NET={
  on:false, mode:null, me:0, code:null, peer:null, conn:null,
  status:"مغلق", chat:[], unread:0, peerName:"صديقك", myName:"أنت", lv:"mid",
  send(m){ try{ if(this.conn&&this.conn.open) this.conn.send(JSON.stringify(m)); }catch(e){} },
  reset(){ try{ if(this.conn) this.conn.close(); if(this.peer) this.peer.destroy(); }catch(e){}
    this.on=false; this.mode=null; this.conn=null; this.peer=null; this.code=null;
    this.status="مغلق"; this.chat=[]; this.unread=0; }
};
const CODE=()=>{ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; };
const roomLink=code=>{ const u=location.href.split("#")[0]; return u+"#غرفة="+code; };

function loadPeer(){
  if(window.Peer) return Promise.resolve(true);
  return new Promise(res=>{
    const sc=document.createElement("script");
    sc.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
    sc.onload=()=>res(!!window.Peer);
    sc.onerror=()=>res(false);
    document.head.appendChild(sc);
    setTimeout(()=>res(!!window.Peer),9000);
  });
}
function netStatus(txt,kind){
  NET.status=txt;
  const el=document.getElementById("netPill");
  if(el){ el.className="netpill "+(kind||"");
    el.innerHTML=`<i></i>${esc(txt)}`; el.style.display=NET.on||NET.mode?"":"none"; }
}
function bindConn(conn,isHost){
  NET.conn=conn;
  conn.on("open",()=>{
    NET.on=true; NET.me=isHost?0:1;
    netStatus("متصل — "+(isHost?"أنت المضيف":"أنت الضيف"),"ok");
    NET.send({t:"hi", name:NET.myName});
    if(isHost) NET.send({t:"start", lv:NET.lv});
    onConnected(isHost);
  });
  conn.on("data",raw=>{ let m; try{ m=JSON.parse(raw); }catch(e){ return; } handleNet(m); });
  conn.on("close",()=>onDrop());
  conn.on("error",()=>onDrop());
}
function onDrop(){
  if(!NET.on) return;
  NET.on=false; netStatus("انقطع الاتصال","bad");
  toast("انقطع الاتصال بصديقك");
  if(G&&!G.over){ G.players.forEach(p=>p.human=true); G.busy=false; updateCtl();
    setHint("انقطع الاتصال — يمكنكما إكمال الجولة على هذا الجهاز"); }
}
async function handleNet(m){
  if(m.t==="hi"){ NET.peerName=m.name||"صديقك";
    if(G){ G.players[1-NET.me].name=NET.peerName; renderPlayers(); }
    pushChat("sys", NET.peerName+" انضم إلى الغرفة"); return; }
  if(m.t==="start"){ NET.lv=m.lv||"mid"; return; }
  if(m.t==="chat"){ pushChat("them", m.text); return; }
  if(m.t==="req"){                       /* الضيف يطلب رمية — المضيف يولّدها */
    if(NET.mode!=="host"||G.over||G.busy) return;
    const d=rollTurn(G.players[1]);
    NET.send({t:"turn", ...d});
    await runTurn(d); return; }
  if(m.t==="turn"){ if(G.busy&&G.turn===m.pi) return; await runTurn(m); return; }
  if(m.t==="ans"){ if(remoteResolve) remoteResolve(!!m.correct); return; }
  if(m.t==="bye"){ pushChat("sys",NET.peerName+" غادر"); onDrop(); return; }
}
function onConnected(isHost){
  closeSheet();
  const lv=NET.lv;
  startGame("duo",lv);
  NET.on=true;
  G.players[0].name = isHost? NET.myName : NET.peerName;
  G.players[1].name = isHost? NET.peerName : NET.myName;
  G.players.forEach((p,i)=>p.human=(i===NET.me));
  renderPlayers(); updateCtl();
  setHint(NET.me===0?`دورك — اضغط الزهر`:`دور ${esc(G.players[0].name)}`);
  showChat(true);
  pushChat("sys","بدأت الجولة. بالتوفيق!");
  SFX.right();
}

/* ---------------- المحادثة ---------------- */
function pushChat(who,text){
  NET.chat.push({who,text,at:Date.now()});
  if(NET.chat.length>120) NET.chat.shift();
  const box=document.getElementById("chatList");
  if(box){ renderChat(); }
  const panel=document.getElementById("chatPanel");
  if(!panel||!panel.classList.contains("on")){ NET.unread++; updateChatBtn(); if(who!=="sys") SFX.hover(); }
}
function renderChat(){
  const box=document.getElementById("chatList"); if(!box) return;
  box.innerHTML=NET.chat.map(c=>{
    if(c.who==="sys") return `<div class="cmsg sys">${esc(c.text)}</div>`;
    const mine=c.who==="me";
    return `<div class="cmsg ${mine?"me":"them"}">
      <span class="who">${mine?esc(NET.myName):esc(NET.peerName)}</span>${esc(c.text)}</div>`;
  }).join("");
  box.scrollTop=box.scrollHeight;
}
function updateChatBtn(){
  const b=document.getElementById("chatBtn"); if(!b) return;
  b.style.display=NET.on||NET.chat.length?"":"none";
  const n=b.querySelector(".cbadge");
  if(n){ n.textContent=AR(NET.unread); n.style.display=NET.unread?"":"none"; }
}
function showChat(on){
  const b=document.getElementById("chatBtn"); if(b) b.style.display=on?"":"none";
  updateChatBtn();
}
function toggleChat(){
  const p=document.getElementById("chatPanel"); if(!p) return;
  const on=!p.classList.contains("on");
  p.classList.toggle("on",on);
  if(on){ NET.unread=0; updateChatBtn(); renderChat();
    const i=document.getElementById("chatInput"); if(i&&i.focus) i.focus(); }
}
function sendChat(){
  const i=document.getElementById("chatInput"); if(!i) return;
  const t=(i.value||"").trim().slice(0,200); if(!t) return;
  i.value="";
  pushChat("me",t); NET.send({t:"chat", text:t});
}

<script>
/* ================================================================
   غلاف التطبيق — يجعل الملف يعمل كتطبيق مستقل لا كصفحة متصفح
   ================================================================ */
(function(){
  const bootEl=document.getElementById("boot");
  const barEl=document.getElementById("bootBar");
  const statusEl=document.getElementById("bootStatus");
  const launchBtn=document.getElementById("btnLaunch");
  const installBtn=document.getElementById("btnInstall");
  const hintEl=document.getElementById("bootHint");
  const fsBtn=document.getElementById("btnFs");
  const isFile = location.protocol==="file:";
  const standalone = matchMedia("(display-mode: standalone)").matches ||
                     matchMedia("(display-mode: fullscreen)").matches ||
                     navigator.standalone===true;
  document.body.classList.add("appmode");

  /* ---------- أيقونة التطبيق تُرسم برمجياً ---------- */
  function iconDataURL(size){
    const c=document.createElement("canvas"); c.width=c.height=size;
    const g=c.getContext("2d"), S=size;
    const bg=g.createLinearGradient(0,0,S,S);
    bg.addColorStop(0,"#FBF2DC"); bg.addColorStop(1,"#F2E2B4");
    g.fillStyle=bg; g.fillRect(0,0,S,S);
    /* شبكة مربعات */
    const pad=S*0.13, cell=(S-pad*2)/5;
    const cols=["#E4EEFB","#FCEFDC","#E2F3EA","#EEE9FB"];
    for(let r=0;r<5;r++)for(let q=0;q<5;q++){
      g.fillStyle=cols[(r+q)%4];
      const x=pad+q*cell, y=pad+r*cell;
      g.beginPath();
      const rr=cell*0.16;
      g.moveTo(x+rr,y+1.5); g.arcTo(x+cell-1.5,y+1.5,x+cell-1.5,y+cell-1.5,rr);
      g.arcTo(x+cell-1.5,y+cell-1.5,x+1.5,y+cell-1.5,rr);
      g.arcTo(x+1.5,y+cell-1.5,x+1.5,y+1.5,rr);
      g.arcTo(x+1.5,y+1.5,x+cell-1.5,y+1.5,rr); g.closePath(); g.fill();
    }
    /* سلّم */
    const x1=pad+cell*0.8, y1=S-pad-cell*0.6, x2=S-pad-cell*0.8, y2=pad+cell*0.7;
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), nx=-dy/L, ny=dx/L, w=S*0.045;
    g.lineCap="round"; g.strokeStyle="#2F8F62"; g.lineWidth=S*0.035;
    [1,-1].forEach(s=>{g.beginPath();g.moveTo(x1+nx*w*s,y1+ny*w*s);g.lineTo(x2+nx*w*s,y2+ny*w*s);g.stroke();});
    g.strokeStyle="#7ACBA0"; g.lineWidth=S*0.026;
    for(let i=1;i<6;i++){const t=i/6,px=x1+dx*t,py=y1+dy*t;
      g.beginPath();g.moveTo(px+nx*w,py+ny*w);g.lineTo(px-nx*w,py-ny*w);g.stroke();}
    /* نرد ذهبي */
    const dS=S*0.30, dxp=S*0.60, dyp=S*0.60;
    g.fillStyle="#9A6E10"; g.beginPath();
    const rr2=dS*0.22;
    g.moveTo(dxp+rr2,dyp); g.arcTo(dxp+dS,dyp,dxp+dS,dyp+dS,rr2);
    g.arcTo(dxp+dS,dyp+dS,dxp,dyp+dS,rr2); g.arcTo(dxp,dyp+dS,dxp,dyp,rr2);
    g.arcTo(dxp,dyp,dxp+dS,dyp,rr2); g.closePath(); g.fill();
    g.fillStyle="#FFF";
    [[.26,.26],[.5,.5],[.74,.74]].forEach(p=>{
      g.beginPath(); g.arc(dxp+p[0]*dS,dyp+p[1]*dS,dS*0.085,0,7); g.fill();});
    return c.toDataURL("image/png");
  }
  /* الشعار في شاشة الإقلاع */
  try{
    const lg=document.getElementById("lg");
    if(lg){ const im=new Image(); im.onload=()=>lg.getContext("2d").drawImage(im,0,0,180,180);
      im.src=iconDataURL(180); }
  }catch(e){}

  /* ---------- بيان التطبيق وعامل الخدمة ---------- */
  function installManifest(){
    try{
      const icons=[192,512].map(sz=>({src:iconDataURL(sz),sizes:sz+"x"+sz,type:"image/png",purpose:"any maskable"}));
      const man={ name:"سُلّم الوقاية — برنامج الثقافة الأمنية", short_name:"سُلّم الوقاية",
        description:"لعبة لوحية تفاعلية للتوعية الأمنية", start_url:location.href,
        scope:"./", display:"standalone", display_override:["fullscreen","standalone"],
        orientation:"any", background_color:"#EFF4F8", theme_color:"#9A6E10", dir:"rtl", lang:"ar",
        categories:["education","games"], icons };
      const url=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
      const l=document.createElement("link"); l.rel="manifest"; l.href=url;
      document.head.appendChild(l);
      const al=document.createElement("link"); al.rel="apple-touch-icon"; al.href=icons[0].src;
      document.head.appendChild(al);
      return true;
    }catch(e){ return false; }
  }
  function installSW(){
    if(isFile || !("serviceWorker" in navigator)) return Promise.resolve(false);
    const code=`
      const C="sullam-v1";
      self.addEventListener("install",e=>{ self.skipWaiting();
        e.waitUntil(caches.open(C).then(c=>c.addAll([location.href.replace(/[^/]*$/,""),"${location.pathname}"]).catch(()=>{}))); });
      self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
      self.addEventListener("fetch",e=>{
        e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)
          .then(res=>{ const cp=res.clone();
            caches.open(C).then(c=>c.put(e.request,cp)).catch(()=>{}); return res; })
          .catch(()=>caches.match(location.pathname))));
      });`;
    try{
      const u=URL.createObjectURL(new Blob([code],{type:"text/javascript"}));
      return navigator.serviceWorker.register(u,{scope:"./"}).then(()=>true).catch(()=>false);
    }catch(e){ return Promise.resolve(false); }
  }

  /* ---------- ملء الشاشة وقفل الاتجاه ومنع الإطفاء ---------- */
  let wakeLock=null;
  async function goFullscreen(){
    const el=document.documentElement;
    try{
      if(!document.fullscreenElement){
        if(el.requestFullscreen) await el.requestFullscreen({navigationUI:"hide"});
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
    }catch(e){}
    try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock("any"); }catch(e){}
    try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){}
    syncFs();
  }
  function toggleFullscreen(){
    if(document.fullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else goFullscreen();
  }
  function syncFs(){
    const on=!!document.fullscreenElement;
    document.body.classList.toggle("fs",on);
    if(fsBtn) fsBtn.textContent = on ? "⤢" : "⛶";
  }
  document.addEventListener("fullscreenchange",syncFs);
  document.addEventListener("webkitfullscreenchange",syncFs);
  document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState==="visible"&&wakeLock===null){
      try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){}
    }
  });

  /* ---------- منع سلوك المتصفح داخل التطبيق ---------- */
  document.addEventListener("contextmenu",e=>{ if(!e.target.closest("input,textarea")) e.preventDefault(); });
  document.addEventListener("gesturestart",e=>e.preventDefault());
  document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
  let lastTouch=0;
  document.addEventListener("touchend",e=>{ const t=Date.now();
    if(t-lastTouch<320) e.preventDefault(); lastTouch=t; },{passive:false});
  addEventListener("keydown",e=>{
    if(e.key==="F11"){ e.preventDefault(); toggleFullscreen(); }
    if((e.ctrlKey||e.metaKey)&&["+","-","=","0"].includes(e.key)) e.preventDefault();
  });
  addEventListener("beforeunload",e=>{
    if(window.G && !window.G.over && window.G.players && window.G.players.some(p=>p.sq>0)){
      e.preventDefault(); e.returnValue="";
    }
  });

  /* ---------- زر التثبيت ---------- */
  let deferred=null;
  addEventListener("beforeinstallprompt",e=>{
    e.preventDefault(); deferred=e;
    if(installBtn && !standalone) installBtn.style.display="";
  });
  if(installBtn) installBtn.addEventListener("click",async()=>{
    if(!deferred) return;
    installBtn.style.display="none";
    deferred.prompt();
    try{ await deferred.userChoice; }catch(e){}
    deferred=null;
  });
  addEventListener("appinstalled",()=>{ if(installBtn) installBtn.style.display="none"; });

  /* ---------- تسلسل الإقلاع ---------- */
  const steps=[
    ["تهيئة واجهة التطبيق", ()=>{ installManifest(); }],
    ["تحضير اللوحة والمسارات", ()=>{}],
    ["تحميل بنك الأسئلة", ()=>{}],
    ["تجهيز العمل بلا إنترنت", ()=>installSW()],
    ["جاهز", ()=>{}]
  ];
  let done=0;
  function tickBoot(){
    const st=steps[done];
    if(!st){ finishBoot(); return; }
    if(statusEl) statusEl.textContent=st[0]+"…";
    Promise.resolve().then(st[1]).catch(()=>{}).then(()=>{
      done++;
      if(barEl) barEl.style.width=Math.round(done/steps.length*100)+"%";
      setTimeout(tickBoot, 230);
    });
  }
  function finishBoot(){
    if(statusEl) statusEl.textContent="";
    if(launchBtn) launchBtn.style.display="";
    if(hintEl){
      hintEl.innerHTML = standalone
        ? "يعمل الآن كتطبيق مستقل."
        : (isFile
          ? "يفتح الآن من ملف محلي. عند الضغط على <b>تشغيل التطبيق</b> ينتقل إلى ملء الشاشة بلا أي واجهة متصفح.<br>ولتثبيته بأيقونة على الجهاز ضعه على أي رابط ويب ثم اختر «تثبيت»."
          : "اضغط <b>تشغيل التطبيق</b> لملء الشاشة، أو <b>تثبيت على الجهاز</b> ليصبح بأيقونة مستقلة.");
    }
  }
  if(launchBtn) launchBtn.addEventListener("click",async()=>{
    try{ if(window.SFX){ SFX.init(); SFX.resume(); } }catch(e){}
    await goFullscreen();
    if(fsBtn) fsBtn.classList.add("on");
    bootEl.classList.add("gone");
    setTimeout(()=>{ bootEl.style.display="none";
      try{ if(typeof fitBoard==="function") fitBoard(); }catch(e){}
      dispatchEvent(new Event("resize"));
    },600);
  });
  if(fsBtn) fsBtn.addEventListener("click",toggleFullscreen);
  document.addEventListener("click",e=>{ if(e.target&&e.target.id==="fsToggle") toggleFullscreen(); });
  if(standalone && fsBtn) fsBtn.classList.add("on");
  setTimeout(tickBoot,320);
})();

</script>
</body>
</html>
