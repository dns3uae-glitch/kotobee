}
function onDrop(){
  if(!NET.on) return;
  NET.on=false; netStatus("انقطع الاتصال","bad");
  toast("انقطع الاتصال بصديقك");
  if(G&&!G.over){ G.players.forEach(p=>p.human=true); G.busy=false; updateCtl();
    setHint("انقطع الاتصال — يمكنكما إكمال الجولة على هذا الجهاز"); }
}
async function handleNet(m){
  if(m.t==="hi"){ NET.peerName=m.name||"صديقك";
    if(G){ G.players[1-NET.me].name=NET.peerName; renderPlayers(); }
    pushChat("sys", NET.peerName+" انضم إلى الغرفة"); return; }
  if(m.t==="start"){ NET.lv=m.lv||"mid"; return; }
  if(m.t==="chat"){ pushChat("them", m.text); return; }
  if(m.t==="req"){                       /* الضيف يطلب رمية — المضيف يولّدها */
    if(NET.mode!=="host"||!G||G.over) return;
    if(G.turn!==1) return;                          /* ليس دور الضيف */
    for(let i=0;i<200 && G.busy;i++) await sleep(60);
    if(G.over||G.turn!==1) return;
    if(G._servingReq) return; G._servingReq=true;
    const d=rollTurn(G.players[1]);
    NET.send({t:"turn", ...d});
    await runTurn(d);
    G._servingReq=false; return; }
  if(m.t==="turn"){
    if(!G||G.over) return;
    if(m.n && m.n<=(G.seq||0)) return;              /* دور نُفّذ سلفاً */
    G.seq=m.n||((G.seq||0)+1);
    for(let i=0;i<200 && G.busy;i++) await sleep(60); /* انتظر انتهاء ما يُعرض الآن */
    await runTurn(m); return; }
  if(m.t==="ans"){
    if(remoteResolve) remoteResolve(!!m.correct);
    else pendingAns={pi:m.pi, correct:!!m.correct};  /* وصلت مبكراً — احفظها */
    return; }
  if(m.t==="bye"){ pushChat("sys",NET.peerName+" غادر"); onDrop(); return; }
}
function onConnected(isHost){
  closeSheet();

  startGame("duo",lv);

  G.players[0].name = isHost? NET.myName : NET.peerName;
  G.players[1].name = isHost? NET.peerName : NET.myName;

}

/* ================================================================
   اتصال مباشر بلا خادم ربط
   يتبادل الجهازان رمزين نصّيين مرة واحدة (بالواتساب أو أي وسيلة)،

const DIRECT={ pc:null, dc:null, role:null, inviteCode:"", replyCode:"" };

function sdpPack(type,sdp){
  /* لا نحذف شيئاً: أي سطر محذوف قد يمنع الاتصال. نحذف الفارغ فقط. */
  const keep=sdp.split(/\r?\n/).filter(l=>l.length>0);
  const payload=JSON.stringify({t:type[0], s:keep.join("\n"), r:(type==="offer"?turnCfg():null)});
  try{ return btoa(unescape(encodeURIComponent(payload))).replace(/=+$/,""); }
  catch(e){ return payload; }
}
function sdpUnpack(code){
  const c=String(code||"").trim().replace(/\s+/g,"");
  if(!c) return null;
  let raw=c;
  try{ raw=decodeURIComponent(escape(atob(c))); }catch(e){}
  try{ const o=JSON.parse(raw);
    if(!o||!o.s) return null;
    return {type:o.t==="o"?"offer":"answer", sdp:o.s.endsWith("\n")?o.s:o.s+"\n", turn:o.r||null};
  }catch(e){ return null; }
}
/* مهايئ يجعل قناة البيانات تتصرف كاتصال الغرف نفسه */
function dcAdapter(dc){
  const h={open:[],data:[],close:[],error:[]};
  const a={ get open(){ return dc.readyState==="open"; },
    send(raw){ try{ dc.send(raw); }catch(e){} },
    close(){ try{ dc.close(); }catch(e){} },
    on(ev,fn){ if(h[ev]) h[ev].push(fn); } };
  dc.onopen=()=>h.open.forEach(f=>f());
  dc.onmessage=e=>h.data.forEach(f=>f(e.data));
  dc.onclose=()=>h.close.forEach(f=>f());
  dc.onerror=()=>h.error.forEach(f=>f());
  return a;
}
let DIAG={host:0, srflx:0, relay:0, state:"", failTimer:null};
let REMOTE_TURN=null;   /* خادم العبور الذي يرسله المضيف مع الدعوة */
function newPC(){
  const RTC=window.RTCPeerConnection||window.webkitRTCPeerConnection;
  if(!RTC) return null;
  const pc=new RTC({iceServers:iceList(REMOTE_TURN||undefined), iceCandidatePoolSize:4});
  DIAG={host:0,srflx:0,relay:0,state:"",failTimer:null};
  pc.addEventListener("icecandidate",e=>{
    const c=e.candidate&&e.candidate.candidate||"";
    if(/typ host/.test(c)) DIAG.host++;
    else if(/typ srflx/.test(c)) DIAG.srflx++;
    else if(/typ relay/.test(c)) DIAG.relay++;
    updateDiag();
  });
  pc.addEventListener("iceconnectionstatechange",()=>{
    DIAG.state=pc.iceConnectionState; updateDiag();
    if(pc.iceConnectionState==="failed") directFailed("لم يُعثر على مسار بين الجهازين.");
    if(pc.iceConnectionState==="connected"||pc.iceConnectionState==="completed"){
      clearTimeout(DIAG.failTimer); netStatus("متصل","ok"); }
  });
  return pc;
}
function diagText(){
  const parts=[];
  parts.push("مسارات محلية: "+AR(DIAG.host));
  parts.push("عبر الإنترنت: "+AR(DIAG.srflx));
  parts.push("عبر خادم عبور: "+AR(DIAG.relay));
  const st={"new":"تهيئة","checking":"يبحث عن مسار","connected":"متصل","completed":"متصل",
    "disconnected":"انقطع","failed":"فشل","closed":"مغلق"}[DIAG.state]||"—";
  return parts.join(" · ")+" · الحالة: "+st;
}
function updateDiag(){
  const el=document.getElementById("diagLine");
  if(el) el.textContent=diagText();
}
function armFailTimer(){
  clearTimeout(DIAG.failTimer);
  DIAG.failTimer=setTimeout(()=>{
    if(NET.on) return;
    let why="تعذّر إنشاء المسار بين الجهازين.";
    if(DIAG.srflx===0&&DIAG.relay===0)
      why="شبكتك لا تسمح بالاتصال: لم يُعثر على أي مسار خارجي.";
    else if(DIAG.relay===0)
      why="لا يوجد خادم عبور. حين تكونان على شبكتين مختلفتين لا بدّ منه.";
    directFailed(why);
  },26000);
}
function directFailed(why){
  clearTimeout(DIAG.failTimer);
  netStatus("فشل الاتصال","bad");
  const m=document.getElementById("dirMsg")||document.getElementById("dirMsg2");
  const needTurn=DIAG.relay===0;
  if(m) m.innerHTML=`<b style="color:var(--r-tx)">${esc(why)}</b><br>
    <span class="faint">${esc(diagText())}</span><br>
    ${needTurn?`<span style="color:var(--n8)">أضف خادم عبور مرة واحدة ليعمل بين أي شبكتين:</span>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm primary" data-act="turncfg">إعداد خادم العبور</button>
        <button class="btn sm" data-act="mail">اللعب بالمراسلة</button></div>`

}
/* انتظار اكتمال جمع المسارات */
function iceDone(pc,ms){
  return new Promise(res=>{
    if(pc.iceGatheringState==="complete") return res();
    let done=false;
    const fin=()=>{ if(done) return; done=true; res(); };
    pc.onicegatheringstatechange=()=>{ if(pc.iceGatheringState==="complete") fin(); };
    pc.onicecandidate=e=>{ if(!e.candidate) fin(); };
    setTimeout(fin, ms||6000);
  });
}

   بعد كل دور يُنتَج رمز قصير تُرسله بأي وسيلة، ويلصقه صديقك فيكمل.
   ================================================================ */
const MAIL={ on:false, me:0, lv:"mid", lastCode:"", lastMove:null };

/* ترميز الحالة كاملة في نص قصير */
function packState(){
  const st={
    v:1, t:G.turn, o:G.over?1:0, w:G.winner===null?-1:G.winner, lv:G.lv.id, x:G.extraRoll?1:0,
    p:G.players.map(p=>[p.sq,p.pts,p.right,p.wrong,p.streak,p.bestStreak,p.ladders,p.snakes,
      p.cats.cyber,p.cats.property,p.cats.traffic,p.cats.community, p.skip?1:0]),
    q:[G.pool.cyber,G.pool.property,G.pool.traffic,G.pool.community],
    m:MAIL.lastMove
  };
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(st)))).replace(/=+$/,""); }
  catch(e){ return JSON.stringify(st); }
}
function unpackState(code){
  const c=String(code||"").trim().replace(/\s+/g,"");
  if(!c) return null;
  let raw=c;
  try{ raw=decodeURIComponent(escape(atob(c))); }catch(e){}
  try{ const o=JSON.parse(raw); return (o&&o.v===1&&o.p&&o.p.length===2)?o:null; }
  catch(e){ return null; }
}
function applyState(st){
  startGame("duo", st.lv||"mid");
  MAIL.on=true; MAIL.lv=st.lv||"mid";
  G.turn=st.t; G.over=!!st.o; G.winner=st.w>=0?st.w:null; G.extraRoll=!!st.x;
  st.p.forEach((a,i)=>{ const p=G.players[i];
    p.sq=a[0]; p.pts=a[1]; p.right=a[2]; p.wrong=a[3]; p.streak=a[4]; p.bestStreak=a[5];
    p.ladders=a[6]; p.snakes=a[7];
    p.cats={cyber:a[8],property:a[9],traffic:a[10],community:a[11]};
    p.skip=!!a[12];
  });
  G.pool={cyber:st.q[0],property:st.q[1],traffic:st.q[2],community:st.q[3]};
  G.players.forEach((p,i)=>{ p.human=(i===MAIL.me);
    p.name = i===MAIL.me ? "أنت" : "صديقك"; });
  MAIL.lastMove=st.m||null;
  renderPlayers(); drawBoard(); updateCtl();
  return true;
}

  legacy:false, diag:{relay:"—", sub:"—", loop:"—", sent:0, got:0, err:"", legacy:false} };

function relayDiag(){
  const d=RELAY.diag;
  const el=document.getElementById("relayDiag");
  if(!el) return;
  el.innerHTML=`البناء: <b>${BUILD}</b> · القناة: <b class="num">sullam2-${esc(RELAY.code||"—")}</b> · الوسيط: <b>${esc(d.relay)}</b> · الاشتراك: <b>${esc(d.sub)}</b>
    · فحص ذاتي: <b>${esc(d.loop)}</b>${d.legacy?' · <b style="color:var(--a-tx)">شريك بنسخة قديمة</b>':""} · أُرسل: <b class="num">${AR(d.sent)}</b>
    · وصل: <b class="num">${AR(d.got)}</b>${d.err?` · <span style="color:var(--r-tx)">${esc(d.err)}</span>`:""}`;
}
const MQTT_SRC=[
  "https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js",
  "https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"
];
const BROKERS=[
  "wss://mqtt.eclipseprojects.io/mqtt",      /* المنفذ ٤٤٣ القياسي — نادراً ما يُحجب */
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://test.mosquitto.org:8081/"
];
/* وسيط بديل لا يحتاج أي مكتبة ويعمل على المنفذ ٤٤٣:
   الاشتراك عبر نافذة ويب مفتوحة، والإرسال عبر طلب عادي. */
const NTFY=["https://ntfy.sh","https://ntfy.envs.net","https://ntfy.tedomum.net"];
const COOL={};                       /* وسيط بلغ حدّه يُبرَّد مؤقتاً */
const coolOK=b=>!COOL[b]||Date.now()>COOL[b];
function ntfyConnect(code,isHost,onMsg,onOpen,onErr){
  const topic="sullam2-"+code;                       /* قناة واحدة مشتركة */
  const legIn ="sullam-"+code+"-"+(isHost?"h":"g");  /* توافق مع نسخة قديمة */
  const legOut="sullam-"+code+"-"+(isHost?"g":"h");
  const socks=[]; let anyOpen=false, opened=false;
  const seen=new Set();
  /* الاشتراك في كل الوسطاء معاً: يكفي أن ينجح واحد */
  NTFY.forEach(base=>{
    try{
      const ws=new WebSocket(base.replace(/^https/,"wss")+"/"+topic+"/ws");
      ws.onopen=()=>{ anyOpen=true;
        if(!opened){ opened=true;
          RELAY.diag.relay=AR(NTFY.length)+" وسطاء"; onOpen&&onOpen(); } };
      ws.onmessage=e=>{ let d; try{ d=JSON.parse(e.data); }catch(err){ return; }
        if(d.event!=="message"||!d.message) return;
        const key=d.message.length+"|"+String(d.message).slice(0,90);
        if(seen.has(key)) return;                    /* النسخة نفسها من وسيط آخر */
        seen.add(key); if(seen.size>400) seen.clear();
        onMsg(d.message);
      };
      socks.push({base,ws});
    }catch(e){}
    if(base===NTFY[0]){                              /* القناة القديمة على الأول فقط */
      try{
        const wl=new WebSocket(base.replace(/^https/,"wss")+"/"+legIn+"/ws");
        wl.onmessage=e=>{ let d; try{ d=JSON.parse(e.data); }catch(err){ return; }
          if(d.event!=="message"||!d.message) return; onMsg(d.message,true); };
        socks.push({base,ws:wl});
      }catch(e){}
    }
  });
  setTimeout(()=>{ if(!anyOpen) onErr&&onErr(); },9000);
  const post=(b,t,raw)=>{
    if(!coolOK(b)) return Promise.resolve(false);
    return fetch(b+"/"+t,{method:"POST",body:raw,headers:{"Content-Type":"text/plain"}})
      .then(r=>{
        if(r.status===429){ COOL[b]=Date.now()+90000;
          RELAY.diag.err="وسيط بلغ حدّه — نستخدم البدائل"; relayDiag(); return false; }
        if(!r.ok){ RELAY.diag.err="تعذّر الإرسال ("+r.status+")"; relayDiag(); return false; }
        RELAY.diag.err=""; relayDiag(); return true;
      }).catch(()=>false);
  };
  return {
    base:NTFY[0],
    send(raw){
      RELAY.diag.sent++; relayDiag();
      const live=NTFY.filter(coolOK);
      if(!live.length){ RELAY.diag.err="كل الوسطاء بلغوا حدّهم — انتظر دقيقة"; relayDiag(); return; }
      Promise.all(live.map(b=>post(b,topic,raw))).then(rs=>{
        if(rs.length&&!rs.some(Boolean)) RELAY.pubFail=(RELAY.pubFail||0)+1;
        else RELAY.pubFail=0;
      });
    },
    sendLegacy(raw){ post(NTFY[0],legOut,raw); },
    close(){ socks.forEach(o=>{ try{ o.ws.close(); }catch(e){} }); }
  };
}
async function loadMqtt(){
  if(window.mqtt) return true;
  for(const src of MQTT_SRC){ if(await loadOne(src)) if(window.mqtt) return true; }
  return !!window.mqtt;
}
function relayTopics(code,isHost){
  const b="sullam/"+code;
  return { out: b+(isHost?"/h2g":"/g2h"), in: b+(isHost?"/g2h":"/h2g") };
}
/* مهايئ يجعل الوسيط يتصرّف كاتصال الغرف نفسه */
function relayAdapter(client,topics){
  const h={open:[],data:[],close:[],error:[]};
  let opened=false;
  const a={ open:true,
    send(raw){ try{ client.publish(topics.out, raw, {qos:1}); }catch(e){} },
    close(){ try{ client.end(true); }catch(e){} },
    on(ev,fn){ if(h[ev]) h[ev].push(fn); },
    fireOpen(){ if(opened) return; opened=true; h.open.forEach(f=>f()); },
    fireData(m){ h.data.forEach(f=>f(m)); },
    fireClose(){ h.close.forEach(f=>f()); } };
  return a;
}
function relayConnect(code,isHost){ return relayStart(isHost,code); }
async function relayStart(isHost,code){
  RELAY.isHost=isHost; RELAY.code=code; RELAY.ready=false;
  if(RELAY.fresh){ RELAY.ntfyTry=0; RELAY.noNtfy=false; RELAY.tries=0; RELAY.fresh=false; }
  NET.mode=isHost?"host":"guest"; NET.code=code;
  const setMsg=(t,kind)=>{ netStatus(t,kind||"wait");
    const el=document.getElementById("relayMsg");
    if(el) el.innerHTML=(kind==="bad"?'<b style="color:var(--r-tx)">':'<span class="dotpulse"></span> ')+esc(t)+(kind==="bad"?"</b>":""); };
  let url=null;
  if(RELAY.noNtfy || (RELAY.ntfyTry||0)>=NTFY.length){
    setMsg("جارٍ تحميل وحدة الاتصال…");
    const okl=await loadMqtt();
    if(!okl){ setMsg("تعذّر تحميل وحدة الاتصال. تأكد من الإنترنت.","bad"); return; }
    url=BROKERS[Math.min(RELAY.tries,BROKERS.length-1)];
  }
  setMsg("جارٍ الاتصال بالوسيط"+(RELAY.tries?" (بديل "+AR(RELAY.tries+1)+")":"")+"…");
  const topics=relayTopics(code,isHost);
  /* ١) وسيط بلا مكتبة على المنفذ القياسي — الأنجح في الشبكات المقيّدة */
  if(!RELAY.noNtfy && (RELAY.ntfyTry||0)<NTFY.length){
    let bound2=false, adapter=null, joins=0, failed=0;
    const selfKey=Math.random().toString(36).slice(2,8);
    let conn=null, peerId=null;
    const wrap=o=>JSON.stringify({_i:MYID,_r:isHost?"h":"g",_v:NETVER,d:o});
    /* الطرفان يبثّان تعريفاً بأنفسهما؛ من يسمع الآخر يتصل.
       الدور يُحسم بمقارنة الهويتين، فلا يهم من ضغط «أنشئ» ومن ضغط «ادخل». */
    const startPings=()=>{
      clearInterval(RELAY.hb);
      let n=0;
      const ping=()=>{
        if(RELAY.ready){ clearInterval(RELAY.hb); return; }
        if(++n>12){ clearInterval(RELAY.hb);
          setMsg(RELAY.diag.err.indexOf("حدّه")>=0
            ? "الوسطاء المجانيون بلغوا حدّهم مؤقتاً."
            : "لم يظهر الطرف الآخر. تأكدا من كتابة الرمز نفسه ومن أن الاثنين على البناء ٣ب.","bad");
          offerMail(); return; }
        conn && conn.send(wrap({t:"hello",k:selfKey}));
        if(conn&&conn.sendLegacy&&n<4) conn.sendLegacy(JSON.stringify({t:isHost?"here":"join"}));
      };
      ping();
      RELAY.hb=setInterval(ping,4000);
    };
    const connectWith=(otherId)=>{
      if(RELAY.ready) return;
      RELAY.ready=true; clearInterval(RELAY.hb);
      peerId=otherId;
      const iAmFirst = String(MYID) < String(otherId);   /* حسم متماثل على الجهازين */
      NET.mode = iAmFirst ? "host" : "guest";
      NET.me   = iAmFirst ? 0 : 1;
      RELAY.isHost = iAmFirst;
      conn && conn.send(wrap({t:"hello",k:selfKey}));     /* تأكيد أخير للطرف الآخر */
      if(!bound2&&adapter){ bound2=true; bindConn(adapter.iface, iAmFirst); }
      setTimeout(()=>adapter&&adapter.iface.fireOpen(),60);
    };
    const handle=(txt,legacy)=>{
      let env; try{ env=JSON.parse(txt); }catch(e){ return; }
      if(legacy && !env._i){                     /* شريك بنسخة قديمة */
        const mm=env;
        if(mm.t==="selftest") return;
        RELAY.diag.got++; RELAY.diag.legacy=true; relayDiag();
        if(!RELAY.ready){
          if(isHost && mm.t==="join"){
            conn && conn.sendLegacy(JSON.stringify({t:"here"}));
            RELAY.ready=true; RELAY.legacy=true; clearInterval(RELAY.hb);
            if(!bound2&&adapter){ bound2=true; bindConn(adapter.iface,true); }
            setTimeout(()=>adapter&&adapter.iface.fireOpen(),60);
          } else if(!isHost && (mm.t==="here"||mm.t==="ok")){
            RELAY.ready=true; RELAY.legacy=true; clearInterval(RELAY.hb);
            conn && conn.sendLegacy(JSON.stringify({t:"ok"}));
            if(!bound2&&adapter){ bound2=true; bindConn(adapter.iface,false); }
            setTimeout(()=>adapter&&adapter.iface.fireOpen(),60);
          }
          return;
        }
        if(mm.t==="ok"||mm.t==="here"||mm.t==="join") return;
        if(adapter) adapter.iface.fireData(txt);
        return;
      }
      if(!env||!env._i) return;
      if(env._i===MYID){                                  /* صدى رسالتي */
        if(env.d&&env.d.t==="selftest"&&env.d.k===selfKey){
          selfOK=true; clearTimeout(selfTimer);
          RELAY.diag.loop="سليم"; relayDiag();
          setMsg("بانتظار الطرف الآخر…");
          startPings();
        }
        return;
      }
      RELAY.diag.got++; relayDiag();
      if(env._v!==NETVER){
        setMsg("نسخة الطرف الآخر مختلفة. اضغطا «تحديث النسخة الآن» على الجهازين.","bad");
        offerMail(); return;
      }
      const m=env.d||{};
      if(m.t==="selftest") return;
      if(m.t==="hello"){ connectWith(env._i); return; }
      if(!RELAY.ready) return;
      if(m.t==="msg" && adapter) adapter.iface.fireData(m.p);
    };
    let selfOK=false, selfTimer=null;
    conn=ntfyConnect(code,isHost,handle,
      ()=>{
        RELAY.diag.sub="متصل"; RELAY.diag.loop="جارٍ"; relayDiag();
        setMsg("جارٍ فحص الوسيط…");
        conn.send(wrap({t:"selftest",k:selfKey}));
        selfTimer=setTimeout(()=>{
          if(selfOK) return;
          RELAY.diag.loop="فشل"; relayDiag();
          setMsg("الوسيط لا يمرّر الرسائل.","bad"); offerMail();
        },8000);
      },
      ()=>{
        RELAY.diag.sub="فشل"; relayDiag();
        setMsg("تعذّر الاتصال بالوسطاء.","bad"); offerMail();
      });
    if(conn){
      const h={open:[],data:[],close:[],error:[]};
      const iface={ open:true,
        send(raw){ if(RELAY.legacy&&conn.sendLegacy) conn.sendLegacy(raw); else conn.send(wrap({t:"msg",p:raw})); },
        close(){ conn.close(); },
        on(ev,fn){ if(h[ev]) h[ev].push(fn); },
        fireOpen(){ h.open.forEach(f=>f()); },
        fireData(d){ h.data.forEach(f=>f(d)); } };
      adapter={ iface, send:r=>conn.send(r) };
      RELAY.client={ end(){ conn.close(); } };
    }
    return;
  }
  /* ٢) وسيط عبر المكتبة */
  let client;
  try{
    client=window.mqtt.connect(url,{
      clientId:"sullam_"+Math.random().toString(16).slice(2,10),
      keepalive:30, reconnectPeriod:0, connectTimeout:9000, clean:true });
  }catch(e){ setMsg("تعذّر بدء الاتصال.","bad"); return; }
  RELAY.client=client;
  const ad=relayAdapter(client,topics);
  let bound=false;
  client.on("connect",()=>{
    client.subscribe(topics.in,{qos:1},()=>{
      setMsg(isHost?"الغرفة مفتوحة — بانتظار صديقك":"جارٍ الانضمام…");
      clearInterval(RELAY.hb);
      if(isHost) return;                      /* المضيف ينتظر ولا يبثّ */
      let tries=0;
      const ping=()=>{
        if(RELAY.ready){ clearInterval(RELAY.hb); return; }
        if(++tries>14){ clearInterval(RELAY.hb);
          setMsg(RELAY.diag.err.indexOf("حدّه")>=0
            ? "الوسطاء المجانيون بلغوا حدّهم مؤقتاً."
            : "لم يردّ المضيف. تأكد من الرمز وأنه ما زال في شاشة الانتظار.","bad");
          offerMail(); return; }
        try{ client.publish(topics.out, JSON.stringify({t:"join"}), {qos:1}); }catch(e){}
      };
      ping(); RELAY.hb=setInterval(ping,2500);
    });
  });
  client.on("message",(tp,payload)=>{
    let m; try{ m=JSON.parse(payload.toString()); }catch(e){ return; }
    if(!RELAY.ready){
      if(isHost && m.t==="join"){
        try{ client.publish(topics.out, JSON.stringify({t:"here"}), {qos:1}); }catch(e){}
        RELAY.ready=true; clearInterval(RELAY.hb);
        if(!bound){ bound=true; bindConn(ad,isHost); }
        setTimeout(()=>ad.fireOpen(),60);
      } else if(!isHost && m.t==="here"){
        RELAY.ready=true; clearInterval(RELAY.hb);
        try{ client.publish(topics.out, JSON.stringify({t:"ok"}), {qos:1}); }catch(e){}
        if(!bound){ bound=true; bindConn(ad,isHost); }
        setTimeout(()=>ad.fireOpen(),60);
      }
      return;
    }
    if(isHost && m.t==="join"){ try{ client.publish(topics.out, JSON.stringify({t:"here"}), {qos:1}); }catch(e){} return; }
    if(m.t==="ok"||m.t==="here"||m.t==="join") return;
    if(m.t==="join"||m.t==="here") return;
    ad.fireData(payload.toString());
  });
  client.on("error",()=>{ if(!RELAY.ready) relayFail(isHost,code); });
  client.on("close",()=>{ if(RELAY.ready){ ad.fireClose(); } else relayFail(isHost,code); });
  setTimeout(()=>{ if(!RELAY.ready && !client.connected) relayFail(isHost,code); },11000);
}
function relayFail(isHost,code){
  try{ if(RELAY.client) RELAY.client.end(true); }catch(e){}
  RELAY.client=null;
  if(RELAY.tries<BROKERS.length-1){ RELAY.tries++; return relayStart(isHost,code); }
  netStatus("تعذّر الاتصال","bad");
  const el=document.getElementById("relayMsg");
  if(el) el.innerHTML='<b style="color:var(--r-tx)">تعذّر الوصول إلى أي وسيط. جرّب بيانات الجوال، أو استخدم «اللعب بالمراسلة» فهو يعمل دائماً.</b>';
}
function relayStop(){
  clearInterval(RELAY.hb);
  try{ if(RELAY.client) RELAY.client.end(true); }catch(e){}
  RELAY.client=null; RELAY.ready=false; RELAY.tries=0;
}

/* ---------------- المحادثة ---------------- */
function pushChat(who,text){
  NET.chat.push({who,text,at:Date.now()});
  if(NET.chat.length>120) NET.chat.shift();
  const box=document.getElementById("chatList");
  if(box){ renderChat(); }
  const panel=document.getElementById("chatPanel");
  if(!panel||!panel.classList.contains("on")){ NET.unread++; updateChatBtn(); if(who!=="sys") SFX.hover(); }
}
function renderChat(){
  const box=document.getElementById("chatList"); if(!box) return;
  box.innerHTML=NET.chat.map(c=>{
    if(c.who==="sys") return `<div class="cmsg sys">${esc(c.text)}</div>`;
    const mine=c.who==="me";
    return `<div class="cmsg ${mine?"me":"them"}">
      <span class="who">${mine?esc(NET.myName):esc(NET.peerName)}</span>${esc(c.text)}</div>`;
  }).join("");
  box.scrollTop=box.scrollHeight;
}
function updateChatBtn(){
  const b=document.getElementById("chatBtn"); if(!b) return;
  b.style.display=NET.on||NET.chat.length?"":"none";

function testTurn(){
  saveTurn();
  const msg=document.getElementById("turnMsg");
  const t=turnCfg();
  if(!t){ if(msg) msg.innerHTML='<b style="color:var(--r-tx)">اكتب عنوان الخادم أولاً.</b>'; return; }
  const RTC=window.RTCPeerConnection||window.webkitRTCPeerConnection;
  if(!RTC){ if(msg) msg.innerHTML='<b style="color:var(--r-tx)">متصفحك لا يدعم الاختبار.</b>'; return; }
  if(msg) msg.innerHTML='<span class="dotpulse"></span> جارٍ الاختبار…';
  let host=0,srflx=0,relay=0,done=false;
  const pc=new RTC({iceServers:iceList(), iceCandidatePoolSize:2});
  try{ pc.createDataChannel("t"); }catch(e){}
  pc.onicecandidate=e=>{
    const c=e.candidate&&e.candidate.candidate||"";
    if(/typ host/.test(c)) host++;
    else if(/typ srflx/.test(c)) srflx++;
    else if(/typ relay/.test(c)) relay++;
    if(msg&&!done) msg.innerHTML='<span class="dotpulse"></span> جارٍ الاختبار… عبور: <b class="num">'+AR(relay)+'</b>';
    if(!e.candidate) finish();
  };
  const finish=()=>{
    if(done) return; done=true;
    try{ pc.close(); }catch(e){}
    if(!msg) return;
    if(relay>0) msg.innerHTML=`<b style="color:var(--g-tx)">✓ يعمل — عُثر على ${AR(relay)} مسار عبور.</b><br>
      <span class="faint">يمكنكما الآن اللعب اللحظي من أي مكان. سيُرسَل الإعداد تلقائياً مع رمز الدعوة.</span>`;
    else if(srflx>0) msg.innerHTML=`<b style="color:var(--r-tx)">✗ لم يُعثر على مسار عبور.</b><br>
      <span class="faint">الاستكشاف يعمل (${AR(srflx)} مسار) لكن خادم العبور لم يستجب.
      تأكد من العنوان واسم المستخدم وكلمة المرور، وأن الحساب فعّال.</span>`;
    else msg.innerHTML=`<b style="color:var(--r-tx)">✗ لم يُعثر على أي مسار خارجي.</b><br>
      <span class="faint">قد تكون شبكتك تمنع ذلك تماماً. جرّب شبكة أخرى أو استخدم اللعب بالمراسلة.</span>`;
  };
  pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>finish());
  setTimeout(finish,9000);
}

let hostTry=0, hostBusy=false;
async function hostRoom(retry){
  if(hostBusy&&!retry) return;
  hostBusy=true;
  const nm=document.getElementById("myName");
  if(nm&&nm.value&&nm.value.trim()) NET.myName=nm.value.trim();
  if(NET.myName==="أنت") NET.myName="المضيف";
  NET.mode="host";
  if(!retry){ hostTry=0; NET.code=CODE(); }
  roomSheet(true,"جارٍ فتح الغرفة"+(hostTry?" (محاولة "+AR(hostTry+1)+")":"")+"…");
  netStatus("جارٍ فتح الغرفة…","wait");
  const okp=await loadPeer();
  if(!okp){ hostBusy=false;
    roomSheet(true,null,"تعذّر تحميل وحدة الاتصال. تأكد من الإنترنت ثم أعد المحاولة."); return; }
  try{ if(NET.peer) NET.peer.destroy(); }catch(e){}
  try{
    NET.peer=new Peer("sullam-"+NET.code, peerOpts(hostTry));
    let opened=false;
    NET.peer.on("open",()=>{ opened=true; hostBusy=false;
      netStatus("الغرفة مفتوحة — بانتظار صديقك","wait"); roomSheet(true); });
    NET.peer.on("connection",c=>bindConn(c,true));
    NET.peer.on("disconnected",()=>{ try{ NET.peer.reconnect(); }catch(e){} });
    NET.peer.on("error",e=>{
      const t=String(e&&e.type||"");
      if(t==="peer-unavailable") return;              /* لا يعني شيئاً للمضيف */
      if(t==="unavailable-id"){ NET.code=CODE(); return hostRoom(true); }
      if(opened && !FATAL.includes(t)) return;         /* خطأ عابر بعد الفتح */
      if(!opened && hostTry<SIGNALS.length-1){ hostTry++; return hostRoom(true); }
      hostBusy=false;
      roomSheet(true,null,errText(t)+" يمكنك إعادة المحاولة أو اللعب على جهاز واحد.");
    });
    setTimeout(()=>{ if(!opened){
      if(hostTry<SIGNALS.length-1){ hostTry++; hostRoom(true); }
      else { hostBusy=false; roomSheet(true,null,"لم يستجب خادم الربط. أعد المحاولة بعد قليل، أو استخدم وضع الجهاز الواحد."); }
    } },11000);
  }catch(e){ hostBusy=false; roomSheet(true,null,"تعذّر بدء الاتصال."); }
}

      if(NET.on) return;
      if(t==="peer-unavailable"){ const m=msg(); if(m) m.textContent=errText(t); return; }

const QBASE=JSON.parse(JSON.stringify(QUESTIONS));   /* البنك الأصلي المدمج */
let QCUSTOM={cyber:[],property:[],traffic:[],community:[]};
let QHIDDEN={};                                      /* أسئلة أصلية أُخفيت */

function qKey(cat,i){ return cat+":"+i; }
function rebuildBank(){
  Object.keys(QBASE).forEach(cat=>{
    const base=QBASE[cat].filter((_,i)=>!QHIDDEN[qKey(cat,i)]);
    QUESTIONS[cat]=base.concat(QCUSTOM[cat]||[]);
  });
  if(G){ G.pool={}; Object.keys(QUESTIONS).forEach(c=>G.pool[c]=shuffle(QUESTIONS[c].map((_,i)=>i))); }
}
async function loadQBank(){
  try{
    const d=await Store.get("lad_qbank");
    if(d&&d.custom){ QCUSTOM=Object.assign({cyber:[],property:[],traffic:[],community:[]},d.custom);
      QHIDDEN=d.hidden||{}; rebuildBank(); }
  }catch(e){}
}
async function saveQBank(){
  try{ await Store.set("lad_qbank",{custom:QCUSTOM,hidden:QHIDDEN}); }catch(e){}
  rebuildBank();
}
function qCount(cat){ return (QUESTIONS[cat]||[]).length; }
function qTotal(){ return Object.keys(QUESTIONS).reduce((s,c)=>s+qCount(c),0); }

const CATMAP={"رقمي":"cyber","الرقمي":"cyber","الأمن الرقمي":"cyber",
  "ممتلكات":"property","الممتلكات":"property","أمن الممتلكات":"property",
  "مروري":"traffic","المروري":"traffic","السلامة المرورية":"traffic",
  "مجتمعي":"community","المجتمعي":"community","الشراكة المجتمعية":"community",
  cyber:"cyber",property:"property",traffic:"traffic",community:"community"};
function parseBatch(text){
  const out={ok:0,bad:0,items:[],errors:[]};
  String(text||"").split(/\r?\n/).forEach((line,ln)=>{
    const t=line.trim();
    if(!t) return;
    /* صيغة JSON كاملة */
    if(t.startsWith("{")||t.startsWith("[")) return;
    const parts=t.split("|").map(x=>x.trim());
    if(parts.length<5){ out.bad++; out.errors.push("السطر "+AR(ln+1)+": الحقول ناقصة"); return; }
    const cat=CATMAP[parts[0]];
    if(!cat){ out.bad++; out.errors.push("السطر "+AR(ln+1)+": محور غير معروف «"+parts[0]+"»"); return; }
    const exp=parts[parts.length-1];
    const ansRaw=parts[parts.length-2];
    const ans=parseInt(String(ansRaw).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)),10);
    const q=parts[1];
    const opts=parts.slice(2,parts.length-2).filter(Boolean);
    if(!q||q.length<8){ out.bad++; out.errors.push("السطر "+AR(ln+1)+": السؤال قصير"); return; }
    if(opts.length<2){ out.bad++; out.errors.push("السطر "+AR(ln+1)+": خيارات ناقصة"); return; }
    if(!(ans>=1&&ans<=opts.length)){ out.bad++; out.errors.push("السطر "+AR(ln+1)+": رقم الإجابة خارج المدى"); return; }
    if(!exp||exp.length<8){ out.bad++; out.errors.push("السطر "+AR(ln+1)+": الشرح قصير"); return; }
    out.items.push({cat, item:{q, o:opts, a:ans-1, e:exp}});
    out.ok++;
  });
  return out;
}
async function qDoImport(){
  const txt=(document.getElementById("qIn")||{}).value||"";
  const msg=document.getElementById("qImsg");
  /* محاولة قراءة نسخة مصدَّرة كاملة */
  const t=txt.trim();
  if(t.startsWith("{")){
    try{
      const o=JSON.parse(t);
      if(o&&o.custom){
        Object.keys(o.custom).forEach(c=>{ if(QCUSTOM[c]) QCUSTOM[c]=QCUSTOM[c].concat(o.custom[c]||[]); });
        if(o.hidden) QHIDDEN=Object.assign(QHIDDEN,o.hidden);
        await saveQBank(); closeSheet(); openQAdmin(QEDIT.cat);
        toast("استُوردت النسخة"); return;
      }
    }catch(e){}
  }
  const r=parseBatch(txt);
  if(!r.ok){ if(msg) msg.innerHTML=`<b style="color:var(--r-tx)">لم يُقرأ أي سؤال.</b><br>
    <span class="faint">${esc((r.errors[0]||"تحقق من الصيغة"))}</span>`; return; }
  r.items.forEach(x=>{ QCUSTOM[x.cat]=QCUSTOM[x.cat]||[]; QCUSTOM[x.cat].push(x.item); });
  await saveQBank();
  closeSheet(); openQAdmin(QEDIT.cat);
  toast("أُضيف "+AR(r.ok)+" سؤالاً"+(r.bad?" · تُخطّي "+AR(r.bad):""));
}

(function wireForceUpdate(){
  window.forceUpdate=async function(){
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
        const rs=await navigator.serviceWorker.getRegistrations();
        for(const r of rs){ try{ await r.unregister(); }catch(e){} }
      }
      if(window.caches&&caches.keys){
        const ks=await caches.keys();
        for(const k of ks){ try{ await caches.delete(k); }catch(e){} }
      }
    }catch(e){}
    const u=location.href.split("#")[0].split("?")[0];
    location.replace(u+"?v="+Date.now());
  };
  document.addEventListener("click",e=>{
    const t=e.target&&e.target.closest&&e.target.closest("[data-forceupdate]");
    if(t){ e.preventDefault(); window.forceUpdate(); }
  });
})();

<script>
/* ================================================================
   غلاف التطبيق — يجعل الملف يعمل كتطبيق مستقل لا كصفحة متصفح
   ================================================================ */
(function(){
  const bootEl=document.getElementById("boot");
  const barEl=document.getElementById("bootBar");
  const statusEl=document.getElementById("bootStatus");
  const launchBtn=document.getElementById("btnLaunch");
  const installBtn=document.getElementById("btnInstall");
  const hintEl=document.getElementById("bootHint");
  const fsBtn=document.getElementById("btnFs");
  const isFile = location.protocol==="file:";
  const standalone = matchMedia("(display-mode: standalone)").matches ||
                     matchMedia("(display-mode: fullscreen)").matches ||
                     navigator.standalone===true;
  document.body.classList.add("appmode");

  /* ---------- أيقونة التطبيق تُرسم برمجياً ---------- */
  function iconDataURL(size){
    const c=document.createElement("canvas"); c.width=c.height=size;
    const g=c.getContext("2d"), S=size;
    const bg=g.createLinearGradient(0,0,S,S);
    bg.addColorStop(0,"#FBF2DC"); bg.addColorStop(1,"#F2E2B4");
    g.fillStyle=bg; g.fillRect(0,0,S,S);
    /* شبكة مربعات */
    const pad=S*0.13, cell=(S-pad*2)/5;
    const cols=["#E4EEFB","#FCEFDC","#E2F3EA","#EEE9FB"];
    for(let r=0;r<5;r++)for(let q=0;q<5;q++){
      g.fillStyle=cols[(r+q)%4];
      const x=pad+q*cell, y=pad+r*cell;
      g.beginPath();
      const rr=cell*0.16;
      g.moveTo(x+rr,y+1.5); g.arcTo(x+cell-1.5,y+1.5,x+cell-1.5,y+cell-1.5,rr);
      g.arcTo(x+cell-1.5,y+cell-1.5,x+1.5,y+cell-1.5,rr);
      g.arcTo(x+1.5,y+cell-1.5,x+1.5,y+1.5,rr);
      g.arcTo(x+1.5,y+1.5,x+cell-1.5,y+1.5,rr); g.closePath(); g.fill();
    }
    /* سلّم */
    const x1=pad+cell*0.8, y1=S-pad-cell*0.6, x2=S-pad-cell*0.8, y2=pad+cell*0.7;
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), nx=-dy/L, ny=dx/L, w=S*0.045;
    g.lineCap="round"; g.strokeStyle="#2F8F62"; g.lineWidth=S*0.035;
    [1,-1].forEach(s=>{g.beginPath();g.moveTo(x1+nx*w*s,y1+ny*w*s);g.lineTo(x2+nx*w*s,y2+ny*w*s);g.stroke();});
    g.strokeStyle="#7ACBA0"; g.lineWidth=S*0.026;
    for(let i=1;i<6;i++){const t=i/6,px=x1+dx*t,py=y1+dy*t;
      g.beginPath();g.moveTo(px+nx*w,py+ny*w);g.lineTo(px-nx*w,py-ny*w);g.stroke();}
    /* نرد ذهبي */
    const dS=S*0.30, dxp=S*0.60, dyp=S*0.60;
    g.fillStyle="#9A6E10"; g.beginPath();
    const rr2=dS*0.22;
    g.moveTo(dxp+rr2,dyp); g.arcTo(dxp+dS,dyp,dxp+dS,dyp+dS,rr2);
    g.arcTo(dxp+dS,dyp+dS,dxp,dyp+dS,rr2); g.arcTo(dxp,dyp+dS,dxp,dyp,rr2);
    g.arcTo(dxp,dyp,dxp+dS,dyp,rr2); g.closePath(); g.fill();
    g.fillStyle="#FFF";
    [[.26,.26],[.5,.5],[.74,.74]].forEach(p=>{
      g.beginPath(); g.arc(dxp+p[0]*dS,dyp+p[1]*dS,dS*0.085,0,7); g.fill();});
    return c.toDataURL("image/png");
  }
  /* الشعار في شاشة الإقلاع */
  try{
    const lg=document.getElementById("lg");
    if(lg){ const im=new Image(); im.onload=()=>lg.getContext("2d").drawImage(im,0,0,180,180);
      im.src=iconDataURL(180); }
  }catch(e){}

  /* ---------- بيان التطبيق وعامل الخدمة ---------- */
  function installManifest(){
    try{
      const icons=[192,512].map(sz=>({src:iconDataURL(sz),sizes:sz+"x"+sz,type:"image/png",purpose:"any maskable"}));
      const man={ name:"سُلّم الوقاية — برنامج الثقافة الأمنية", short_name:"سُلّم الوقاية",
        description:"لعبة لوحية تفاعلية للتوعية الأمنية", start_url:location.href,
        scope:"./", display:"standalone", display_override:["fullscreen","standalone"],
        orientation:"any", background_color:"#EFF4F8", theme_color:"#9A6E10", dir:"rtl", lang:"ar",
        categories:["education","games"], icons };
      const url=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
      const l=document.createElement("link"); l.rel="manifest"; l.href=url;
      document.head.appendChild(l);
      const al=document.createElement("link"); al.rel="apple-touch-icon"; al.href=icons[0].src;
      document.head.appendChild(al);
      return true;
    }catch(e){ return false; }
  }
  function installSW(){
    if(isFile || !("serviceWorker" in navigator)) return Promise.resolve(false);
    const code=`
      const C="sullam-b11";
      self.addEventListener("install",e=>{ self.skipWaiting();
        e.waitUntil(caches.open(C).then(c=>c.addAll([location.href.replace(/[^/]*$/,""),"${location.pathname}"]).catch(()=>{}))); });
      self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
      self.addEventListener("fetch",e=>{
        if(e.request.mode==="navigate"){          /* الصفحة نفسها من الشبكة أولاً */
          e.respondWith(fetch(e.request).catch(()=>caches.match(e.request).then(r=>r||caches.match(location.pathname))));
          return;
        }
        e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)
          .then(res=>{ const cp=res.clone();
            caches.open(C).then(c=>c.put(e.request,cp)).catch(()=>{}); return res; })
          .catch(()=>caches.match(location.pathname))));
      });`;
    try{
      const u=URL.createObjectURL(new Blob([code],{type:"text/javascript"}));
      return navigator.serviceWorker.register(u,{scope:"./"}).then(()=>true).catch(()=>false);
    }catch(e){ return Promise.resolve(false); }
  }

  /* ---------- ملء الشاشة وقفل الاتجاه ومنع الإطفاء ---------- */
  let wakeLock=null;
  async function goFullscreen(){
    const el=document.documentElement;
    try{
      if(!document.fullscreenElement){
        if(el.requestFullscreen) await el.requestFullscreen({navigationUI:"hide"});
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
    }catch(e){}
    try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock("any"); }catch(e){}
    try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){}
    syncFs();
  }
  function toggleFullscreen(){
    if(document.fullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else goFullscreen();
  }
  function syncFs(){
    const on=!!document.fullscreenElement;
    document.body.classList.toggle("fs",on);
    if(fsBtn) fsBtn.textContent = on ? "⤢" : "⛶";
  }
  document.addEventListener("fullscreenchange",syncFs);
  document.addEventListener("webkitfullscreenchange",syncFs);
  document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState==="visible"&&wakeLock===null){
      try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){}
    }
  });

  /* ---------- منع سلوك المتصفح داخل التطبيق ---------- */
  document.addEventListener("contextmenu",e=>{ if(!e.target.closest("input,textarea")) e.preventDefault(); });
  document.addEventListener("gesturestart",e=>e.preventDefault());
  document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
  let lastTouch=0;
  document.addEventListener("touchend",e=>{ const t=Date.now();
    if(t-lastTouch<320) e.preventDefault(); lastTouch=t; },{passive:false});
  addEventListener("keydown",e=>{
    if(e.key==="F11"){ e.preventDefault(); toggleFullscreen(); }
    if((e.ctrlKey||e.metaKey)&&["+","-","=","0"].includes(e.key)) e.preventDefault();
  });
  addEventListener("beforeunload",e=>{
    if(window.G && !window.G.over && window.G.players && window.G.players.some(p=>p.sq>0)){
      e.preventDefault(); e.returnValue="";
    }
  });

  /* ---------- زر التثبيت ---------- */
  let deferred=null;
  addEventListener("beforeinstallprompt",e=>{
    e.preventDefault(); deferred=e;
    if(installBtn && !standalone) installBtn.style.display="";
  });
  if(installBtn) installBtn.addEventListener("click",async()=>{
    if(!deferred) return;
    installBtn.style.display="none";
    deferred.prompt();
    try{ await deferred.userChoice; }catch(e){}
    deferred=null;
  });
  addEventListener("appinstalled",()=>{ if(installBtn) installBtn.style.display="none"; });

  /* ---------- تسلسل الإقلاع ---------- */
  const steps=[
    ["تهيئة واجهة التطبيق", ()=>{ installManifest(); }],
    ["تحضير اللوحة والمسارات", ()=>{}],
    ["تحميل بنك الأسئلة", ()=>{}],
    ["تجهيز العمل بلا إنترنت", ()=>installSW()],
    ["جاهز", ()=>{}]
  ];
  let done=0;
  function tickBoot(){
    const st=steps[done];
    if(!st){ finishBoot(); return; }
    if(statusEl) statusEl.textContent=st[0]+"…";
    Promise.resolve().then(st[1]).catch(()=>{}).then(()=>{
      done++;
      if(barEl) barEl.style.width=Math.round(done/steps.length*100)+"%";
      setTimeout(tickBoot, 230);
    });
  }
  function finishBoot(){
    if(statusEl) statusEl.textContent="البناء ١١";
    if(launchBtn) launchBtn.style.display="";
    if(hintEl){
      hintEl.innerHTML = standalone
        ? "يعمل الآن كتطبيق مستقل."
        : (isFile
          ? "يفتح الآن من ملف محلي. عند الضغط على <b>تشغيل التطبيق</b> ينتقل إلى ملء الشاشة بلا أي واجهة متصفح.<br>ولتثبيته بأيقونة على الجهاز ضعه على أي رابط ويب ثم اختر «تثبيت»."
          : "اضغط <b>تشغيل التطبيق</b> لملء الشاشة، أو <b>تثبيت على الجهاز</b> ليصبح بأيقونة مستقلة.");
    }
  }
  if(launchBtn) launchBtn.addEventListener("click",async()=>{
    try{ if(window.SFX){ SFX.init(); SFX.resume(); } }catch(e){}
    await goFullscreen();
    if(fsBtn) fsBtn.classList.add("on");
    bootEl.classList.add("gone");
    setTimeout(()=>{ bootEl.style.display="none";
      try{ if(typeof fitBoard==="function") fitBoard(); }catch(e){}
      dispatchEvent(new Event("resize"));
    },600);
  });
  if(fsBtn) fsBtn.addEventListener("click",toggleFullscreen);
  /* تحديث قسري: يمسح النسخة المخزّنة ويعيد التحميل من الشبكة */
  window.forceUpdate=async function(){
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
        const rs=await navigator.serviceWorker.getRegistrations();
        for(const r of rs){ try{ await r.unregister(); }catch(e){} }
      }
      if(window.caches&&caches.keys){
        const ks=await caches.keys();
        for(const k of ks){ try{ await caches.delete(k); }catch(e){} }
      }
    }catch(e){}
    const u=location.href.split("#")[0].split("?")[0];
    location.replace(u+"?v="+Date.now());
  };
  document.addEventListener("click",e=>{
    const t=e.target&&e.target.closest&&e.target.closest("[data-forceupdate]");
    if(t){ e.preventDefault(); window.forceUpdate(); }
  });
  document.addEventListener("click",e=>{ if(e.target&&e.target.id==="fsToggle") toggleFullscreen(); });
  if(standalone && fsBtn) fsBtn.classList.add("on");
  setTimeout(tickBoot,320);
})();














</script>
</body>
</html>
