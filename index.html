<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta property="og:type" content="website">
<meta property="og:title" content="سُلّم الوقاية — لعبة الثقافة الأمنية">
<meta property="og:description" content="ارمِ الزهر، أجب عن أسئلة الأمن الرقمي والسلامة المرورية وحماية الممتلكات، واصعد بمسارات الوعي واحذر منزلقات الغفلة.">
<meta property="og:locale" content="ar_AE">
<meta name="twitter:card" content="summary_large_image">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>سُلّم الوقاية</title>
<meta name="application-name" content="سُلّم الوقاية">
<meta name="apple-mobile-web-app-title" content="سُلّم الوقاية">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#124C5C">
<meta name="color-scheme" content="light">
<meta name="description" content="لعبة لوحية تفاعلية لبرنامج الثقافة الأمنية">
<style>
:root{
  --n0:#FFFFFF;--n1:#F7FAFC;--n2:#EFF4F8;--n3:#E4EBF1;--n4:#D3DDE6;
  --n5:#B6C4D0;--n6:#8397A8;--n7:#5A7085;--n8:#33465A;--n9:#16232F;
  --c-bg:#DDF2F5;--c-bd:#8ECFDA;--c-tx:#0A6B7C;--c-sd:#0A7C90;
  --b-bg:#E4EEFB;--b-bd:#9CC0E8;--b-tx:#17548F;--b-sd:#1B5FA8;
  --g-bg:#E2F3EA;--g-bd:#96CFB2;--g-tx:#175A3C;--g-sd:#1D6B47;
  --a-bg:#FCEFDC;--a-bd:#E4BE84;--a-tx:#7E4A08;--a-sd:#96590A;
  --r-bg:#FBE6E4;--r-bd:#E8A9A5;--r-tx:#96241F;--r-sd:#B32B25;
  --v-bg:#EEE9FB;--v-bd:#B9A6E4;--v-tx:#4C3487;--v-sd:#5B3FA0;
  --y-bg:#FBF2DC;--y-bd:#DCC079;--y-tx:#7A560A;--y-sd:#9A6E10;
  --bg:var(--n2);--panel:var(--n0);--line:var(--n4);--line2:var(--n5);
  --ink:var(--n9);--dim:var(--n7);--faint:var(--n6);
  --sh1:0 1px 2px rgba(22,35,47,.05);
  --shadow:0 1px 2px rgba(22,35,47,.06),0 2px 8px rgba(22,35,47,.05);
  --shadow-lg:0 6px 24px rgba(22,35,47,.14);
  --ar:"Dubai","Noto Kufi Arabic","Segoe UI","Tajawal",Tahoma,Arial,sans-serif;
  --num:"Segoe UI",Tahoma,Arial,sans-serif;
  --r:6px;--r-lg:12px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--ar)}
:focus-visible{outline:2px solid var(--c-sd);outline-offset:2px}
.num{font-family:var(--num);direction:ltr;display:inline-block}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:clamp(26px,6vw,52px)}h2{font-size:clamp(17px,3vw,24px)}
h3{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.08em}
p{margin:0 0 .7em}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--y-sd);font-weight:700}

#app{position:fixed;inset:0;display:none;grid-template-rows:auto 1fr auto;
  padding:var(--st) var(--sr) var(--sb) var(--sl)}
#app.on{display:grid}

/* شريط اللاعبين */
.players{display:flex;gap:8px;padding:8px 10px;background:var(--n0);border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);z-index:3;align-items:stretch}
.pl{flex:1;display:flex;align-items:center;gap:9px;border:2px solid var(--line);border-radius:var(--r-lg);
  padding:7px 11px;background:var(--n1);transition:.2s;min-width:0}
.pl.turn{border-color:var(--tc);background:var(--tbg);box-shadow:var(--shadow)}
.pl .av{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-size:16px;
  flex:none;color:#FFF;font-weight:800}
.pl .nm{font-size:13.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sq{font-size:11.5px;color:var(--dim)}
.pl .pts{margin-inline-start:auto;font-family:var(--num);font-weight:800;font-size:17px;text-align:center;line-height:1}
.pl .pts small{display:block;font-size:9.5px;font-weight:400;color:var(--faint);font-family:var(--ar)}
.streak{font-size:10.5px;background:var(--y-bg);color:var(--y-tx);border:1px solid var(--y-bd);
  border-radius:99px;padding:0 6px;font-weight:700}

/* اللوحة */
.boardwrap{position:relative;min-height:0;display:block;padding:0;overflow:hidden;
  background:linear-gradient(180deg,#EAF3FA 0%,#F3F7FA 55%,#EFF4F8 100%)}
.boardwrap::before,.boardwrap::after{content:"";position:absolute;border-radius:99px;
  background:radial-gradient(circle at 35% 40%, rgba(255,255,255,.95), rgba(255,255,255,.55));
  filter:blur(1px);pointer-events:none}
.boardwrap::before{width:190px;height:70px;top:8%;inset-inline-start:-70px;animation:cloud 34s linear infinite}
.boardwrap::after{width:140px;height:54px;bottom:12%;inset-inline-end:-60px;animation:cloud2 46s linear infinite}
@keyframes cloud{to{transform:translateX(130vw)}}
@keyframes cloud2{to{transform:translateX(-130vw)}}
#board{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.zonekey{position:absolute;top:6px;inset-inline-start:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.zk{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid}

/* شريط التحكم */
.ctrl{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--n0);
  border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(22,35,47,.06);flex-wrap:wrap;justify-content:center}
#dice{width:62px;height:62px;border-radius:14px;background:var(--n0);border:2px solid var(--n8);
  display:grid;place-items:center;box-shadow:var(--shadow);flex:none;position:relative}
#dice canvas{display:block}
#dice.roll{animation:sh .5s ease}
@keyframes sh{0%,100%{transform:none}25%{transform:rotate(-14deg) scale(1.06)}
  50%{transform:rotate(12deg) scale(1.09)}75%{transform:rotate(-7deg) scale(1.04)}}
.hint{font-size:clamp(13px,1.8vmin,15px);color:var(--ink);font-weight:600;text-align:center;flex:1;min-width:140px}
.hint b{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;
  border:1px solid var(--line2);background:var(--n0);border-radius:var(--r);box-shadow:var(--shadow);
  font-size:14.5px;font-weight:600;transition:.14s;min-height:44px}
.btn:hover{border-color:var(--y-sd);color:var(--y-tx);background:var(--y-bg)}
.btn.primary{border-color:#8A6210;background:var(--y-sd);color:#FFF}
.btn.primary:hover{background:var(--y-tx);color:#FFF;box-shadow:var(--shadow-lg)}
.btn.big{padding:13px 26px;font-size:16px;min-height:52px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:12.5px}
.btn[disabled]{opacity:.35;pointer-events:none}
.iconbtn{width:38px;height:38px;border:1px solid var(--line2);border-radius:var(--r);display:grid;
  place-items:center;color:var(--dim);font-size:15px;background:var(--n0);flex:none}
.iconbtn:hover{border-color:var(--y-sd);color:var(--y-tx);background:var(--y-bg)}

/* اللوحات */
.veil{position:fixed;inset:0;z-index:40;background:rgba(22,35,47,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:12px}
.veil.on{display:flex}
.sheet{width:100%;max-width:600px;max-height:min(92vh,92dvh);overflow:auto;border:1px solid var(--line);
  background:var(--n0);box-shadow:var(--shadow-lg);border-radius:var(--r-lg);
  padding:clamp(15px,3vw,24px);animation:rise .26s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.qcat{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;
  font-size:12px;font-weight:700;border:1px solid}
.qtext{font-size:clamp(16px,2.4vw,19px);font-weight:700;line-height:1.7;margin:12px 0 14px}
.opt{display:block;width:100%;text-align:start;padding:12px 15px;border:1.5px solid var(--line);
  border-radius:var(--r);background:var(--n0);box-shadow:var(--sh1);margin-bottom:8px;
  font-size:14.5px;line-height:1.6;transition:.14s;min-height:46px}
.opt:hover{border-color:var(--y-sd);background:var(--y-bg)}
.opt.right{border-color:var(--g-sd);background:var(--g-bg);color:var(--g-tx);font-weight:700}
.opt.wrong{border-color:var(--r-sd);background:var(--r-bg);color:var(--r-tx)}
.opt.mute{opacity:.55}
.opt .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:99px;
  background:var(--n2);color:var(--n7);font-family:var(--num);font-size:12px;font-weight:700;
  margin-inline-end:9px;vertical-align:-5px}
.opt.right .k{background:var(--g-sd);color:#FFF}
.opt.wrong .k{background:var(--r-sd);color:#FFF}
.timer{height:6px;background:var(--n3);border-radius:99px;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;background:var(--c-sd);transition:width .2s linear}

.card{border:1px solid var(--line);background:var(--n0);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--n3);flex-wrap:wrap}
.row:last-child{border:0}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;
  font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill.red{background:var(--r-bg);color:var(--r-tx);border-color:var(--r-bd)}
.pill.amber{background:var(--a-bg);color:var(--a-tx);border-color:var(--a-bd)}
.pill.blue{background:var(--b-bg);color:var(--b-tx);border-color:var(--b-bd)}
.pill.green{background:var(--g-bg);color:var(--g-tx);border-color:var(--g-bd)}
.pill.cyan{background:var(--c-bg);color:var(--c-tx);border-color:var(--c-bd)}
.pill.violet{background:var(--v-bg);color:var(--v-tx);border-color:var(--v-bd)}
.pill.gold{background:var(--y-bg);color:var(--y-tx);border-color:var(--y-bd)}
.pill.gray{background:var(--n2);color:var(--n7);border-color:var(--n4)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--n0);
  box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl caption{text-align:start;padding:11px 13px 9px;font-weight:700;font-size:14px;
  border-bottom:1px solid var(--line);background:var(--n1)}
table.tbl caption small{display:block;font-weight:400;color:var(--dim);font-size:12px;margin-top:2px}
table.tbl th{background:var(--n1);color:var(--n8);font-weight:700;font-size:12px;padding:9px 11px;
  text-align:start;border-bottom:2px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 11px;border-bottom:1px solid var(--n3)}
table.tbl tbody tr:nth-child(even){background:var(--n1)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td.num,table.tbl th.num{font-family:var(--num);direction:ltr;text-align:center;white-space:nowrap}
table.tbl tfoot td{background:var(--n2);font-weight:700;border-top:2px solid var(--line)}
.mini{height:6px;background:var(--n3);border-radius:99px;overflow:hidden;min-width:54px}
.mini i{display:block;height:100%;border-radius:99px}

.screen{position:fixed;inset:0;z-index:30;overflow-y:auto;display:none;background:var(--bg);
  padding:var(--st) var(--sr) var(--sb) var(--sl)}
.screen.on{display:block}
.wrap{max-width:900px;margin:0 auto;padding:clamp(16px,3.5vw,34px)}
.cine{opacity:0;animation:cin .8s ease forwards}
@keyframes cin{from{opacity:0;filter:blur(6px);transform:translateY(8px)}to{opacity:1;filter:none}}
.menu-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:14px 16px;border:1px solid var(--line);border-inline-start:3px solid var(--line2);
  border-radius:var(--r);text-align:start;margin-bottom:8px;background:var(--n0);box-shadow:var(--shadow);transition:.15s}
.menu-item:hover{border-inline-start-color:var(--y-sd);padding-inline-start:22px;background:var(--y-bg)}
.menu-item .lbl{font-size:15.5px;font-weight:700}
.menu-item .meta{font-size:11.5px;color:var(--faint);flex:none}
.chip{display:inline-block;font-size:11.5px;padding:4px 11px;border:1px solid var(--line);
  border-radius:99px;color:var(--faint);background:var(--n1);margin:0 0 6px 6px}
.chip.won{border-color:var(--y-bd);color:var(--y-tx);background:var(--y-bg);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 96px);z-index:50;
  border:1px solid var(--y-bd);background:var(--n0);box-shadow:var(--shadow-lg);padding:10px 18px;
  border-radius:99px;color:var(--y-tx);font-size:13.5px;font-weight:700;pointer-events:none;
  max-width:92vw;text-align:center;animation:rise .25s}
.big-msg{position:fixed;inset:0;z-index:35;display:none;place-items:center;pointer-events:none}
.big-msg.on{display:grid}
.big-msg div{background:var(--n0);border:2px solid var(--mc);color:var(--mtx);box-shadow:var(--shadow-lg);
  padding:16px 30px;border-radius:var(--r-lg);font-size:clamp(19px,4vw,28px);font-weight:800;
  text-align:center;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.86)}}
/* شاشات قصيرة جداً: عمودان بدل ثلاثة صفوف */
@media (max-height:420px) and (min-width:640px){
  #app.on{grid-template-rows:1fr;grid-template-columns:minmax(0,1fr) minmax(150px,220px)}
  .boardwrap{grid-row:1;grid-column:1;padding:5px}
  .players{grid-row:1;grid-column:2;flex-direction:column;border-bottom:0;
    border-inline-start:1px solid var(--line);padding:6px;gap:6px;justify-content:flex-start}
  .pl{flex:none;padding:6px 9px}
  .pl .av{width:28px;height:28px;font-size:14px}
  .pl .nm{font-size:12.5px}.pl .sq{font-size:10.5px}.pl .pts{font-size:15px}
  .ctrl{grid-row:1;grid-column:2;align-self:end;border-top:0;background:transparent;
    box-shadow:none;padding:6px;gap:6px}
  #dice{width:48px;height:48px}
  .hint{font-size:11.5px;order:5;flex-basis:100%}
  .btn.big{padding:9px 14px;font-size:13.5px;min-height:40px}
  .iconbtn{width:32px;height:32px}
  .zonekey{display:none}
}
@media (max-height:340px){
  .sheet{padding:11px}
  .qtext{font-size:14px;margin:8px 0 10px}
  .opt{padding:8px 11px;min-height:38px;font-size:13px}
}

/* ============ واجهة البداية ============ */
.hero{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(120% 90% at 78% -10%, #FDF6E3 0%, transparent 55%),
  radial-gradient(100% 80% at -10% 110%, #E2EEF8 0%, transparent 55%),
  linear-gradient(160deg,#FBFCFE 0%,#EFF4F8 60%,#E7EEF4 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px, rgba(90,112,133,.16) 1px, transparent 0);
  background-size:26px 26px;mask-image:radial-gradient(80% 70% at 50% 40%,#000,transparent)}
.hero-in{position:relative;z-index:2;min-height:100%;display:grid;align-content:center;
  gap:clamp(18px,3vh,30px);padding:clamp(20px,5vw,44px);max-width:1080px;margin:0 auto;
  grid-template-columns:1fr}
@media(min-width:860px){.hero-in{grid-template-columns:1.05fr .95fr;align-items:center}}
.brandmark{display:inline-flex;align-items:center;gap:10px;padding:6px 15px;border-radius:99px;
  background:var(--n0);border:1px solid var(--n4);box-shadow:var(--shadow);font-size:12px;
  font-weight:700;color:var(--n7);letter-spacing:.06em}
.brandmark i{width:9px;height:9px;border-radius:99px;background:var(--y-sd);font-style:normal;
  box-shadow:0 0 0 4px var(--y-bg)}
.hero h1{font-size:clamp(38px,9vw,74px);line-height:1.02;letter-spacing:-.01em;margin-top:14px}
.hero h1 span{color:var(--y-sd);position:relative;white-space:nowrap}
.hero h1 span::after{content:"";position:absolute;inset-inline:0;bottom:.08em;height:.16em;
  background:var(--y-bg);border-radius:99px;z-index:-1}
.hero .lede{font-size:clamp(15px,2.1vw,18.5px);color:var(--n7);max-width:40ch;margin-top:14px;line-height:1.8}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.fact{background:var(--n0);border:1px solid var(--n4);border-radius:var(--r);padding:9px 14px;
  box-shadow:var(--sh1);min-width:88px}
.fact b{display:block;font-family:var(--num);font-size:21px;font-weight:800;color:var(--n9);line-height:1.1}
.fact span{font-size:11.5px;color:var(--n7)}
/* لوحة مصغّرة زخرفية */
.mini-board{position:relative;aspect-ratio:1;width:min(100%,400px);margin-inline:auto;
  background:var(--n0);border:1px solid var(--n4);border-radius:18px;box-shadow:var(--shadow-lg);
  padding:12px;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:5px;
  transform:rotate(-3deg)}
.mini-board i{border-radius:5px;display:block}
.mini-board .mb-tok{position:absolute;width:12%;height:12%;border-radius:99px;border:2.5px solid #FFF;
  box-shadow:var(--shadow);animation:hop 3.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translate(0,0)}25%{transform:translate(-120%,-40%)}
  50%{transform:translate(-60%,-180%)}75%{transform:translate(80%,-120%)}}
.mini-cap{text-align:center;margin-top:14px;font-size:12px;color:var(--n7)}

/* ============ القائمة الرئيسية ============ */
.mgrid{display:grid;gap:11px;grid-template-columns:1fr}
@media(min-width:620px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{display:flex;align-items:center;gap:13px;padding:15px 16px;border:1px solid var(--n4);
  border-radius:var(--r-lg);background:var(--n0);box-shadow:var(--shadow);transition:.16s;text-align:start;
  width:100%;position:relative;overflow:hidden}
.mcard::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;
  background:var(--ac);opacity:.9}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--ac)}
.mcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;
  flex:none;background:var(--abg);border:1px solid var(--abd)}
.mcard .tx{min-width:0;flex:1}
.mcard .tt{font-size:16px;font-weight:700;line-height:1.25}
.mcard .ds{font-size:12.5px;color:var(--n7);margin-top:2px}
.mcard .go{font-size:18px;color:var(--n5);flex:none}
.mcard.wide{grid-column:1/-1}
.mcard.hero-card{background:linear-gradient(135deg,var(--y-bg),var(--n0) 65%)}

.statline{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.stat-b{background:var(--n0);border:1px solid var(--n4);border-radius:99px;padding:5px 13px;
  font-size:12.5px;color:var(--n7);box-shadow:var(--sh1)}
.stat-b b{color:var(--n9);font-family:var(--num);font-weight:800}
.srcnote{font-size:12px;color:var(--n6);background:var(--n1);border:1px dashed var(--n4);
  border-radius:var(--r);padding:9px 12px;line-height:1.7}


/* ============ حركة وتفاصيل الواجهة ============ */
#dice{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
#dice.landed{transform:scale(1.14);box-shadow:0 0 0 6px var(--y-bg),var(--shadow-lg)}
#dice::after{content:"";position:absolute;inset:-5px;border-radius:18px;border:2px solid var(--y-sd);
  opacity:0;transition:opacity .2s}
#btnRoll:not([disabled])~#dice::after,#dice:hover::after{opacity:.35}
#dice.ready{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 7px var(--y-bg),var(--shadow)}}

#btnRoll{position:relative;overflow:hidden}
#btnRoll::before{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 30%,rgba(255,255,255,.42) 50%,transparent 70%);
  transform:translateX(-120%);}
#btnRoll:not([disabled])::before{animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%,72%{transform:translateX(-120%)}88%,100%{transform:translateX(120%)}}
.btn:active{transform:translateY(1px) scale(.985)}

/* لاعب: شريط تقدّم نحو النهاية */
.pl{position:relative;overflow:hidden}
.pl .prog{position:absolute;inset-inline-start:0;bottom:0;height:3px;background:var(--tc);
  transition:width .6s cubic-bezier(.2,.8,.3,1);opacity:.75}
.pl.turn{animation:turnIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes turnIn{from{transform:scale(.97)}}
.pl .pts{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.pl.gain .pts{transform:scale(1.28)}
.streak{animation:flame 1.1s ease-in-out infinite}
@keyframes flame{50%{transform:translateY(-1.5px) scale(1.06)}}

/* السؤال: ظهور متتابع للخيارات */
.opt{animation:optIn .34s cubic-bezier(.2,.9,.3,1) both}
.opt:nth-child(1){animation-delay:.04s}.opt:nth-child(2){animation-delay:.1s}
.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.22s}
@keyframes optIn{from{opacity:0;transform:translateY(9px)}}
.opt{position:relative;overflow:hidden}
.opt::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:0;
  background:currentColor;opacity:.07;transition:width .35s}
.opt.right::after,.opt.wrong::after{width:100%}
.opt.right{animation:okPop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes okPop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
.opt.wrong{animation:noShake .38s}
@keyframes noShake{20%{transform:translateX(-5px)}45%{transform:translateX(5px)}
  70%{transform:translateX(-3px)}100%{transform:none}}
.qtext{animation:optIn .4s cubic-bezier(.2,.9,.3,1) both}
.timer i{transition:width .1s linear,background .4s}

/* بطاقات القائمة: دخول متدرّج */
.mcard{animation:cardIn .5s cubic-bezier(.2,.9,.3,1) both}
.mcard:nth-child(1){animation-delay:.02s}.mcard:nth-child(2){animation-delay:.07s}
.mcard:nth-child(3){animation-delay:.12s}.mcard:nth-child(4){animation-delay:.17s}
.mcard:nth-child(5){animation-delay:.22s}.mcard:nth-child(6){animation-delay:.27s}
.mcard:nth-child(7){animation-delay:.32s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}}
.mcard .go{transition:transform .2s}
.mcard:hover .go{transform:translateX(-4px)}
.mcard .ic{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.mcard:hover .ic{transform:scale(1.08) rotate(-4deg)}

/* الجداول والبطاقات */
.tbl-wrap{animation:optIn .45s cubic-bezier(.2,.9,.3,1) both}
.card{transition:box-shadow .2s,transform .2s}
.chip.won{animation:okPop .5s cubic-bezier(.34,1.56,.64,1) both}
.fact{transition:transform .25s}
.fact:hover{transform:translateY(-3px)}

/* شارة الرسالة الكبيرة */
.big-msg div{backdrop-filter:blur(2px)}
.big-msg.on div{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}

/* شريط تقدّم أعلى الشاشة أثناء دور الخصم */
#turnbar{position:fixed;top:0;inset-inline:0;height:3px;z-index:45;background:transparent;pointer-events:none}
#turnbar i{display:block;height:100%;width:0;background:var(--tc,var(--y-sd));transition:width .3s linear}

/* توهج المربع الهدف */
@keyframes glowSq{0%,100%{opacity:.45}50%{opacity:.9}}


/* ============ بطاقة المربع ============ */
.veil{transition:background .3s,backdrop-filter .3s}
.veil.grow{background:rgba(22,35,47,0);backdrop-filter:blur(0)}
.veil.grow.lit{background:rgba(22,35,47,.55);backdrop-filter:blur(3px)}
.sheet.popin{animation:cardPop .5s cubic-bezier(.22,1.2,.36,1) both}
@keyframes cardPop{0%{opacity:0;transform:translateY(46px) scale(.86) rotate(-1.4deg)}
  62%{opacity:1;transform:translateY(-7px) scale(1.03) rotate(.5deg)}
  100%{opacity:1;transform:none}}
.sheet.popout{animation:cardOut .26s cubic-bezier(.5,0,.75,0) both}
@keyframes cardOut{to{opacity:0;transform:translateY(34px) scale(.9)}}


/* ============ الشبكة والمحادثة ============ */
.fld{width:100%;padding:11px 13px;border:1.5px solid var(--n4);border-radius:var(--r);
  background:var(--n0);font-family:var(--ar);font-size:15px;color:var(--ink);margin-top:5px}
.fld:focus{outline:none;border-color:var(--y-sd);box-shadow:0 0 0 3px var(--y-bg)}
.fld.codebox{font-family:var(--num);font-size:11px;line-height:1.45;direction:ltr;text-align:left;
  word-break:break-all;resize:vertical;min-height:74px;background:var(--n1)}
.fld.code{font-family:var(--num);letter-spacing:.34em;text-align:center;font-size:22px;font-weight:800;text-transform:uppercase}
.roomcode{font-size:clamp(30px,9vw,44px);font-weight:800;letter-spacing:.22em;color:var(--y-tx);
  background:var(--y-bg);border:2px dashed var(--y-bd);border-radius:var(--r-lg);padding:10px 6px;margin-top:6px;
  font-family:var(--num)}
.dotpulse{width:9px;height:9px;border-radius:99px;background:var(--c-sd);display:inline-block;
  animation:dp 1.1s ease-in-out infinite;flex:none}
@keyframes dp{50%{opacity:.25;transform:scale(.72)}}
.netpill{position:fixed;z-index:46;top:calc(var(--st) + 6px);inset-inline-end:8px;
  display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  background:var(--n0);border:1px solid var(--n4);border-radius:99px;padding:4px 11px;
  box-shadow:var(--shadow);color:var(--n7)}
.netpill i{width:7px;height:7px;border-radius:99px;background:var(--n5);flex:none}
.netpill.ok{color:var(--g-tx);border-color:var(--g-bd);background:var(--g-bg)}
.netpill.ok i{background:var(--g-sd)}
.netpill.wait{color:var(--a-tx);border-color:var(--a-bd);background:var(--a-bg)}
.netpill.wait i{background:var(--a-sd);animation:dp 1.1s infinite}
.netpill.bad{color:var(--r-tx);border-color:var(--r-bd);background:var(--r-bg)}
.netpill.bad i{background:var(--r-sd)}
.chatbtn{position:fixed;z-index:47;inset-inline-end:12px;bottom:calc(var(--sb) + 96px);
  width:52px;height:52px;border-radius:99px;background:var(--n0);border:2px solid var(--c-sd);
  color:var(--c-tx);font-size:22px;box-shadow:var(--shadow-lg);display:grid;place-items:center}
.chatbtn:hover{background:var(--c-bg)}
.cbadge{position:absolute;top:-4px;inset-inline-start:-4px;min-width:20px;height:20px;border-radius:99px;
  background:var(--r-sd);color:#FFF;font-size:11px;font-weight:800;display:grid;place-items:center;
  font-family:var(--num);padding:0 5px;border:2px solid var(--n0)}
.chatpanel{position:fixed;z-index:48;inset-inline-end:12px;bottom:calc(var(--sb) + 96px);
  width:min(330px,calc(100vw - 24px));max-height:min(62vh,460px);background:var(--n0);
  border:1px solid var(--n4);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  display:none;flex-direction:column;overflow:hidden}
.chatpanel.on{display:flex;animation:cardPop .34s cubic-bezier(.22,1.2,.36,1) both}
.chd{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;
  border-bottom:1px solid var(--n3);background:var(--n1);font-size:14px}
.cx{width:28px;height:28px;border-radius:8px;color:var(--n7)}
.cx:hover{background:var(--n2)}
.clist{flex:1;overflow-y:auto;padding:11px;display:flex;flex-direction:column;gap:7px;min-height:120px}
.cmsg{max-width:86%;padding:7px 11px;border-radius:12px;font-size:13.5px;line-height:1.6;
  animation:optIn .26s ease both;word-break:break-word}
.cmsg .who{display:block;font-size:10.5px;font-weight:700;opacity:.7;margin-bottom:1px}
.cmsg.me{align-self:flex-start;background:var(--b-bg);border:1px solid var(--b-bd);color:var(--b-tx)}
.cmsg.them{align-self:flex-end;background:var(--n2);border:1px solid var(--n4);color:var(--n8)}
.cmsg.sys{align-self:center;background:transparent;color:var(--n6);font-size:12px;text-align:center;border:0;padding:2px}
.cquick{display:flex;gap:5px;overflow-x:auto;padding:7px 11px 0;border-top:1px solid var(--n3)}
.cquick button{flex:none;font-size:12px;padding:5px 10px;border:1px solid var(--n4);border-radius:99px;
  background:var(--n1);color:var(--n7);white-space:nowrap}
.cquick button:hover{border-color:var(--c-sd);color:var(--c-tx);background:var(--c-bg)}
.cin{display:flex;gap:7px;padding:9px 11px}
.cin input{flex:1;min-width:0;padding:9px 11px;border:1.5px solid var(--n4);border-radius:var(--r);
  font-family:var(--ar);font-size:13.5px;color:var(--ink);background:var(--n0)}
.cin input:focus{outline:none;border-color:var(--c-sd)}
@media(max-width:520px){.chatpanel{inset-inline:12px;width:auto;bottom:calc(var(--sb) + 90px)}}


/* ============ توافق الشاشات: الشبكة والمراسلة ============ */
.sheet{overscroll-behavior:contain}
.fld,.fld.codebox,.cin input{font-size:16px}      /* يمنع تكبير آيفون التلقائي عند الكتابة */
.fld.code{font-size:22px}
.codebox{max-height:38vh}
.mgrid .mcard{min-height:64px}
.mcard .tt{font-size:clamp(14px,3.4vw,16px);line-height:1.3}
.mcard .ds{font-size:clamp(11px,2.6vw,12.5px);line-height:1.45}
.mcard .ic{width:clamp(38px,10vw,44px);height:clamp(38px,10vw,44px);font-size:clamp(17px,4.6vw,21px)}
.roomcode{word-break:break-all}

/* شاشات قصيرة: تقليص الغلاف حتى تظهر الأزرار */
@media (max-height:560px){
  .sheet{max-height:94vh;max-height:94dvh;padding:12px}
  .sheet h2{font-size:17px;margin:6px 0 8px!important}
  .codebox{min-height:56px;max-height:26vh;rows:2}
  .card{padding:10px}
  .roomcode{font-size:26px;padding:6px}
  .mgrid{gap:8px}
  .mcard{padding:10px 12px;min-height:56px}
  .chatpanel{max-height:78vh;bottom:calc(var(--sb) + 8px)}
  .chatbtn{width:44px;height:44px;font-size:18px;bottom:calc(var(--sb) + 8px)}
}
/* شاشات ضيقة جداً */
@media (max-width:360px){
  .roomcode{font-size:26px;letter-spacing:.14em}
  .btn{padding:9px 12px;font-size:13px}
  .btn.sm{padding:5px 9px;font-size:11.5px}
  .mcard .ds{display:none}
  .netpill{font-size:10.5px;padding:3px 8px}
}
/* شاشات كبيرة: لا تتمدد اللوحات بلا داعٍ */
@media (min-width:1200px){ .sheet{max-width:660px} }
/* لوحة المفاتيح المنبثقة على الجوال لا تغطي الحقل */
@supports (height:100dvh){ .veil{align-items:flex-start;padding-top:max(12px,4vh)} }
@media (min-height:620px){ .veil{align-items:center;padding-top:12px} }
/* الطباعة على الشاشات الكبيرة جداً */
@media (min-width:1600px){ body{font-size:16px} }

.advbox{grid-column:1/-1;border:1px solid var(--n4);border-radius:var(--r-lg);background:var(--n1);
  padding:10px 12px}
.advbox summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--n7);list-style:none}
.advbox summary::-webkit-details-marker{display:none}
.advbox summary::before{content:"▸ ";color:var(--n5)}
.advbox[open] summary::before{content:"▾ "}

/* ============ تحسينات الهاتف ============ */
@media (max-width:520px){
  .players{padding:5px 6px;gap:5px}
  .pl{padding:6px 8px;border-radius:12px}
  .pl .nm{font-size:12.5px}
  .pl .pts{font-size:13px}
  .pl .meta{font-size:10.5px}
  .zk{font-size:10px;padding:2px 7px}
  .zone-keys{gap:4px;padding:3px 6px}
  .ctrl{padding:7px 8px calc(7px + var(--sb))}
  .hint{font-size:12.5px}
  #dice{width:44px;height:44px}
  .btn.big{padding:10px 16px;font-size:14px}
}
@media (max-width:400px){
  .zone-keys{display:none}          /* المفاتيح تظهر في الأسئلة نفسها */
  .pl .meta{display:none}
}

/* ============ غلاف التطبيق ============ */
#boot{position:fixed;inset:0;z-index:90;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 10%, #FFFBEF 0%, #F1F5F9 55%, #E4EBF1 100%);
  transition:opacity .55s ease,visibility .55s}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
.boot-in{max-width:420px;width:100%}
.boot-logo{width:150px;height:150px;margin:0 auto 18px;border-radius:32px;background:var(--n0);
  box-shadow:0 18px 44px rgba(22,35,47,.18);display:grid;place-items:center;
  animation:logoIn .8s cubic-bezier(.2,.9,.3,1) both}
.boot-logo canvas{width:118px;height:118px;display:block}
@keyframes logoIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
.boot-name{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.01em;
  animation:logoIn .8s cubic-bezier(.2,.9,.3,1) .12s both}
.boot-name span{color:var(--y-sd)}
.boot-sub{font-size:12.5px;color:var(--n7);letter-spacing:.12em;margin-top:6px;
  animation:logoIn .8s ease .22s both}
.boot-bar{height:5px;background:var(--n3);border-radius:99px;overflow:hidden;margin:24px auto 10px;
  max-width:240px;animation:logoIn .6s ease .3s both}
.boot-bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--y-sd),var(--y-bd));transition:width .35s ease}
.boot-status{font-size:12.5px;color:var(--n6);min-height:20px;margin-bottom:18px}
.boot-hint{font-size:12px;color:var(--n6);margin-top:16px;line-height:1.8}
.boot-hint b{color:var(--n8)}
#btnLaunch{animation:logoIn .5s cubic-bezier(.34,1.56,.64,1) both}

.fsbtn{position:fixed;z-index:60;top:calc(var(--st) + 6px);inset-inline-start:6px;width:34px;height:34px;
  border-radius:9px;background:rgba(255,255,255,.86);border:1px solid var(--n4);color:var(--n7);
  display:none;place-items:center;font-size:14px;box-shadow:var(--sh1);backdrop-filter:blur(4px)}
.fsbtn.on{display:grid}
body.appmode{overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.fs .fsbtn{opacity:.45}
body.fs .fsbtn:hover{opacity:1}



























@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  #dice.ready{animation:none}
  #btnRoll::before{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="players" id="players"></div>
  <div class="boardwrap" id="boardwrap">
    <canvas id="board"></canvas>
    <div class="zonekey" id="zonekey"></div>
  </div>
  <div class="ctrl">
    <button class="iconbtn" id="btnMenu" title="القائمة">☰</button>
    <button class="iconbtn" id="btnGuide" title="دليل المسارات">◈</button>
    <div id="dice"><canvas id="dcv" width="48" height="48"></canvas></div>
    <div class="hint" id="hint">اضغط الزهر للبدء</div>
    <button class="btn primary big" id="btnRoll">ارمِ الزهر</button>
  </div>
</div>
<div id="turnbar"><i></i></div>
<div class="netpill" id="netPill" style="display:none"><i></i>مغلق</div>
<button class="chatbtn" id="chatBtn" style="display:none">💬<span class="cbadge">0</span></button>
<div class="chatpanel" id="chatPanel">
  <div class="chd"><b>المحادثة</b><button class="cx" id="chatClose">✕</button></div>
  <div class="clist" id="chatList"></div>
  <div class="cquick" id="cquick"></div>
  <div class="cin">
    <input id="chatInput" maxlength="200" placeholder="اكتب رسالة…">
    <button class="btn sm primary" id="chatSend">إرسال</button>
  </div>
</div>
<div class="big-msg" id="bigMsg"><div></div></div>
<div id="boot">
  <div class="boot-in">
    <div class="boot-logo"><canvas id="lg" width="180" height="180"></canvas></div>
    <div class="boot-name">سُلّم <span>الوقاية</span></div>
    <div class="boot-sub">برنامج الثقافة الأمنية · لعبة تفاعلية</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <div class="boot-status" id="bootStatus">جارٍ التحضير…</div>
    <button class="btn primary big" id="btnLaunch" style="display:none">تشغيل التطبيق</button>
    <button class="btn" id="btnInstall" style="display:none;margin-top:10px">تثبيت على الجهاز</button>
    <div class="boot-hint" id="bootHint"></div>
  </div>
</div>
<button class="fsbtn" id="btnFs" title="ملء الشاشة">⛶</button>
<div class="screen" id="screen"></div>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<script>
/* ================================================================
   الطبقة الأولى — البيانات
   لوحة سبعة في سبعة، ومساران يحملان معنى وقائياً لا مجرد صعود وهبوط.
   ================================================================ */

const CATS={
  cyber:    {n:"الأمن الرقمي",        icon:"🛡", c:"blue",  bg:"var(--b-bg)", bd:"var(--b-bd)", tx:"var(--b-tx)", sd:"var(--b-sd)",
             src:"حملة «كن واعياً» للتوعية بالاحتيال والابتزاز الإلكتروني"},
  property: {n:"أمن الممتلكات والسفر", icon:"🏠", c:"amber", bg:"var(--a-bg)", bd:"var(--a-bd)", tx:"var(--a-tx)", sd:"var(--a-sd)",
             src:"حملة «سافر بأمان وطمأنينة»"},
  traffic:  {n:"السلامة المرورية",     icon:"🚦", c:"green", bg:"var(--g-bg)", bd:"var(--g-bd)", tx:"var(--g-tx)", sd:"var(--g-sd)",
             src:"حملة «صيف بلا حوادث» وإرشادات سلامة الدراجات الكهربائية"},
  community:{n:"الشراكة المجتمعية والوقاية", icon:"🤝", c:"violet",bg:"var(--v-bg)", bd:"var(--v-bd)", tx:"var(--v-tx)", sd:"var(--v-sd)",
             src:"برنامج الثقافة الأمنية وحملة «الوعي يبدأ من المنزل» والمنصة التوعوية للوقاية من المخدرات"}
};
const SOURCE_NOTE="أُعدّت الأسئلة استرشاداً بالحملات التوعوية المعلنة للقيادة العامة لشرطة الشارقة. للتحقق من أي رقم أو إجراء يُرجع إلى القنوات الرسمية.";
const BOARD={
  cols:10, rows:5, size:10, tiers:2, perTier:50, last:100,
  /* يُضبط تلقائياً حسب شكل الشاشة */
  /* كل طبقة محور توعوي كامل */
  /* محوران في كل طابق: ربعان لكل محور */
  zoneOf(sq){
    const n=Math.max(1,Math.min(100,sq));
    if(n<=25) return "cyber";
    if(n<=50) return "property";
    if(n<=75) return "traffic";
    return "community";
  },
  tierOf(sq){ return Math.min(BOARD.tiers-1, Math.floor((Math.max(1,sq)-1)/BOARD.perTier)); },
  /* مسارات الحماية داخل الطبقات وبينها */

function sqPos(n){
  const C=BOARD.cols, R=BOARD.rows;          /* عشرة في خمسة لكل طابق */
  const idx=Math.max(1,Math.min(BOARD.last,n))-1;
  const tier=Math.floor(idx/BOARD.perTier);
  const i=idx%BOARD.perTier;
  const row=Math.floor(i/C), col=i%C;
  const c=(row%2===0)?(C-1-col):col;         /* البداية أسفل اليمين */
  return {col:c, row:R-1-row, tier};         /* الصف صفر في الأعلى */
}

const SFX=(()=>{let ctx,mas,muted=false;
 const on=()=>ctx&&!muted;
 function init(){if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{ctx=new AC();}catch(e){return false;}mas=ctx.createGain();mas.gain.value=.4;mas.connect(ctx.destination);return true;}
 const now=()=>ctx.currentTime;
 function tone(f,a,d,pk,ty,to){if(!on())return;
  const o=ctx.createOscillator();o.type=ty||"sine";o.frequency.setValueAtTime(f,now());
  if(to)o.frequency.exponentialRampToValueAtTime(to,now()+a+d);
  const g=ctx.createGain();g.gain.setValueAtTime(0,now());
  g.gain.linearRampToValueAtTime(pk,now()+a);g.gain.exponentialRampToValueAtTime(.0001,now()+a+d);
  o.connect(g);g.connect(mas);o.start();o.stop(now()+a+d+.02);}
 function noise(dur,pk,f,q){if(!on())return;
  const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),ch=b.getChannelData(0);

  const g=ctx.createGain();g.gain.setValueAtTime(pk,now());g.gain.exponentialRampToValueAtTime(.0001,now()+dur);
  s.connect(fl);fl.connect(g);g.connect(mas);s.start();}
 return{init,resume(){if(ctx&&ctx.state==="suspended")ctx.resume();},

<script>
/* ================================================================

   ================================================================ */
const bcv=$("#board"); let bx=bcv.getContext("2d");
let BW=0, BH=0, CELL=0, PAD=0;
/* الخلفية والمنصّات والسلالم تُرسم مرة واحدة في لوح مستقل، ثم تُنسخ كل إطار */
const STATIC={cv:null, cx:null, w:0, h:0, dirty:true, ok:false, offY:0, worldH:0};
function drawStaticInto(){
  drawJungleBase();
  const PS=Math.min(BW,BH);
  for(let t=0;t<BOARD.tiers;t++){
    const oy=-t*(ISO.tierGap||0);
    palm(BW*0.07,oy+BH*0.40,PS/520,t);
    palm(BW*0.93,oy+BH*0.34,PS/580,1.4+t);
    palm(BW*0.16,oy+BH*0.95,PS/470,2.6+t);
    palm(BW*0.85,oy+BH*0.97,PS/500,3.9+t);
  }
  const order=[];
  for(let n=1;n<=BOARD.last;n++) order.push({n,d:isoPos(n).y});
  order.sort((u,v)=>u.d-v.d);
  order.forEach(o=>tile(o.n));
  tierLabels();
  BOARD.ladders.forEach((l,i)=>drawLadder(l,i));
}
function buildStatic(){
  const dpr=bx.__dpr||1;
  /* العالم أطول من الشاشة بمقدار الطوابق فوقها */
  STATIC.offY=(BOARD.tiers-1)*(ISO.tierGap||0);
  STATIC.worldH=BH+STATIC.offY;
  try{
    if(!STATIC.cv) STATIC.cv=document.createElement("canvas");
    STATIC.cv.width=Math.round(BW*dpr);
    STATIC.cv.height=Math.round(STATIC.worldH*dpr);
    STATIC.cx=STATIC.cv.getContext("2d");
    if(!STATIC.cx) throw new Error("no ctx");
    const real=bx;
    bx=STATIC.cx;
    /* الإزاحة تجعل الطوابق العليا (إحداثياتها سالبة) داخل حدود اللوح */
    bx.setTransform(dpr,0,0,dpr,0,STATIC.offY*dpr); bx.__dpr=dpr;
    bx.clearRect(0,-STATIC.offY,BW,STATIC.worldH);
    drawStaticInto();
    bx=real; bx.setTransform(dpr,0,0,dpr,0,0);
    STATIC.ok=true;
  }catch(e){
    try{ bx=bcv.getContext("2d"); bx.__dpr=dpr; bx.setTransform(dpr,0,0,dpr,0,0); }catch(e2){}
    STATIC.ok=false;
  }
  STATIC.w=BW; STATIC.h=BH; STATIC.dirty=false;
}
/* جسيمات احتفالية على اللوحة */
const PARTS=[];
const REDUCED = typeof matchMedia!=="undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(kind){
  if(!G||!BW||REDUCED) return;
  const p=G.players[G.turn];
  const x=p.sq>=1?cx0(p.sq):PAD+CELL*0.5, y=p.sq>=1?cy0(p.sq):PAD+BOARD.size*CELL;
  const cols= kind==="ladder"? ["#2F8F62","#7ACBA0","#D4A93A"]
            : kind==="win"?    ["#D4A93A","#F2DA9C","#1B5FA8","#B32B25","#1D6B47"]
            :                  ["#D4A93A","#F2DA9C","#4FBE8A"];
  const n= kind==="win"?70:26;

}
function stepParts(){

}
function drawParts(){

/* كاميرا اللوحة: تقريب ناعم أثناء الانتقالات */
const CAM={z:1, tz:1, x:0, y:0, tx:0, ty:0, shake:0};
/* أُلغي التقريب: تبقى اللوحة كاملة دائماً، ولا يبقى إلا اهتزاز خفيف عند المنزلق */
function camTo(){ CAM.tz=1; CAM.tx=BW/2; CAM.ty=BH/2; }
function camReset(){ CAM.tz=1; CAM.tx=BW/2; CAM.ty=BH/2; }
/* الكاميرا ترتفع مع الطبقة: نتابع الطبقة التي عليها اللاعب الحالي */
function tierFocus(){
  if(!G) return 0;
  const p=G.players[G.turn]||G.players[0];
  let t=BOARD.tierOf(Math.max(1,p.sq));
  if(G.anim){                                  /* أثناء الحركة تابع موضعها الحقيقي */
    const cur=G.players[G.anim.pi];
    if(cur) t=BOARD.tierOf(Math.max(1,cur.sq));
  }
  return t;
}
function camStepTier(){
  const t=tierFocus();
  const want=BH/2 - t*(ISO.tierGap||0);
  CAM.ty=want;
}
function camStep(){
  const k=0.085;
  CAM.z+=(CAM.tz-CAM.z)*k;
  CAM.x+=(CAM.tx-CAM.x)*k; CAM.y+=(CAM.ty-CAM.y)*k;
  if(CAM.shake>0) CAM.shake=Math.max(0,CAM.shake-0.05);
}
function camApply(){
  camStepTier();
  camStep();
  const sx=CAM.shake?(Math.random()-.5)*CAM.shake*16:0;
  const sy=CAM.shake?(Math.random()-.5)*CAM.shake*16:0;
  bx.save();
  bx.translate(BW/2+sx, BH/2+sy);
  bx.scale(CAM.z,CAM.z);
  bx.translate(-CAM.x,-CAM.y);
}
function fitBoard(){
  /* التنسيق يحدد حجم القماش على الشاشة؛ الشيفرة تضبط مخزن البكسل فقط،
     فلا يمكن أن يختلف ما يُرسم عمّا يُعرض. */
  const W=Math.max(200, bcv.clientWidth||0);
  const H=Math.max(160, bcv.clientHeight||0);
  const dpr=Math.min(devicePixelRatio||1,2);
  const bw=Math.round(W*dpr), bh=Math.round(H*dpr);
  if(bcv.width!==bw||bcv.height!==bh){ bcv.width=bw; bcv.height=bh; }
  bx.setTransform(dpr,0,0,dpr,0,0); bx.__dpr=dpr;
  if(BW!==W||BH!==H) STATIC.dirty=true;
  BW=W; BH=H;
  PAD=Math.min(W,H)*0.02; CELL=(Math.min(W,H)-PAD*2)/BOARD.size;
  CAM.x=CAM.tx=BW/2;
  if(!CAM.y){ CAM.y=CAM.ty=BH/2; }
}
function rr(x,y,w,h,r){bx.beginPath();bx.moveTo(x+r,y);bx.arcTo(x+w,y,x+w,y+h,r);
  bx.arcTo(x+w,y+h,x,y+h,r);bx.arcTo(x,y+h,x,y,r);bx.arcTo(x,y,x+w,y,r);bx.closePath();}
/* ============================================================
   لوحة أيزومترية بأسلوب الغابة: منصّات حجرية بارتفاع، وشلالات،

const ZCOL={
  cyber:    ["#8FC4E8","#5E93BE","#3C6787"],   /* أعلى · جانب · حافة */
  property: ["#F0C87A","#C29A४E".replace("४","4"),"#8E6B32"],

const ISO={ tw:0, th:0, h:0, ox:0, oy:0, lf:0.62 };   /* عرض المعيّن · ارتفاعه · سُمك المنصّة · معامل الارتفاع */

function outline(w){ bx.strokeStyle=INK; bx.lineWidth=Math.max(1.1,ISO.tw*(w||0.03));

/* حدود طبقة واحدة بوحدة عرض المنصّة */
function isoBounds(lf){
  const R=BOARD.rows, th=0.54, h=0.32;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(let i=1;i<=BOARD.perTier;i++){
    const p=sqPos(i);
    const x=(p.col-p.row)*0.5;
    const y=(p.col+p.row)*th*0.5-(R-1-p.row)*h*lf;
    if(x-0.5<minX) minX=x-0.5;
    if(x+0.5>maxX) maxX=x+0.5;
    if(y<minY) minY=y;
    if(y+th+h>maxY) maxY=y+th+h;
  }
  return {w:maxX-minX, h:maxY-minY, minX, minY};
}
/* الجوال الطولي يحتاج لوحة ضيقة عميقة، والشاشة العريضة لوحة عريضة قليلة العمق */
function setLayout(){
  const portrait = BW/Math.max(1,BH) < 1.25;
  const c = portrait ? 5 : 10, r = portrait ? 10 : 5;
  if(BOARD.cols!==c || BOARD.rows!==r){
    BOARD.cols=c; BOARD.rows=r; BOARD.size=Math.max(c,r);
    STATIC.dirty=true;
  }
}
function setupIso(){
  setLayout();
  const marginW=0.97, marginH=0.97;
  /* اختر أكبر معامل ارتفاع لا يجعل الطول هو القيد، فتبقى المنصّات كبيرة */
  let lf=0.25, best=null;
  for(let k=0;k<=24;k++){
    const cand=0.25+k*(2.20-0.25)/24;
    const b=isoBounds(cand);
    const twW=(BW*marginW)/b.w, twH=(BH*marginH)/b.h;
    const tw=Math.min(twW,twH);
    if(!best || tw>best.tw+0.001 || (Math.abs(tw-best.tw)<0.001 && cand>best.lf)){
      best={tw,lf:cand,b};
    }
  }
  lf=best.lf;
  ISO.lf=lf; ISO.tw=best.tw; ISO.th=ISO.tw*0.54; ISO.h=ISO.tw*0.32;
  const b=isoBounds(lf);
  ISO.ox=(BW-b.w*ISO.tw)/2 - b.minX*ISO.tw;
  ISO.oy=(BH-b.h*ISO.tw)/2 - b.minY*ISO.tw;
  /* المسافة الرأسية بين طبقة وأخرى */
  ISO.tierGap=b.h*ISO.tw + ISO.th*2.2;
  ISO.bh=b.h*ISO.tw;
}
/* مركز أعلى منصّة المربع n */
function isoPos(n){
  const p=sqPos(n);
  const c=p.col, r=p.row;
  const lift=(BOARD.rows-1-r)*ISO.h*ISO.lf;
  return { x: ISO.ox + (c-r)*ISO.tw*0.5,
           y: ISO.oy + (c+r)*ISO.th*0.5 - lift - p.tier*(ISO.tierGap||0),
           r, c, lift, tier:p.tier };
}

function tile(n){
  const P=isoPos(n), z=ZCOL[BOARD.zoneOf(n)];
  const isEnd=n===BOARD.last, sp=BOARD.special[n];
  const w=ISO.tw*0.5, h=ISO.th*0.5, d=ISO.h;
  const x=P.x, y=P.y;
  const bob=isEnd? Math.sin(T/620)*ISO.h*0.10 : 0;
  const Y=y-bob;
  /* ظل على ما تحته */
  bx.fillStyle="rgba(4,20,26,.30)";
  bx.beginPath(); bx.moveTo(x,Y+d*1.5); bx.lineTo(x+w,Y+h+d*1.5);
  bx.lineTo(x,Y+h*2+d*1.5); bx.lineTo(x-w,Y+h+d*1.5); bx.closePath(); bx.fill();
  /* الجانبان */
  bx.fillStyle=z[1];
  bx.beginPath(); bx.moveTo(x-w,Y+h); bx.lineTo(x,Y+h*2); bx.lineTo(x,Y+h*2+d);
  bx.lineTo(x-w,Y+h+d); bx.closePath(); bx.fill(); outline(0.022); bx.stroke();
  bx.fillStyle=z[2];
  bx.beginPath(); bx.moveTo(x+w,Y+h); bx.lineTo(x,Y+h*2); bx.lineTo(x,Y+h*2+d);
  bx.lineTo(x+w,Y+h+d); bx.closePath(); bx.fill(); outline(0.022); bx.stroke();
  /* السطح */
  bx.fillStyle= isEnd? "#E8C35A" : z[0];
  bx.beginPath(); bx.moveTo(x,Y); bx.lineTo(x+w,Y+h); bx.lineTo(x,Y+h*2); bx.lineTo(x-w,Y+h); bx.closePath();
  bx.fill(); outline(0.026); bx.stroke();
  /* حافة مضيئة تفصل المنصّة عن جارتها */
  bx.strokeStyle="rgba(255,255,255,.32)"; bx.lineWidth=Math.max(1,ISO.tw*0.022);
  bx.beginPath(); bx.moveTo(x-w,Y+h); bx.lineTo(x,Y); bx.lineTo(x+w,Y+h); bx.stroke();
  /* طحلب على الحافة */
  bx.fillStyle="rgba(96,160,86,.55)";
  bx.beginPath(); bx.moveTo(x-w,Y+h); bx.lineTo(x,Y+h*2); bx.lineTo(x,Y+h*2+d*0.32);
  bx.lineTo(x-w,Y+h+d*0.32); bx.closePath(); bx.fill();
  /* الرقم */
  bx.textAlign="center"; bx.textBaseline="middle";
  bx.font=`800 ${Math.max(10,ISO.tw*0.30)}px ${"Segoe UI"},Tahoma`;
  bx.lineWidth=Math.max(2,ISO.tw*0.05); bx.strokeStyle="rgba(255,255,255,.85)";
  bx.strokeText(String(n), x, Y+h);
  bx.fillStyle="#152430"; bx.fillText(String(n), x, Y+h);
  if(isEnd){
    const pl=0.5;
    bx.save(); bx.globalAlpha=.35;
    bx.fillStyle="#FFE9A8";
    bx.beginPath(); bx.ellipse(x,Y+h,ISO.tw*(0.9+pl*0.1),ISO.th*(0.9+pl*0.1),0,0,7); bx.fill();
    bx.restore();
    bx.font=`${ISO.tw*0.36}px sans-serif`; bx.fillText("🏁",x,Y+h-ISO.th*0.62);
  }
  else if(sp){ const fl=Math.sin(T/520+n)*ISO.th*0.18;
    bx.font=`${ISO.tw*0.3}px sans-serif`;
    bx.fillText(sp.kind==="extra"?"⭐":"⏸", x, Y+h-ISO.th*0.75+fl); }
}

function drawLadder(l,idx){

  const A=isoPos(l.a), B2=isoPos(l.b);
  const x1=A.x, y1=A.y+ISO.th*0.5, x2=B2.x, y2=B2.y+ISO.th*0.5;
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
  const nx=-dy/L, ny=dx/L, w=ISO.tw*0.17;
  bx.save();
  bx.shadowColor="rgba(4,20,26,.5)"; bx.shadowBlur=ISO.tw*0.2; bx.shadowOffsetY=ISO.tw*0.06;
  [1,-1].forEach(sg=>{
    bx.strokeStyle="#8A5A2B"; bx.lineWidth=Math.max(2,ISO.tw*0.085);
    bx.beginPath(); bx.moveTo(x1+nx*w*sg,y1+ny*w*sg); bx.lineTo(x2+nx*w*sg,y2+ny*w*sg); bx.stroke();
  });
  bx.shadowColor="transparent"; bx.shadowBlur=0; bx.shadowOffsetY=0;
  [1,-1].forEach(sg=>{
    bx.strokeStyle=crossTier?"#E8B45A":"#D2853C"; bx.lineWidth=Math.max(1.4,ISO.tw*(crossTier?0.07:0.055));
    bx.beginPath(); bx.moveTo(x1+nx*w*sg,y1+ny*w*sg); bx.lineTo(x2+nx*w*sg,y2+ny*w*sg); bx.stroke();
  });
  const steps=Math.max(3,Math.round(L/(ISO.tw*0.42)));
  for(let i=1;i<steps;i++){ const t=i/steps, px=x1+dx*t, py=y1+dy*t;
    bx.strokeStyle="#B06B2E"; bx.lineWidth=Math.max(1.6,ISO.tw*0.055);
    bx.beginPath(); bx.moveTo(px+nx*w,py+ny*w); bx.lineTo(px-nx*w,py-ny*w); bx.stroke();
    bx.strokeStyle="rgba(255,225,170,.55)"; bx.lineWidth=Math.max(.8,ISO.tw*0.018);
    bx.beginPath(); bx.moveTo(px+nx*w,py+ny*w-1); bx.lineTo(px-nx*w,py-ny*w-1); bx.stroke();
  }
  /* بريق يصعد */
  const gt=((T/1500+idx*0.3)%1);
  bx.strokeStyle="rgba(255,255,255,.6)"; bx.lineWidth=Math.max(1.2,ISO.tw*0.045);
  bx.beginPath();
  bx.moveTo(x1+dx*gt+nx*w*1.1, y1+dy*gt+ny*w*1.1);
  bx.lineTo(x1+dx*gt-nx*w*1.1, y1+dy*gt-ny*w*1.1); bx.stroke();
  bx.restore();
}
/* ---------- ثعبان يتموّج ---------- */
const BLINK={};
/* ثعبان خفيف: مسار واحد بثلاث سماكات بدل ٦٤ تدرّجاً في كل إطار */
function drawSnake(sn,idx){
  const A=isoPos(sn.a), B2=isoPos(sn.b);
  const x1=A.x, y1=A.y+ISO.th*0.4, x2=B2.x, y2=B2.y+ISO.th*0.4;
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L;
  const N=30, amp=ISO.tw*0.30, waves=Math.max(1.4,L/(ISO.tw*3.0));
  const ph=T/1250+idx*1.7;
  const pts=[];
  for(let i=0;i<=N;i++){ const t=i/N;
    const off=Math.sin(t*Math.PI*waves-ph)*amp*(1-t*0.4);
    pts.push([x1+dx*t+nx*off, y1+dy*t+ny*off]);
  }
  const path=(from,to)=>{
    bx.beginPath(); bx.moveTo(pts[from][0],pts[from][1]);
    for(let i=from+1;i<=to;i++){
      const px=(pts[i-1][0]+pts[i][0])/2, py=(pts[i-1][1]+pts[i][1])/2;
      bx.quadraticCurveTo(pts[i-1][0],pts[i-1][1],px,py);
    }
    bx.lineTo(pts[to][0],pts[to][1]);
  };
  bx.save(); bx.globalAlpha=0.94;
  bx.lineCap="round"; bx.lineJoin="round";
  const seg=[[0,10,0.115],[10,20,0.085],[20,N,0.055]];  /* أنحف بكثير */
  /* حدّ خارجي */
  bx.strokeStyle="#2C4C33";
  seg.forEach(g=>{ bx.lineWidth=(ISO.tw*g[2]+ISO.tw*0.016)*2; path(g[0],g[1]); bx.stroke(); });
  /* الجسم */
  bx.strokeStyle="#A8C48C";
  seg.forEach(g=>{ bx.lineWidth=ISO.tw*g[2]*2; path(g[0],g[1]); bx.stroke(); });
  /* بطن فاتح */
  bx.strokeStyle="rgba(226,239,205,.55)";
  seg.forEach(g=>{ bx.lineWidth=ISO.tw*g[2]*0.9; path(g[0],g[1]); bx.stroke(); });
  /* بقع */
  bx.fillStyle="rgba(90,120,70,.45)";
  for(let i=3;i<N-2;i+=4){
    const r=ISO.tw*(0.115-0.06*(i/N))*0.40;
    bx.beginPath(); bx.ellipse(pts[i][0],pts[i][1],r,r*0.66,0,0,7); bx.fill();
  }
  /* الرأس */
  const ang=Math.atan2(pts[2][1]-y1,pts[2][0]-x1), R=ISO.tw*0.185;
  if(BLINK[idx]===undefined) BLINK[idx]=Math.random()*4000;
  const blink=((T+BLINK[idx])%3400)>3200;
  bx.save(); bx.translate(x1,y1); bx.rotate(ang);
  bx.beginPath(); bx.ellipse(0,0,R,R*0.74,0,0,7);
  bx.fillStyle="#B9D49A"; bx.fill();
  bx.strokeStyle=INK; bx.lineWidth=Math.max(1.1,ISO.tw*0.026); bx.stroke();
  [1,-1].forEach(sg=>{
    const ex=-R*0.14, ey=sg*R*0.34;
    if(blink){ bx.beginPath(); bx.moveTo(ex-R*0.16,ey); bx.lineTo(ex+R*0.16,ey); bx.stroke(); return; }
    bx.beginPath(); bx.ellipse(ex,ey,R*0.2,R*0.22,0,0,7);
    bx.fillStyle="#FFF8E8"; bx.fill(); bx.stroke();
    bx.beginPath(); bx.ellipse(ex-R*0.03,ey,R*0.095,R*0.13,0,0,7);
    bx.fillStyle=INK; bx.fill();
  });
  const tg=(Math.sin(T/380+idx)+1)/2;
  if(tg>0.62){ const tl=R*(0.45+tg*0.45);
    bx.strokeStyle="#E0405A"; bx.lineWidth=Math.max(1,R*0.09);
    bx.beginPath(); bx.moveTo(-R*0.9,0); bx.lineTo(-R*0.9-tl*0.6,0);
    bx.moveTo(-R*0.9-tl*0.6,0); bx.lineTo(-R*0.9-tl,-tl*0.3);
    bx.moveTo(-R*0.9-tl*0.6,0); bx.lineTo(-R*0.9-tl, tl*0.3); bx.stroke(); }
  bx.restore();
  bx.restore();
}
/* كائنات أخف */
function critters(){
  const tf=(G?BOARD.tierOf(Math.max(1,(G.players[G.turn]||G.players[0]).sq)):0);
  const oy=-tf*(ISO.tierGap||0);
  for(let i=0;i<5;i++){
    const t=T/1000+i*2.1;
    const x=BW*(0.1+0.8*((Math.sin(t*0.7+i)+1)/2));
    const y=oy+BH*(0.12+0.76*((Math.cos(t*0.5+i*1.7)+1)/2));
    const gl=(Math.sin(T/300+i*2)+1)/2;
    bx.globalAlpha=.3+gl*0.55;
    bx.fillStyle="#FFF3A8";
    bx.beginPath(); bx.arc(x,y,Math.min(BW,BH)*0.007*(0.7+gl*0.7),0,7); bx.fill();
  }
  bx.globalAlpha=1;
  [[0.22,0.42,"#FF9CC8"],[0.76,0.56,"#9CE0FF"]].forEach((f,i)=>{
    const t=T/1400+i*3;
    const x=BW*(f[0]+0.1*Math.sin(t*1.6)), y=oy+BH*(f[1]+0.07*Math.cos(t*2.1));
    const w=Math.min(BW,BH)*0.014, flap=Math.abs(Math.sin(T/110+i*2));
    bx.fillStyle=f[2]; bx.globalAlpha=.85;
    bx.beginPath(); bx.ellipse(x-w*0.7,y,w*(0.4+flap*0.7),w*0.9,-0.5,0,7); bx.fill();
    bx.beginPath(); bx.ellipse(x+w*0.7,y,w*(0.4+flap*0.7),w*0.9, 0.5,0,7); bx.fill();
  });
  bx.globalAlpha=1;
}

function drawBoard(){
  /* يُعاد الضبط كلما تغيّر حجم العرض الفعلي — يمنع القص نهائياً */
  if(!BW || (bcv.clientWidth||0)!==BW || (bcv.clientHeight||0)!==BH) fitBoard();
  setupIso();
  T=Date.now();
  if(STATIC.dirty || STATIC.w!==BW || STATIC.h!==BH) buildStatic();
  bx.setTransform(bx.__dpr||1,0,0,bx.__dpr||1,0,0);
  bx.clearRect(0,0,BW,BH);
  camApply();
  /* الطبقة الثابتة: خلفية ومنصّات وسلالم — وإن تعذّرت تُرسم مباشرة */
  if(STATIC.ok && STATIC.cv) bx.drawImage(STATIC.cv, 0, -STATIC.offY, BW, STATIC.worldH);
  else drawStaticInto();
  /* المتحرك فقط */
  waterStreaks();
  critters();
  BOARD.snakes.forEach((n,i)=>drawSnake(n,i));
  ladderShine();
  if(G&&G.landedOn){
    const P=isoPos(G.landedOn), w=ISO.tw*0.5, h=ISO.th*0.5;
    const pl=(Math.sin(T/300)+1)/2;
    bx.save(); bx.globalAlpha=.55+pl*0.4;
    bx.strokeStyle=PCOL[G.turn].sd; bx.lineWidth=Math.max(2,ISO.tw*0.06);
    bx.beginPath(); bx.moveTo(P.x,P.y); bx.lineTo(P.x+w,P.y+h);
    bx.lineTo(P.x,P.y+h*2); bx.lineTo(P.x-w,P.y+h); bx.closePath(); bx.stroke();
    bx.restore();
  }
  if(G&&G.land&&G.land.t>0){
    const P=isoPos(G.land.sq), q=G.land;
    bx.save(); bx.globalAlpha=q.t*0.5;
    bx.strokeStyle=PCOL[G.turn].sd; bx.lineWidth=Math.max(1.4,ISO.tw*0.04);
    bx.beginPath();
    bx.ellipse(P.x,P.y+ISO.th*0.5,ISO.tw*(0.3+(1-q.t)*0.6),ISO.th*(0.3+(1-q.t)*0.6),0,0,7);
    bx.stroke(); bx.restore(); q.t-=0.07; if(q.t<=0) G.land=null;
  }
  if(G){
    const list=G.players.map((p,i)=>({p,i,y:(p.sq>=1?isoPos(p.sq).y:BH)})).sort((u,v)=>u.y-v.y);
    list.forEach(({p,i})=>{
      if(p.sq<1){ drawToken(ISO.ox+(i? ISO.tw*0.5:-ISO.tw*0.5), Math.min(BH*0.94, ISO.oy+BOARD.size*ISO.th*0.95), i, p); return; }
      const anim=(G.anim&&G.anim.pi===i)?G.anim:null;
      const P=isoPos(p.sq);
      const x=anim?anim.x:P.x, y=anim?anim.y:P.y+ISO.th*0.5;
      drawToken(x+(i? ISO.tw*0.18:-ISO.tw*0.18), y, i, p);
    });
  }
  stepParts(); drawParts();
  bx.restore();
  vignette();
}
/* تعتيم لطيف عند الحواف يركّز النظر على اللوحة */
function vignette(){
  const g=bx.createRadialGradient(BW/2,BH*0.52,Math.min(BW,BH)*0.30,
                                  BW/2,BH*0.52,Math.max(BW,BH)*0.78);
  g.addColorStop(0,"rgba(0,0,0,0)");
  g.addColorStop(1,"rgba(3,18,28,.42)");
  bx.fillStyle=g; bx.fillRect(0,0,BW,BH);
}
/* خطوط الماء المتحركة فقط */
function waterStreaks(){
  bx.strokeStyle="rgba(255,255,255,.5)"; bx.lineWidth=Math.max(1,BW*0.004);
  const tf=(G?BOARD.tierOf(Math.max(1,(G.players[G.turn]||G.players[0]).sq)):0);
  const oy=-tf*(ISO.tierGap||0);
  [[0.06,0.30,0.09],[0.86,0.24,0.11],[0.42,0.62,0.07],[0.68,0.72,0.06]].forEach((f,i)=>{
    const x=BW*f[0], y=oy+BH*f[1], w=BW*f[2], h=BH*(0.42+i*0.05);
    for(let k=0;k<3;k++){
      const off=((T/(11+i*3)+k*110)%h);
      bx.globalAlpha=.45-(off/h)*0.4;
      bx.beginPath(); bx.moveTo(x+w*(0.25+k*0.25), y+off);
      bx.lineTo(x+w*(0.25+k*0.25), y+off+h*0.14); bx.stroke();
    }
    bx.globalAlpha=.14+Math.sin(T/420+i)*0.05;
    bx.fillStyle="#DCF5FC";
    bx.beginPath(); bx.ellipse(x+w/2,y+h,w*0.95,BH*0.022,0,0,7); bx.fill();
  });
  bx.globalAlpha=1;
}
/* بريق السلالم فقط (القوائم ثابتة في الطبقة السفلى) */
function ladderShine(){
  BOARD.ladders.forEach((l,idx)=>{
    const A=isoPos(l.a), B2=isoPos(l.b);
    const x1=A.x, y1=A.y+ISO.th*0.5, x2=B2.x, y2=B2.y+ISO.th*0.5;
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
    const nx=-dy/L, ny=dx/L, w=ISO.tw*0.19;
    const gt=((T/1500+idx*0.3)%1);
    bx.strokeStyle="rgba(255,255,255,.55)"; bx.lineWidth=Math.max(1.2,ISO.tw*0.045);
    bx.beginPath();
    bx.moveTo(x1+dx*gt+nx*w, y1+dy*gt+ny*w);
    bx.lineTo(x1+dx*gt-nx*w, y1+dy*gt-ny*w); bx.stroke();
  });
}

function drawToken(x,y,i,p){
  const R=ISO.tw*0.20;
  const A=(G && G.anim && G.anim.pi===i) ? G.anim : null;
  const walking = A && A.walk;
  const sliding = A && A.slide;
  let sx=1, sy=1, lean=0, bob=0;
  if(sliding){
    sy=1-(A.sp||0)*0.10; sx=1+(A.sp||0)*0.12; lean=(A.lean||0)*0.16*(A.sp||0);
  } else if(walking){
    /* المشي: تمايل خفيف جداً بدل انضغاط حاد */
    const ph=A.phase||0;
    const sw=Math.sin(ph*Math.PI*2);
    sy=1+Math.abs(Math.sin(ph*Math.PI))*0.035;
    sx=1-Math.abs(Math.sin(ph*Math.PI))*0.025;
    lean=(A.lean||0)*0.055 + sw*0.018;
    if(A.settle) { sy-= A.settle*0.03; sx+= A.settle*0.02; }
  } else {
    bob=Math.sin(T/620+i*2)*ISO.th*0.07;
  }
  const c=PCOL[i].sd;
  /* الظل يتبع القدم على الأرض لا الجسم */
  const ground = walking ? y + (Math.abs(Math.sin((A.phase||0)*Math.PI))*ISO.th*0.16) : y;
  bx.save();
  bx.globalAlpha=0.32;
  bx.beginPath(); bx.ellipse(x, ground+R*0.5, R*1.0, R*0.34, 0,0,7);
  bx.fillStyle="#04141A"; bx.fill();
  bx.restore();

  bx.save();
  bx.translate(x, y-R*0.9+bob);
  bx.rotate(lean);
  bx.scale(sx,sy);
  /* الساقان تتبادلان بسلاسة مع دورة المشي */
  const ph=A&&A.phase||0;
  const legA = walking ? Math.sin(ph*Math.PI*2)*R*0.42 : 0;
  const legB = walking ? Math.sin(ph*Math.PI*2+Math.PI)*R*0.42 : 0;
  const knee = walking ? Math.max(0,Math.cos(ph*Math.PI*2))*R*0.12 : 0;
  bx.strokeStyle="#3A4A5A"; bx.lineWidth=Math.max(1.6,R*0.3); bx.lineCap="round";
  bx.beginPath(); bx.moveTo(-R*0.2,R*0.55);
  bx.quadraticCurveTo(-R*0.2+legA*0.5, R*0.78-knee, -R*0.2+legA, R*0.98); bx.stroke();
  bx.beginPath(); bx.moveTo( R*0.2,R*0.55);
  bx.quadraticCurveTo( R*0.2+legB*0.5, R*0.78, R*0.2+legB, R*0.98); bx.stroke();
  /* الجسم */
  bx.beginPath();
  bx.moveTo(-R*0.5,R*0.6); bx.quadraticCurveTo(-R*0.62,-R*0.1,-R*0.34,-R*0.34);
  bx.lineTo(R*0.34,-R*0.34); bx.quadraticCurveTo(R*0.62,-R*0.1,R*0.5,R*0.6);
  bx.closePath();
  bx.fillStyle=c; bx.fill();
  bx.strokeStyle=INK; bx.lineWidth=Math.max(1.1,R*0.11); bx.stroke();
  /* الذراعان تتأرجحان عكس الساقين */
  const armA = walking ? Math.sin(ph*Math.PI*2+Math.PI)*R*0.34
             : (sliding? -R*0.45 : Math.sin(T/700+i)*R*0.08);
  const armB = walking ? Math.sin(ph*Math.PI*2)*R*0.34
             : (sliding? -R*0.45 : Math.sin(T/700+i+1)*R*0.08);
  bx.strokeStyle=c; bx.lineWidth=Math.max(1.4,R*0.26);
  bx.beginPath(); bx.moveTo(-R*0.44,-R*0.1); bx.lineTo(-R*0.58,R*0.34+armA); bx.stroke();
  bx.beginPath(); bx.moveTo( R*0.44,-R*0.1); bx.lineTo( R*0.58,R*0.34+armB); bx.stroke();
  /* الرأس */
  const headBob = walking ? Math.sin(ph*Math.PI*2)*R*0.03 : 0;
  bx.beginPath(); bx.arc(headBob,-R*0.78,R*0.52,0,7);
  bx.fillStyle="#F0C69A"; bx.fill();
  bx.strokeStyle=INK; bx.lineWidth=Math.max(1,R*0.1); bx.stroke();
  bx.beginPath(); bx.arc(headBob,-R*0.9,R*0.52,Math.PI*1.05,Math.PI*1.95);
  bx.fillStyle="#3A2A1E"; bx.fill();
  const look=A? (A.lean||0)*R*0.10 : Math.sin(T/900+i)*R*0.05;
  bx.fillStyle=INK;
  [-1,1].forEach(sg=>{ bx.beginPath(); bx.arc(sg*R*0.2+look+headBob,-R*0.8,R*0.085,0,7); bx.fill(); });
  bx.strokeStyle=INK; bx.lineWidth=Math.max(.9,R*0.07);
  bx.beginPath();
  if(walking||sliding) bx.arc(headBob,-R*0.66,R*0.2,0.14*Math.PI,0.86*Math.PI);
  else bx.arc(headBob,-R*0.68,R*0.19,0.2*Math.PI,0.8*Math.PI);
  bx.stroke();
  bx.restore();
  /* دلالة صاحب الدور في السكون فقط */
  if(G && !G.over && G.turn===i && !A){
    const pl=(Math.sin(T/300)+1)/2;
    const ay=y-R*3.0-Math.sin(T/380)*ISO.th*0.16;
    bx.beginPath(); bx.moveTo(x,ay+R*0.55); bx.lineTo(x-R*0.46,ay-R*0.2);
    bx.lineTo(x+R*0.46,ay-R*0.2); bx.closePath();
    bx.fillStyle=c; bx.globalAlpha=.75+pl*0.25; bx.fill();
    bx.globalAlpha=1; bx.strokeStyle=INK; bx.lineWidth=Math.max(1,R*0.09); bx.stroke();
    bx.beginPath(); bx.ellipse(x,y+R*0.5,R*(1.25+pl*0.2),R*(0.44+pl*0.08),0,0,7);
    bx.strokeStyle=c; bx.lineWidth=Math.max(1.2,R*0.14);
    bx.globalAlpha=.3+pl*0.35; bx.stroke(); bx.globalAlpha=1;
  }
}

/* الزهر */
const dcv=$("#dcv"), dx2=dcv.getContext("2d");
function drawDice(v){
  const S=48; dx2.clearRect(0,0,S,S);
  const g=dx2.createLinearGradient(0,0,S,S);
  g.addColorStop(0,"#FFFFFF"); g.addColorStop(1,"#F0F3F6");
  dx2.fillStyle=g;
  dx2.beginPath();
  const r=S*0.22;
  dx2.moveTo(r,1); dx2.arcTo(S-1,1,S-1,S-1,r); dx2.arcTo(S-1,S-1,1,S-1,r);
  dx2.arcTo(1,S-1,1,1,r); dx2.arcTo(1,1,S-1,1,r); dx2.closePath(); dx2.fill();
  dx2.strokeStyle="#1B2733"; dx2.lineWidth=2.6; dx2.stroke();
  dx2.save(); dx2.clip();
  dx2.fillStyle="rgba(255,255,255,.85)";
  dx2.beginPath(); dx2.ellipse(S*0.3,S*0.2,S*0.3,S*0.11,-0.4,0,7); dx2.fill();
  dx2.restore();
  const pips={1:[[.5,.5]],2:[[.28,.28],[.72,.72]],3:[[.26,.26],[.5,.5],[.74,.74]],
    4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],
    5:[[.26,.26],[.74,.26],[.5,.5],[.26,.74],[.74,.74]],
    6:[[.28,.24],[.72,.24],[.28,.5],[.72,.5],[.28,.76],[.72,.76]]}[v]||[];
  pips.forEach(p=>{
    dx2.beginPath();dx2.arc(p[0]*S,p[1]*S,S*.095,0,7);
    dx2.fillStyle="#1B2733";dx2.fill();
    dx2.beginPath();dx2.arc(p[0]*S-S*.028,p[1]*S-S*.03,S*.03,0,7);
    dx2.fillStyle="rgba(255,255,255,.5)";dx2.fill();
  });
}

</script>
<script>
/* ================================================================
   دورة اللعب
   ================================================================ */
const veil=$("#veil"), sheet=$("#sheet"), screenEl=$("#screen"), app=$("#app"), bigMsg=$("#bigMsg");
let toastT;
function toast(m){document.querySelectorAll(".toast").forEach(e=>e.remove());
  const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);
  clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2200);}
function openSheet(h){

/* ---------------- تحريك القطعة ---------------- */
/* موضع قدم الشخصية على منصّة المربع — هو نفسه المستخدم في الرسم الثابت */
const footX=n=>isoPos(Math.max(1,n)).x;
const footY=n=>isoPos(Math.max(1,n)).y+ISO.th*0.5;
const easeInOut=t=>t<.5? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

async function moveTo(pi,from,to,slide){
  const p=G.players[pi];
  if(slide){
    /* الانزلاق على مسار: انسياب متصل مع ميل الجسم واستطالته */
    await sleep(300);
    const x0=footX(from), y0=footY(from), x1=footX(to), y1=footY(to);
    const steps=46;
    for(let i=1;i<=steps;i++){
      const t=i/steps, e=easeInOut(t);
      G.anim={pi, x:x0+(x1-x0)*e, y:y0+(y1-y0)*e,
        t, slide:true, lean:(x1-x0)>0?1:-1, sp:Math.sin(t*Math.PI)};
      drawBoard(); await sleep(17);
    }
    G.anim={pi, x:x1, y:y1, t:1, slide:true, lean:0, sp:0};
    G.land={sq:to, t:1}; drawBoard();
    await sleep(300);
    p.sq=to; G.anim=null; drawBoard(); renderPlayers();
    return;
  }
  /* ---------- مشي متصل على طول المسار ---------- */
  const dir=to>from?1:-1;
  const seq=[]; for(let n=from; dir>0? n<=to : n>=to; n+=dir) seq.push(Math.max(1,n));
  if(seq.length<2){ p.sq=to; G.anim=null; drawBoard(); renderPlayers(); return; }
  /* نقاط المسار وأطوال أضلاعه */
  const pts=seq.map(n=>({x:footX(n), y:footY(n), n}));
  const segLen=[], acc=[0];
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    segLen.push(d); acc.push(acc[i-1]+d);
  }
  const total=acc[acc.length-1]||1;
  const squares=pts.length-1;
  /* سرعة ثابتة مريحة: نحو ٣٤٠ مللي ثانية لكل مربع، مع حدّ أعلى للمسافات الطويلة */
  const dur=Math.min(2600, Math.max(520, squares*340));
  const stepLen=total/squares;                 /* طول الخطوة الواحدة */
  const t0=Date.now();
  let lastSq=0, walked=0;
  await new Promise(res=>{
    const tick=()=>{
      const el=Date.now()-t0;
      const raw=Math.min(1, el/dur);
      /* تسارع لطيف في البداية وتباطؤ في النهاية — لا توقّف بين المربعات */
      const e=raw<0.5 ? 2*raw*raw : 1-Math.pow(-2*raw+2,2)/2;
      const dist=e*total;
      let i=1; while(i<acc.length-1 && acc[i]<dist) i++;
      const a2=pts[i-1], b2=pts[i];
      const f=(dist-acc[i-1])/Math.max(1e-6,(acc[i]-acc[i-1]));
      const x=a2.x+(b2.x-a2.x)*f, y=a2.y+(b2.y-a2.y)*f;
      /* دورة المشي: خطوتان لكل مربع */
      const phase=(dist/stepLen)*2;
      const bob=Math.abs(Math.sin(phase*Math.PI))*ISO.th*0.16;
      const settle=raw>0.88 ? (raw-0.88)/0.12 : 0;    /* استقرار لطيف عند النهاية */
      G.anim={pi, x, y:y-bob, walk:true, phase, prog:raw,
        lean:(b2.x-a2.x)>0?1:-1, speed:1-Math.abs(raw-0.5)*0.6, settle};
      /* صوت خطوة عند عبور كل مربع */
      const cur=Math.min(squares, Math.floor(dist/stepLen+0.0001));
      if(cur>lastSq){ lastSq=cur; SFX.step(cur-1, squares);
        if(cur<squares) G.land={sq:pts[cur].n, t:0.55}; }
      drawBoard();
      if(raw>=1){ res(); return; }
      setTimeout(tick,16);
    };
    tick();
  });
  G.anim={pi, x:pts[pts.length-1].x, y:pts[pts.length-1].y, walk:true, phase:0, prog:1, lean:0, settle:1};
  G.land={sq:to, t:1};
  drawBoard();
  await sleep(180);
  p.sq=to; G.anim=null; drawBoard(); renderPlayers();
}

function drawDiceOn(g2,v,S){

  const pips={1:[[.5,.5]],2:[[.28,.28],[.72,.72]],3:[[.26,.26],[.5,.5],[.74,.74]],
    4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],
    5:[[.26,.26],[.74,.26],[.5,.5],[.26,.74],[.74,.74]],

/* ---------------- الدور ---------------- */
/* توليد بيانات الدور — في اللعب الشبكي يولّدها المضيف وحده */
function rollTurn(p){
  const v=1+Math.floor(Math.random()*6);
  G.seq=(G.seq||0)+1;
  const target=Math.min(BOARD.last,p.sq+v);
  const cat=BOARD.zoneOf(Math.max(1,target));
  if(!G.pool[cat]||!G.pool[cat].length) G.pool[cat]=shuffle(QUESTIONS[cat].map((_,i)=>i));
  return {pi:p.i, v, cat, idx:G.pool[cat][0], n:G.seq};
}
async function takeTurn(){
  if(!G||G.over||G.busy||G.waiting) return;
  const p=cur();
  if(MAIL.on && p.i!==MAIL.me) return;
  if(NET.on){
    if(p.i!==NET.me) return;
    if(NET.mode==="guest"){
      G.waiting=true; updateCtl();
      setHint('<span class="dotpulse"></span> بانتظار المضيف…');
      NET.send({t:"req"});
      /* إعادة الطلب إن لم يصل شيء */
      let tries=0;
      const iv=setInterval(()=>{
        if(!G || !G.waiting || G.busy || G.over || !NET.on){ clearInterval(iv); return; }
        if(++tries>6){ clearInterval(iv); G.waiting=false; updateCtl();
          setHint("لم يصل ردّ المضيف — اضغط الزهر مرة أخرى"); return; }
        NET.send({t:"req"});
      },2500);
      return; }
  }
  const d=rollTurn(p);
  if(NET.on) NET.send({t:"turn", ...d});
  await runTurn(d);
}
/* تنفيذ الدور بالبيانات نفسها على الجهازين */
/* الطابق الثاني أصعب: وقت أقل، تراجع أكبر، وخصم أدقّ */
function tierRules(sq){
  const hard = sq>50;
  return {
    time: hard ? Math.max(9, Math.round(G.lv.time*0.72)) : G.lv.time,
    back: hard ? G.lv.back+1 : G.lv.back,
    ai:   hard ? Math.min(0.95, G.lv.ai+0.10) : G.lv.ai
  };
}
async function runTurn(d){
  if(G.over) return;
  if(d.n) G.seq=Math.max(G.seq||0, d.n);
  G.waiting=false;
  G.turn=d.pi;
  const p=G.players[d.pi];
  if(p.skip){ p.skip=false;
    setHint(`<b>${esc(p.name)}</b> في محطة تأمل — يمرّ الدور`);
    log(p,"تخطّى الدور بسبب محطة التأمل","gray");
    await sleep(900); endTurn(); return; }
  G.busy=true; updateCtl();
  const pos=G.pool[d.cat]?G.pool[d.cat].indexOf(d.idx):-1;
  if(pos>=0) G.pool[d.cat].splice(pos,1);
  const q={cat:d.cat, idx:d.idx, ...QUESTIONS[d.cat][d.idx]};

  $("#dice").classList.add("roll"); SFX.roll();
  const spins=[70,70,80,95,110,130,155,185,220,260];
  for(let i=0;i<spins.length;i++){ drawDice(1+Math.floor(Math.random()*6)); await sleep(spins[i]); }
  drawDice(d.v); $("#dice").classList.remove("roll"); $("#dice").classList.add("landed");
  SFX.diceLand(); await sleep(REDUCED?60:420); $("#dice").classList.remove("landed");
  G.extraRoll=false;

  const target=Math.min(BOARD.last,p.sq+d.v);
  setHint(`الزهر <b class="num">${AR(d.v)}</b> — ${esc(p.name)} يتقدّم إلى <b class="num">${AR(target)}</b>`);
  await sleep(REDUCED?40:280);
  if(target!==p.sq) await moveTo(p.i,p.sq,target,false);
  G.landedOn=target;
  if(!G.tier2 && target>50){
    G.tier2=true;
    big("الطابق الثاني — الصعوبة أعلى","var(--a-sd)","var(--a-tx)");
    await sleep(1100);
  }
  await sleep(REDUCED?40:340);
  setHint(`مربع <b class="num">${AR(target)}</b> — سؤال ${CATS[d.cat].n}`);

  let correct;
  const mine = !NET.on || d.pi===NET.me;
  if(NET.on && !mine) correct = await waitRemoteAnswer(q,p,d.v);
  else {
    correct = p.human ? await askQuestion(q,p,d.v) : await aiAnswer(q,p,d.v);
    if(NET.on) NET.send({t:"ans", pi:d.pi, correct});
  }
  await resolveAnswer(p,d.v,correct,q);
}
/* عرض السؤال للطرف الآخر بانتظار إجابته */
let remoteResolve=null, pendingAns=null;
function waitRemoteAnswer(q,p,v){

      setTimeout(()=>fin(a),900); return;

    remoteResolve=fin;

/* ---------------- عرض السؤال ---------------- */
function askQuestion(q,p,v){
  return new Promise(resolve=>{
    const C=CATS[q.cat];
    const order=shuffle(q.o.map((_,i)=>i));
    const tLimit=tierRules(p.sq).time;
    let done=false, left=tLimit;
    const KEYS=["أ","ب","ج","د"];
    openSheet(`
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="qcat" style="background:${C.bg};border-color:${C.bd};color:${C.tx}">${C.icon} ${C.n}</span>
        <span class="faint" style="font-size:12.5px">دور <b style="color:${PCOL[p.i].sd}">${esc(p.name)}</b>
          · المربع <b class="num" style="color:${PCOL[p.i].sd}">${AR(p.sq)}</b></span>
      </div>
      ${tLimit?`<div class="timer" style="margin-top:12px"><i id="tbar" style="width:100%"></i></div>`:""}
      <div class="qtext">${esc(q.q)}</div>
      <div id="opts">${order.map((oi,k)=>`<button class="opt" data-o="${oi}">
        <span class="k">${KEYS[k]}</span>${esc(q.o[oi])}</button>`).join("")}</div>
      <p class="faint" style="text-align:center;font-size:11.5px;margin:8px 0 0">يمكنك الاختيار بالأرقام <span class="num">1</span>–<span class="num">4</span></p>`);
    veil.classList.add("grow");
    growFromSquare(p.sq);
    const finish=(ok)=>{ if(done) return; done=true; keyPick=null; turnbar(false); clearInterval(iv);
      const btns=[...sheet.querySelectorAll("[data-o]")];
      btns.forEach(b=>{ const oi=+b.dataset.o;
        if(oi===q.a) b.className="opt right";
        else if(b.dataset.picked) b.className="opt wrong";
        else b.className="opt mute"; b.disabled=true; });
      setTimeout(()=>resolve(ok),260);
    };
    const btns0=[...sheet.querySelectorAll("[data-o]")];
    btns0.forEach(b=>b.addEventListener("click",()=>{
      if(done) return; b.dataset.picked="1"; finish(+b.dataset.o===q.a);
    }));
    /* اختيار بلوحة المفاتيح: ١ ٢ ٣ ٤ أو أ ب ج د */
    keyPick=(idx)=>{ if(done) return; const b=btns0[idx]; if(!b) return;
      b.dataset.picked="1"; SFX.ui(); finish(+b.dataset.o===q.a); };
    let iv=null;
    if(tLimit){
      iv=setInterval(()=>{ left-=0.1;
        const bar=$("#tbar"); if(bar){ bar.style.width=Math.max(0,left/tLimit*100)+"%";
          bar.style.background = left<tLimit*0.3?"var(--r-sd)":left<tLimit*0.6?"var(--a-sd)":"var(--c-sd)"; }
        if(left<=3 && Math.abs(left-Math.round(left))<0.06) SFX.tick();
        if(left<=0) finish(false);
      },100);
    }
  });
}
async function aiAnswer(q,p,v){
  const C=CATS[q.cat];
  const KEYS=["أ","ب","ج","د"];
  const order=shuffle(q.o.map((_,i)=>i));
  const ok=Math.random()<tierRules(p.sq).ai;
  const pick= ok? q.a : shuffle(q.o.map((_,i)=>i).filter(i=>i!==q.a))[0];
  openSheet(`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="qcat" style="background:${C.bg};border-color:${C.bd};color:${C.tx}">${C.n}</span>
      <span class="faint" style="font-size:12.5px">دور <b style="color:${PCOL[p.i].sd}">${esc(p.name)}</b>
        · المربع <b class="num">${AR(p.sq)}</b></span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div id="opts">${order.map((oi,k)=>`<button class="opt" data-o="${oi}" disabled>
      <span class="k">${KEYS[k]}</span>${esc(q.o[oi])}</button>`).join("")}</div>
    <p class="faint" style="text-align:center;margin:6px 0 0">الخصم يفكّر…</p>`);
  await sleep(2100);
  sheet.querySelectorAll("[data-o]").forEach(b=>{ const oi=+b.dataset.o;
    if(oi===q.a) b.className="opt right";
    else if(oi===pick) b.className="opt wrong";
    else b.className="opt mute"; });
  turnbar(false);
  await sleep(1400);

}

/* ---------------- نتيجة الإجابة ---------------- */
function log(p,txt,c){ G.log.unshift({p:p.i,txt,c:c||"gray",sq:p.sq}); G.log=G.log.slice(0,60); }

async function resolveAnswer(p,v,correct,q){
  await shrinkToSquare();
  closeSheet(); veil.classList.remove("grow","lit");
  await sleep(REDUCED?40:180);
  const C=CATS[q.cat];
  if(correct){
    p.right++; p.streak++; p.bestStreak=Math.max(p.bestStreak,p.streak);
    p.cats[q.cat]=(p.cats[q.cat]||0)+1;
    p.pts += 10 + (p.streak>=3?5:0);
    SFX.right(); big("إجابة صحيحة ✓ — ثبتّ مكانك","var(--g-sd)","var(--g-tx)"); burst("good");
    log(p,`أجاب صحيحاً وثبت في المربع ${p.sq}`,"green");
    await sleep(1000);
  } else {
    p.wrong++; p.streak=0;
    SFX.wrong(); big("إجابة غير صحيحة ✕ — تتراجع","var(--r-sd)","var(--r-tx)");
    CAM.shake=REDUCED?0:.5;
    await sleep(1000);
    const back=Math.max(0,p.sq-tierRules(p.sq).back);
    if(back!==p.sq){ await moveTo(p.i,p.sq,back,false);
      log(p,`أجاب خطأً وتراجع إلى المربع ${back}`,"red"); }
    else log(p,"أجاب خطأً ولم يتراجع أبعد من البداية","red");
  }
  /* شرح الإجابة دائماً — هذا هو جوهر اللعبة التعليمي */
  await showExplain(q,correct,C);
  /* المسارات والمربعات الخاصة تُحسم فقط عند الإجابة الصحيحة */
  if(correct && p.sq>0) await resolveSquare(p);
  if(correct && p.sq>=BOARD.last){ if(MAIL.on){ G.over=true; G.winner=p.i;
      MAIL.lastMove={title:`${p.name} وصل إلى النهاية`, body:"أنهى المسار.", ok:true};
      SFX.win(); return mailAfterTurn(); } return finish(p); }
  G.landedOn=null;
  if(MAIL.on && p.i===MAIL.me){
    MAIL.lastMove={title:`صديقك ${correct?"أجاب صحيحاً":"أخطأ"} — وقف عند المربع ${p.sq}`,
      body: correct ? ("السؤال: "+q.q+"\nالإجابة الصحيحة: "+q.o[q.a])
                    : ("السؤال: "+q.q+"\nالإجابة الصحيحة: "+q.o[q.a]+"\nفتراجع إلى المربع "+p.sq),
      ok:!!correct};
    G.turn=1-p.i;
    if(!G.extraRoll){ renderPlayers(); return mailAfterTurn(); }
  }
  endTurn();
}

/* ---------------- المربع الذي حطّ عليه ---------------- */
async function resolveSquare(p){
  const L=ladderAt(p.sq);
  if(L){ p.ladders++; p.pts+=15; SFX.ladder();
    big("مسار حماية ↑","var(--g-sd)","var(--g-tx)"); burst("ladder");
    await sleep(850); await moveTo(p.i,L.a,L.b,true);
    log(p,`صعد بمسار حماية: ${L.t} → ${L.b}`,"green");
    await note("مسار حماية",L.t,L.d,"green"); return; }
  const S=snakeAt(p.sq);
  if(S){ p.snakes++; p.pts=Math.max(0,p.pts-5); SFX.snake(); CAM.shake=REDUCED?0:1;
    big("منزلق خطر ↓","var(--r-sd)","var(--r-tx)");
    await sleep(850); await moveTo(p.i,S.a,S.b,true);
    log(p,`انزلق: ${S.t} → ${S.b}`,"red");
    await note("منزلق خطر",S.t,S.d,"red"); return; }
  const sp=BOARD.special[p.sq];
  if(sp){
    if(sp.kind==="extra"){ G.extraRoll=true; p.pts+=5; SFX.extra();
      big("رمية إضافية ⭑","var(--y-sd)","var(--y-tx)");
      log(p,"حصل على رمية إضافية","gold"); }
    else { p.skip=true; SFX.pause2();
      big("محطة تأمل ⏸","var(--c-sd)","var(--c-tx)");
      log(p,"محطة تأمل: يمرّ دوره القادم","cyan"); }
    await sleep(1100);
    await note(sp.t,"",sp.d,sp.kind==="extra"?"gold":"cyan");
  }
}
function note(title,sub,body,col){
  return new Promise(res=>{
    const map={green:["var(--g-bd)","var(--g-bg)","var(--g-tx)"],red:["var(--r-bd)","var(--r-bg)","var(--r-tx)"],
      gold:["var(--y-bd)","var(--y-bg)","var(--y-tx)"],cyan:["var(--c-bd)","var(--c-bg)","var(--c-tx)"]}[col];
    openSheet(`<div class="qcat" style="background:${map[1]};border-color:${map[0]};color:${map[2]}">${title}</div>
      ${sub?`<h2 style="margin:12px 0 8px">${esc(sub)}</h2>`:'<div style="height:8px"></div>'}
      <p style="font-size:15.5px">${esc(body)}</p>
      <div style="text-align:end"><button class="btn primary" data-continue="1">متابعة
        <span class="faint" style="font-size:11px">↵</span></button></div>`);
    pendingContinue=res;
  });
}

function endTurn(){
  G.busy=false; G.waiting=false;
  if(G.extraRoll){ setHint(`<b>${esc(cur().name)}</b> — رمية إضافية`); }
  else { G.turn=1-G.turn; setHint(`دور <b style="color:${PCOL[G.turn].sd}">${esc(cur().name)}</b>`); }
  renderPlayers(); updateCtl(); drawBoard();
  /* اللعب الآلي للخصم لا يعمل إطلاقاً في اللعب الشبكي أو بالمراسلة */
  if(!NET.on && !MAIL.on && !cur().human && !G.over) setTimeout(takeTurn,1250);
}

async function copyText(v,label){

/* مصادر المكتبة: إن تعذّر أحدها يُجرَّب التالي */
const PEER_SRC=[

];
function loadOne(src){
  return new Promise(res=>{
    const sc=document.createElement("script");
    sc.src=src; sc.async=true;
    let done=false;
    const fin=v=>{ if(done) return; done=true; res(v&&!!window.Peer); };
    sc.onload=()=>fin(true); sc.onerror=()=>fin(false);
    document.head.appendChild(sc);
    setTimeout(()=>fin(!!window.Peer),8000);
  });
}
async function loadPeer(){
  if(window.Peer) return true;
  for(const src of PEER_SRC){ if(await loadOne(src)) return true; }
  return false;
}
/* خوادم الربط: الافتراضي ثم بدائل */
const SIGNALS=[

];

  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"stun:stun2.l.google.com:19302"},

/* خادم العبور — ضروري حين يكون اللاعبان على شبكتين مختلفتين.
   لا يوجد خادم عبور عام مجاني موثوق، فيضع المستخدم بياناته مرة واحدة. */
function turnCfg(){

  if(!t||!t.urls) return null;

  return {urls, username:t.username||"", credential:t.credential||""};
}
function iceList(extra){
  const out=STUN.slice();
  const t=extra||turnCfg();
  if(t&&t.urls&&t.urls.length) out.push(t);
  return out;
}
const ICE={ get iceServers(){ return iceList(); } };
function peerOpts(i){
  const base={debug:0, config:{iceServers:iceList()}};
  return SIGNALS[i] ? Object.assign(base,SIGNALS[i]) : base;
}
/* أخطاء قاتلة فقط توقف المحاولة؛ غيرها تُتجاهل */
const FATAL=["browser-incompatible","ssl-unavailable","server-error","socket-error","socket-closed","network"];

function netStatus(txt,kind){

  if(el){ el.className="netpill "+(kind||"");
    el.innerHTML=`<i></i>${esc(txt)}`; el.style.display=NET.on||NET.mode?"":"none"; }

function bindConn(conn,isHost){
  NET.conn=conn;
  conn.on("open",()=>{
    NET.on=true; NET.me=isHost?0:1;
    netStatus("متصل — "+(isHost?"أنت المضيف":"أنت الضيف"),"ok");
    NET.send({t:"hi", name:NET.myName});
    if(isHost) NET.send({t:"start", lv:NET.lv});
    onConnected(isHost);
  });
  conn.on("data",raw=>{ let m; try{ m=JSON.parse(raw); }catch(e){ return; } handleNet(m); });
  conn.on("close",()=>onDrop());
