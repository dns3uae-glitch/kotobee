services:
  - type: web
    name: ghanima-store
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: BASE_URL
        sync: false
    disk:
      name: ghanima-data
      mountPath: /var/data
      sizeGB: 1
