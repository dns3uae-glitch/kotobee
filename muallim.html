<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المعلم الصغير">
<meta name="theme-color" content="#FFF8EC">
<title>المعلّم الصغير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF5F6; --card:#FFFFFF; --ink:#23222B; --muted:#6B6978;
  --teal:#0F9D8A; --teal-d:#0B6F61; --teal-l:#DDF3EF; --orange:#F28C28; --orange-d:#C46A10; --yellow:#FFD166;
  --red:#E25555; --green:#2FAE6B; --blue:#3F7FE0; --purple:#8A63D2;
  --shadow:0 6px 20px rgba(35,34,43,.10); --r:22px; --rs:1.1;
  --font:'Baloo Bhaijaan 2','Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  --read:'Noto Naskh Arabic','Amiri','Traditional Arabic','Segoe UI',Tahoma,serif;
}
body[data-font="cairo"]{--read:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}
body[data-font="tajawal"]{--read:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif}
body[data-font="amiri"]{--read:'Amiri','Traditional Arabic',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{height:-webkit-fill-available}
body{min-height:-webkit-fill-available;-webkit-text-size-adjust:100%;-webkit-touch-callout:none;touch-action:manipulation}
body{font-family:var(--font);background:linear-gradient(180deg,#E6F3F4 0%,#FFF7EA 100%);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;font-size:20px}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;background:none}
.hidden{display:none!important}
#app{height:100%;height:100vh;height:100dvh;padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);display:flex;flex-direction:column;max-width:1180px;margin:0 auto;position:relative}

/* الشريط العلوي */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:10px}
.ibtn{width:50px;height:50px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:24px;display:flex;align-items:center;justify-content:center}
#midTop{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
#phaseLabel{font-size:15px;font-weight:700;color:var(--teal-d);background:var(--teal-l);border-radius:20px;padding:2px 14px;min-height:24px}
#progressDots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#progressDots span{width:13px;height:13px;border-radius:50%;background:#D9E3E4;display:inline-block;transition:.3s}
#progressDots span.done{background:var(--green)}
#progressDots span.cur{background:var(--orange);transform:scale(1.4)}
.pill{background:var(--card);border-radius:30px;padding:6px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}

/* المدرّب */
#teacher{display:flex;align-items:flex-start;gap:12px;padding:2px 14px 0}
#avatarWrap{flex:0 0 auto;width:132px;position:relative;text-align:center}
#avatar{width:124px;height:124px;transition:transform .3s}
#avatar[data-mood="cheer"]{animation:bounce .6s 2}
#avatar[data-mood="oops"]{animation:tilt .6s 1}
#avatar[data-mood="think"]{transform:rotate(-4deg)}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.05)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}
#teacherName{font-size:14px;font-weight:700;color:var(--teal-d);margin-top:-4px}
#bubbleCol{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
#bubble{background:var(--card);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);position:relative;min-height:72px;font-size:21px;line-height:1.55;display:flex;align-items:center;justify-content:space-between;gap:10px}
#bubble:after{content:"";position:absolute;right:-11px;top:26px;border:11px solid transparent;border-left-color:var(--card);border-right:0}
#bubbleText{flex:1}
#bubbleBtns{display:flex;gap:8px;flex:0 0 auto}
#bubbleBtns button{width:48px;height:48px;border-radius:50%;font-size:22px;box-shadow:var(--shadow)}
#replayBtn{background:var(--yellow)}
#hintBtn{background:#FFF1C7;border:3px solid var(--orange)}
#hintBtn.pulse{animation:pulse2 1.1s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(242,140,40,.7)}100%{box-shadow:0 0 0 22px rgba(242,140,40,0)}}
#statusChip{display:flex;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:700;color:var(--muted)}
#statusChip span{background:rgba(255,255,255,.75);border-radius:14px;padding:2px 10px}
#statusChip .goal{position:relative;overflow:hidden}
.comboBadge{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#F28C28,#E25555);color:#fff;font-weight:800;font-size:26px;padding:8px 24px;border-radius:30px;z-index:70;box-shadow:var(--shadow);animation:pop2 1.4s forwards;pointer-events:none}
@keyframes pop2{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%{opacity:1;transform:translateX(-50%) scale(1.15)}80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}

/* وجه المدرّب */
.talking #mTalk{display:block;animation:talk .22s infinite alternate}
.talking .mouth:not(#mTalk){display:none}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.mouth{display:none;transform-box:fill-box;transform-origin:center}
#avatar[data-mood="calm"] #mSmile,#avatar:not([data-mood]) #mSmile{display:block}
#avatar[data-mood="happy"] #mSmile{display:block}
#avatar[data-mood="cheer"] #mGrin{display:block}
#avatar[data-mood="think"] #mThink{display:block}
#avatar[data-mood="oops"] #mThink{display:block}
#avatar[data-mood="wow"] #mGrin{display:block}
#eyeL,#eyeR{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
#browL,#browR{transition:transform .25s;transform-box:fill-box;transform-origin:center}
#avatar[data-mood="happy"] #browL,#avatar[data-mood="happy"] #browR,#avatar[data-mood="cheer"] #browL,#avatar[data-mood="cheer"] #browR,#avatar[data-mood="wow"] #browL,#avatar[data-mood="wow"] #browR{transform:translateY(-4px)}
#avatar[data-mood="think"] #browL{transform:translateY(-5px) rotate(-8deg)}
#avatar[data-mood="oops"] #browL{transform:rotate(12deg) translateY(1px)}
#avatar[data-mood="oops"] #browR{transform:rotate(-12deg) translateY(1px)}

/* المسرح */
#stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 14px 22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;width:100%;max-width:860px}
.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.huge{font-family:var(--read);font-size:calc(140px*var(--rs));line-height:1.3;font-weight:700;color:var(--teal-d)}
.word{font-family:var(--read);font-size:calc(66px*var(--rs));line-height:1.7;font-weight:700;color:var(--ink)}
.word.sm{font-size:calc(48px*var(--rs))}
.sentence{font-family:var(--read);font-size:calc(42px*var(--rs));line-height:1.95;font-weight:700}
.sentence .w{padding:0 6px;border-radius:10px;transition:.2s;display:inline-block}
.sentence .w.hl{background:var(--yellow)}
.sentence .w.ok{color:var(--green)}
.sentence .w.bad{color:var(--red)}
.sentence .w.cur{background:var(--yellow);box-shadow:0 0 0 3px #FFB62E inset}
.sentence .w.miss{color:var(--orange-d);text-decoration:underline wavy}
.sentence .w.told{color:var(--blue)}
.emoji{font-size:104px;line-height:1.2}
.emoji.sm{font-size:60px}
.sy.s0{color:#0B6F61}.sy.s1{color:#C46A10}.sy.s2{color:#2F63C4}.sy.s3{color:#7A4FC0}
.btn{background:var(--teal);color:#fff;border-radius:18px;padding:12px 24px;font-size:22px;font-weight:700;box-shadow:0 5px 0 var(--teal-d);transition:.1s;display:inline-flex;align-items:center;gap:10px;min-height:60px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-d)}
.btn.or{background:var(--orange);box-shadow:0 5px 0 var(--orange-d)}
.btn.or:active{box-shadow:0 1px 0 var(--orange-d)}
.btn.gr{background:#EAF0F1;color:var(--ink);box-shadow:0 5px 0 #CBD6D8}
.btn.gr:active{box-shadow:0 1px 0 #CBD6D8}
.btn.rd{background:var(--red);box-shadow:0 5px 0 #A93F3F}
.btn.xl{font-size:28px;padding:18px 34px;min-height:80px}
.btn:disabled{opacity:.45;pointer-events:none}
.choice{background:var(--card);border:4px solid #E4EBEC;border-radius:22px;min-width:116px;min-height:116px;font-family:var(--read);font-size:calc(64px*var(--rs));font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);padding:8px 20px;transition:.15s;position:relative;line-height:1.5}
.choice.txt{font-size:calc(38px*var(--rs))}
.choice:active{transform:scale(.96)}
.choice.ok{border-color:var(--green);background:#E7F7EE}
.choice.bad{border-color:var(--red);background:#FCE9E9;animation:shake .4s}
.choice.dim{opacity:.35;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tile{background:var(--yellow);border-radius:16px;min-width:74px;height:82px;font-family:var(--read);font-size:calc(46px*var(--rs));font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #D9AE45;padding:0 14px;transition:.1s}
.tile.wd{font-size:calc(34px*var(--rs));height:70px}
.tile.syl{min-width:90px}
.tile:active{transform:translateY(3px)}
.tile.used{opacity:.22;pointer-events:none}
.slot{min-height:96px;background:#F3F8F8;border:3px dashed #BFD2D4;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px;width:100%;font-family:var(--read);font-size:calc(60px*var(--rs));font-weight:700;direction:rtl}
.slot.sent{font-size:calc(38px*var(--rs))}
.slot.bad{animation:shake .4s;border-color:var(--red)}
.syls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:rtl}
.sylchip{font-family:var(--read);font-size:calc(52px*var(--rs));font-weight:700;background:#F3F8F8;border:3px solid #D5E3E4;border-radius:16px;padding:2px 18px;min-width:70px;box-shadow:0 4px 0 #D5E3E4;line-height:1.6}
.sylchip.on{background:var(--yellow);border-color:#E6B03A;transform:scale(1.08)}
.sylchip.s0{color:#0B6F61}.sylchip.s1{color:#C46A10}.sylchip.s2{color:#2F63C4}.sylchip.s3{color:#7A4FC0}
.forms{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.forms div{background:#F1F7F7;border-radius:16px;padding:8px 14px;text-align:center;min-width:110px}
.forms div b{display:block;font-family:var(--read);font-size:calc(58px*var(--rs));line-height:1.3;color:var(--teal-d)}
.forms div small{color:var(--muted);font-size:16px}
.hint{color:var(--muted);font-size:18px}
.stars{font-size:38px;letter-spacing:4px}
.fb{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
.fb span{font-size:150px;animation:pop .7s ease-out forwards;filter:drop-shadow(0 10px 20px rgba(0,0,0,.2))}
@keyframes pop{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
.cf{position:fixed;top:-20px;z-index:80;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.micbtn{width:112px;height:112px;border-radius:50%;background:var(--red);color:#fff;font-size:52px;box-shadow:0 6px 0 #A93F3F;display:flex;align-items:center;justify-content:center;margin:0 auto}
.micbtn.on{animation:pulse 1s infinite;background:#D9534F}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,85,85,.6)}100%{box-shadow:0 0 0 30px rgba(226,85,85,0)}}
.heard{font-family:var(--read);font-size:28px;color:var(--muted);min-height:38px}
.wave{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:34px}
.wave i{width:7px;background:var(--red);border-radius:4px;animation:wv .8s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:6px}50%{height:32px}}
.tag{display:inline-block;background:#FFE9C6;color:var(--orange-d);border-radius:14px;padding:2px 12px;font-size:16px;font-weight:800}
.tag.test{background:#E3ECFF;color:#2F63C4}
.qchip{display:inline-block;border-radius:14px;padding:4px 14px;font-size:20px;font-weight:700;margin:2px}
.qchip.who{background:#E3ECFF;color:#2F63C4}.qchip.what{background:#FFE9C6;color:var(--orange-d)}.qchip.where{background:#DDF3EF;color:var(--teal-d)}

/* لوحة المفاتيح */
.kb{display:flex;flex-direction:column;gap:7px;width:100%;max-width:900px;direction:rtl}
.kb .krow{display:flex;gap:6px;justify-content:center}
.kb .key{flex:1;max-width:76px;height:62px;background:var(--card);border-radius:12px;font-family:var(--read);font-size:32px;font-weight:700;box-shadow:0 3px 0 #CBD6D8;display:flex;align-items:center;justify-content:center}
.kb .key:active{transform:translateY(2px);box-shadow:none}
.kb .key.wide{max-width:none;flex:3;font-family:var(--font);font-size:21px}
.kb .key.act{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d)}
.kb .key.del{background:#F7D9D9}
.typed{min-height:96px;width:100%;background:#F3F8F8;border-radius:18px;border:3px solid #D5E3E4;font-family:var(--read);font-size:calc(58px*var(--rs));font-weight:700;display:flex;align-items:center;justify-content:center;padding:6px 16px;letter-spacing:1px;direction:rtl;flex-wrap:wrap;line-height:1.6}
.typed.sentbox{font-size:calc(38px*var(--rs))}
.bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bank button{background:#EAF0F1;border-radius:14px;padding:4px 16px;font-family:var(--read);font-size:calc(30px*var(--rs));font-weight:700;box-shadow:0 3px 0 #CBD6D8}
.bank button:active{transform:translateY(2px)}

/* الكتابة بالإصبع */
#traceBox{position:relative;width:min(92vw,400px);height:min(92vw,400px);background:#fff;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;touch-action:none;margin:0 auto}
#traceBox canvas{position:absolute;top:0;left:0;width:100%;height:100%}

/* الرئيسية */
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:100%;max-width:860px}
.hcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 14px;text-align:center;font-size:23px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid transparent;transition:.15s;position:relative}
.hcard:active{transform:scale(.97)}
.hcard .ic{font-size:54px}
.hcard.main{background:linear-gradient(135deg,var(--teal),#2BB89F);color:#fff;grid-column:1/-1;font-size:32px;padding:26px}
.hcard.main .mini{color:#E8FFF9}
.hcard .lock{position:absolute;top:10px;left:12px;font-size:22px}
.hcard.locked{opacity:.55}
.mini{font-size:16px;color:var(--muted);font-weight:400}
.bar{height:12px;background:#E3EBEC;border-radius:10px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--teal);border-radius:10px;transition:.5s}
.week{display:flex;gap:8px;justify-content:center;margin-top:6px}
.week span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.week span.on{background:#FFD166;color:#5A3C00}
.msgcard{background:linear-gradient(135deg,#FFF1C7,#FFE3A3);border:3px solid var(--orange);grid-column:1/-1;cursor:pointer}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--yellow) calc(var(--p)*1%),rgba(255,255,255,.3) 0);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;position:relative}
.ring:before{content:"";position:absolute;top:9px;left:9px;right:9px;bottom:9px;background:#14A894;border-radius:50%}
.ring b{position:relative}

/* ولي الأمر */
#parentBtn{position:absolute;bottom:12px;left:12px;width:46px;height:46px;border-radius:50%;background:#E3ECEE;font-size:21px;opacity:.7;z-index:5}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(35,34,43,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:10px}
.modal .box{background:var(--card);border-radius:24px;width:100%;max-width:880px;max-height:95vh;overflow:auto;padding:18px;font-size:17px;user-select:text;-webkit-user-select:text}
.modal h2{margin:0 0 10px;color:var(--teal-d)}
.modal h3{margin:16px 0 8px;color:var(--orange-d);font-size:19px}
.pinpad{display:grid;grid-template-columns:repeat(3,78px);gap:10px;justify-content:center;direction:ltr}
.pinpad button{height:66px;border-radius:16px;background:#EEF4F5;font-size:26px;font-weight:700}
.pindisp{text-align:center;font-size:38px;letter-spacing:12px;min-height:56px;direction:ltr}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1;min-width:100px;padding:9px 6px;border-radius:12px;background:#EEF4F5;font-weight:700;font-size:16px}
.tabs button.on{background:var(--teal);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi div{background:#EEF4F5;border-radius:14px;padding:10px;text-align:center;font-size:15px}
.kpi b{display:block;font-size:28px;color:var(--teal-d)}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:10px;background:#F3F8F8;border-radius:14px;direction:ltr}
.chart div{flex:1;background:var(--teal);border-radius:6px 6px 0 0;position:relative;min-height:3px}
.chart div span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.chart div em{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:13px;font-style:normal;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid #E3EBEC;text-align:right;vertical-align:top}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#FCE9E9;color:#A33;border-radius:10px;padding:4px 10px;font-family:var(--read);font-size:19px}
.chip.g{background:#E7F7EE;color:#276}
.chip.n{background:#EEE;color:#888}
.field{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.field label{min-width:150px;font-weight:700}
input[type=text],input[type=password],select,textarea{font-family:inherit;font-size:17px;padding:8px 12px;border-radius:12px;border:2px solid #D5E3E4;background:#fff;min-width:200px}
textarea{width:100%;min-height:90px}
input[type=range]{width:200px}
.sbtn{background:var(--teal);color:#fff;border-radius:12px;padding:8px 16px;font-weight:700;font-size:16px}
.sbtn.gray{background:#E3ECEE;color:var(--ink)}
.sbtn.red{background:var(--red)}
.note{background:#FFF4D6;border-radius:12px;padding:10px 14px;font-size:15.5px;line-height:1.7}
.rec{display:flex;gap:10px;align-items:flex-start;background:#F3F8F8;border-radius:14px;padding:10px 12px;margin:6px 0;font-size:16px;line-height:1.6}
.rec .ri{font-size:24px}
.rec.warn{background:#FFF1E0}.rec.good{background:#E7F7EE}
.ok-badge{color:var(--green);font-weight:700}
.bad-badge{color:var(--red);font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.badge{width:116px;background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow);font-size:15px}
.badge .bi{font-size:44px}
.badge.lk{filter:grayscale(1);opacity:.4}
.overlay-nudge{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--orange);color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;box-shadow:var(--shadow);z-index:60;font-size:20px}
.hbar{height:10px;border-radius:6px;background:#E3EBEC;overflow:hidden;min-width:120px;flex:1}
.hbar i{display:block;height:100%;background:var(--teal)}
.hbar i.w{background:var(--orange)}
.svgwrap{display:flex;justify-content:center}
.brk{width:150px;height:150px;border-radius:50%;margin:10px auto;background:conic-gradient(var(--teal) calc(var(--p)*1%),#E3EBEC 0);display:flex;align-items:center;justify-content:center;position:relative}
.brk:before{content:"";position:absolute;top:14px;left:14px;right:14px;bottom:14px;background:#fff;border-radius:50%}
.brk b{position:relative;font-size:38px;color:var(--teal-d)}
.mood{font-size:70px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);width:130px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:56px;transition:.15s}
.mood small{font-size:17px;font-weight:700;color:var(--ink)}
.mood:active{transform:scale(.94)}
#printArea{display:none}
@media print{
  body{overflow:visible!important;background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:18px;font-size:14px;color:#000;direction:rtl}
  #printArea h1{font-size:22px;margin:0 0 6px}
  #printArea h2{font-size:17px;margin:14px 0 6px;color:#0B6F61}
  #printArea table{font-size:13px}
}
@media (max-width:640px){
  body{font-size:18px}
  #avatarWrap{width:84px}#avatar{width:80px;height:80px}
  #bubble{font-size:17px;padding:8px 10px;min-height:60px}
  .huge{font-size:calc(100px*var(--rs))}.word{font-size:calc(50px*var(--rs))}.sentence{font-size:calc(32px*var(--rs))}.emoji{font-size:80px}
  .choice{min-width:88px;min-height:88px;font-size:calc(50px*var(--rs))}.choice.txt{font-size:calc(27px*var(--rs))}
  .tile{min-width:56px;height:64px;font-size:calc(36px*var(--rs))}

  .sylchip{font-size:calc(40px*var(--rs));padding:2px 12px}
  #bubbleBtns button{width:42px;height:42px;font-size:19px}
}

  const lab = k => { const [p, v] = [k.split(':')[0], k.slice(k.indexOf(':') + 1)]; const pre = { L: 'حرف ', H: 'مقطع ', W: 'كلمة ', S: 'جملة ', D: 'إملاء ', B: 'تركيب ', O: 'ترتيب ', C: 'إكمال ', T: 'كتابة ', F: 'بلا تشكيل ', P: 'سمع ', ST: 'قصة ', SQ: 'فهم ', WQ: 'تعبير ', WS: 'كتابة جملة ', FL: 'طلاقة ' }[p] || ''; return pre + v; };
  h += '<h3>نقاط تحتاج تركيزًا</h3><div class="chips">' + (wk.length ? wk.map(k => '<span class="chip">' + esc(lab(k)) + '</span>').join('') : '<span class="hint">لا توجد نقاط ضعف واضحة حتى الآن 👍</span>') + '</div>';
  h += '<h3>نقاط القوة</h3><div class="chips">' + (stg.length ? stg.map(k => '<span class="chip g">' + esc(lab(k)) + '</span>').join('') : '<span class="hint">ستظهر بعد عدة دروس</span>') + '</div>';
  box.innerHTML = h;
}

    '<div class="field"><label>مهارة نركّز عليها هذا الأسبوع</label><select id="gFocus"><option value="">(بدون)</option>' + [['letters', 'الحروف'], ['words', 'قراءة الكلمات'], ['spelling', 'الإملاء'], ['fluency', 'الطلاقة'], ['expression', 'التعبير'], ['comprehension', 'الفهم القرائي']].map(x => '<option value="' + x[0] + '" ' + (S.focus === x[0] ? 'selected' : '') + '>' + x[1] + '</option>').join('') + '</select></div>' +
    '<div class="row" style="justify-content:flex-start"><button class="sbtn" id="gSave">💾 حفظ الأهداف</button></div>' +
    '<h3>التقييم المبدئي</h3><div class="note">' + (S.placement ? 'آخر تقييم: ' + S.placement.date + ' — ' + STAGE_NAMES[S.placement.stage] + '. يُنصح بإعادته كل شهر.' : 'لم يُجرَ بعد.') + '</div><div class="row" style="justify-content:flex-start;margin-top:8px"><button class="sbtn gray" id="rePlace">🎯 بدء تقييم جديد الآن (سلّم الجهاز للطفل)</button></div>';
  box.querySelector('#pmSend').onclick = () => { const v = box.querySelector('#pmText').value.trim(); if (!v) { alert('اكتب الرسالة أولًا'); return; } S.parentMsg = { text: v, date: today(), heard: false }; save(); alert('تم حفظ الرسالة ✔ وسيقرؤها المدرّب في بداية الدرس القادم.'); tabMsg(box, modal); };
  box.querySelector('#gSave').onclick = () => { S.settings.goalMin = parseInt(box.querySelector('#gMin').value, 10); S.focus = box.querySelector('#gFocus').value; save(); alert('تم الحفظ ✔'); };
  box.querySelector('#rePlace').onclick = () => { modal.remove(); startPlacement(); };
}
function exportData() {
  S.lastExport = Date.now(); save(); const json = JSON.stringify(S);
  try { const blob = new Blob([json], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'muallim_progress_' + today() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 1500); } catch (e) { }
  return json;
}

    '<div class="field"><label>اسمك أمام الطفل</label><input type="text" id="pParent" value="' + esc(S.settings.parentName || 'والدك') + '"></div>' +

    '<div class="field"><label>نطق الحروف أثناء الكتابة</label><select id="pKey"><option value="1" ' + (S.settings.keySpeak ? 'selected' : '') + '>نعم</option><option value="0" ' + (!S.settings.keySpeak ? 'selected' : '') + '>لا</option></select></div>' +
    readingOptionsHTML() +

    '<div class="row" style="margin-top:12px;justify-content:flex-start"><button class="sbtn" id="pSave">💾 حفظ الإعدادات</button><button class="sbtn gray" id="pExport">⬇️ تصدير التقدّم</button><button class="sbtn gray" id="pCopy">📋 نسخ التقدّم</button><button class="sbtn gray" id="pImport">⬆️ استيراد</button><button class="sbtn red" id="pReset">🗑️ إعادة ضبط كل شيء</button></div><textarea id="pBox" class="hidden" placeholder="الصق هنا نص التقدّم ثم اضغط استيراد مرة أخرى"></textarea><input type="file" id="pFile" accept=".json" class="hidden">';
  fillVoiceSelect(box.querySelector('#pVoice')); voiceNote(box.querySelector('#pVoiceNote')); bindReadingOptions(box);
  box.querySelector('#pRate').oninput = e => box.querySelector('#pRateV').textContent = e.target.value;
  box.querySelector('#pTest').onclick = () => { S.settings.voiceURI = box.querySelector('#pVoice').value; S.settings.rate = parseFloat(box.querySelector('#pRate').value); speak('مرحبًا يا ' + (box.querySelector('#pName').value || 'بطل') + '، أنا الأستاذ سالم. هيا نتعلم معًا.'); };
  box.querySelector('#pSave').onclick = () => {
    S.name = box.querySelector('#pName').value.trim() || S.name; S.settings.parentName = box.querySelector('#pParent').value.trim() || 'والدك'; S.settings.voiceURI = box.querySelector('#pVoice').value; S.settings.rate = parseFloat(box.querySelector('#pRate').value);
    S.settings.lessonLen = parseInt(box.querySelector('#pLen').value, 10); S.settings.mic = box.querySelector('#pMic').value === '1'; S.settings.keySpeak = box.querySelector('#pKey').value === '1';
    const np = box.querySelector('#pPin').value.trim(); if (np) { if (np.length < 4) { alert('الرمز يجب أن يكون 4 أرقام على الأقل'); return; } S.settings.pin = np; } save(); alert('تم حفظ الإعدادات ✔');
  };
  box.querySelector('#pExport').onclick = () => { exportData(); };
  box.querySelector('#pCopy').onclick = async () => { const j = exportData(); try { await navigator.clipboard.writeText(j); alert('تم نسخ التقدّم ✔ الصقه في ملاحظات أو رسالة لنفسك.'); } catch (e) { const b = box.querySelector('#pBox'); b.classList.remove('hidden'); b.value = j; b.select(); } };
  const doImport = txt => { try { const o = JSON.parse(txt); if (!o.items) throw 0; S = Object.assign(defaults(), o); S.settings = Object.assign(defaults().settings, o.settings || {}); save(); applyReadSettings(); alert('تم الاستيراد ✔'); tabSum(box); } catch (e) { alert('الملف غير صالح'); } };

  box.querySelector('#pFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => doImport(rd.result); rd.readAsText(f); };

}

function printReport() {
  const pa = $('#printArea'); const info = stageInfo(); const real = S.sessions.filter(s => !s.test); const week = S.sessions.filter(s => s.date >= dayKey(6));
  let h = '<h1>تقرير متابعة — ' + esc(S.name) + '</h1><div>التاريخ: ' + today() + ' • المستوى: ' + STAGE_NAMES[info.st] + '</div>';
  h += '<h2>الأرقام العامة</h2><table><tr><td>النجوم</td><td>' + S.stars + '</td><td>الدروس</td><td>' + real.length + '</td><td>دقائق التعلّم</td><td>' + Math.round(S.totalMin) + '</td><td>أيام متتالية</td><td>' + S.streak + '</td></tr></table>';
  h += '<h2>المهارات</h2><table><tr><th>المهارة</th><th>الإتقان</th></tr>' + SKILL_AXES.map(g => { const v = skillValue(g); return '<tr><td>' + GROUP_NAMES[g] + '</td><td>' + (v === null ? '—' : v + '%') + '</td></tr>'; }).join('') + '</table>';
  h += '<h2>توصيات</h2><ul>' + buildRecs().map(r => '<li>' + esc(r.text) + '</li>').join('') + '</ul>';
  const cf = confusionList().slice(0, 6); if (cf.length) h += '<h2>حروف يخلط بينها</h2><table><tr><th>المطلوب</th><th>اختار</th><th>المرات</th></tr>' + cf.map(c => '<tr><td>' + c.a + '</td><td>' + c.b + '</td><td>' + c.n + '</td></tr>').join('') + '</table>';
  const fl = S.fluency.slice(-8); if (fl.length) h += '<h2>الطلاقة</h2><table><tr><th>التاريخ</th><th>النص</th><th>كلمات/دقيقة</th><th>الدقة</th></tr>' + fl.map(f => '<tr><td>' + f.date + '</td><td>' + esc(f.title) + '</td><td>' + (f.wpm || '—') + '</td><td>' + Math.round(f.acc * 100) + '%</td></tr>').join('') + '</table>';
  h += '<h2>جلسات الأسبوع</h2><table><tr><th>التاريخ</th><th>دقائق</th><th>نجوم</th><th>ملاحظة المدرّب</th></tr>' + (week.map(s => '<tr><td>' + s.date + '</td><td>' + s.min + '</td><td>' + s.stars + '</td><td>' + esc(s.note || '') + '</td></tr>').join('') || '<tr><td colspan="4">—</td></tr>') + '</table>';
  pa.innerHTML = h; setTimeout(() => { try { window.print(); } catch (e) { } }, 200);
}
