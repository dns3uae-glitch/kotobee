<style>
:root{--teal:#0F9D8A;--teal-d:#0B6F61;--orange:#F28C28;--orange-d:#C46A10;--yellow:#FFD166;--ink:#23222B;--muted:#6B6978;--red:#E25555;--green:#2FAE6B;--shadow:0 6px 20px rgba(35,34,43,.10);--font:'Baloo Bhaijaan 2','Cairo','Segoe UI',Tahoma,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,#E6F7F5 0%,#FFF6E5 45%,#F3EDFF 100%) fixed;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.hidden{display:none!important}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg i{position:absolute;border-radius:50%;opacity:.35;animation:bgFloat 9s ease-in-out infinite alternate}
@keyframes bgFloat{0%{transform:translate(0,0)}100%{transform:translate(-24px,30px)}}
#shell{position:relative;z-index:1;height:100%;height:100dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:14px}
#avatar{width:110px;height:110px;flex-shrink:0;animation:idleBob 3s ease-in-out infinite}
@keyframes idleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tname{font-size:14px;font-weight:700;color:var(--teal-d);text-align:center;margin-top:-6px}
.bubble{flex:1;background:#fff;border-radius:24px;padding:14px 18px;box-shadow:var(--shadow);font-size:22px;line-height:1.6;position:relative;display:flex;gap:10px;align-items:center}
.bubble span{flex:1}
.bubble button{width:52px;height:52px;border-radius:50%;background:var(--yellow);font-size:24px;flex-shrink:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:34px;color:var(--teal-d);display:flex;align-items:center;gap:10px}
.brand h1 small{font-size:16px;color:var(--muted);font-weight:600}
.pill{background:#fff;border-radius:30px;padding:6px 16px;font-size:22px;font-weight:800;box-shadow:var(--shadow)}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.grid .sc{flex:0 1 calc(33.333% - 11px)}
.sc{position:relative;overflow:hidden;border-radius:30px;color:#fff;padding:18px 14px 16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 0 rgba(0,0,0,.14),var(--shadow);animation:cardFloat 4s ease-in-out infinite;transition:transform .15s}
.sc:nth-child(2){animation-delay:.5s}.sc:nth-child(3){animation-delay:1s}.sc:nth-child(4){animation-delay:1.5s}.sc:nth-child(5){animation-delay:2s}
@keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sc:active,.sc.pick{transform:scale(.94)}
.sc .ic{font-size:76px;line-height:1.1;animation:symPulse 2.4s ease-in-out infinite;position:relative;z-index:1}
@keyframes symPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(-4deg)}}
.sc .nm{font-size:30px;font-weight:800;position:relative;z-index:1;line-height:1.2}
.sc .en{font-size:16px;opacity:.92;font-weight:700;position:relative;z-index:1}
.sc .lg{font-size:13px;background:rgba(255,255,255,.25);border-radius:20px;padding:2px 10px;margin-top:4px;position:relative;z-index:1}
.sc .meta{font-size:15px;font-weight:700;position:relative;z-index:1}
.sc .bar{width:80%;height:10px;border-radius:10px;background:rgba(255,255,255,.3);overflow:hidden;position:relative;z-index:1}
.sc .bar i{display:block;height:100%;background:#fff;border-radius:10px}
.sc:after{content:attr(data-deco);position:absolute;font-size:56px;opacity:.16;bottom:-6px;left:8px;transform:rotate(-12deg)}

,kw:['جبل','سماء','فوق'],d:['تَحْتَ المَاءِ','فِي المَطْبَخِ']}}\n];\n\nconst STORIES = [\n  {title:'سَامِي وَالقِطَّةُ',e:'👦🐱',lines:['ذَهَبَ سَامِي إِلَى الحَدِيقَةِ.','رَأَى قِطَّةً صَغِيرَةً تَحْتَ الشَّجَرَةِ.','أَعْطَاهَا سَامِي قَلِيلًا مِنَ الحَلِيبِ.','فَرِحَتِ القِطَّةُ وَلَعِبَتْ مَعَهُ.'],\n   q:[{q:'أَيْنَ ذَهَبَ سَامِي؟',o:[['الحَدِيقَة','🌳'],['المَدْرَسَة','🏫'],['السُّوق','🛒']],a:0},{q:'مَاذَا أَعْطَى سَامِي القِطَّةَ؟',o:[['خُبْزًا','🍞'],['حَلِيبًا','🥛'],['تُفَّاحَةً','🍎']],a:1}]},\n  {title:'يَوْمُ المَدْرَسَةِ',e:'🧒🏫',lines:['اِسْتَيْقَظَ خَالِدٌ مُبَكِّرًا.','لَبِسَ مَلَابِسَهُ وَحَمَلَ حَقِيبَتَهُ.','ذَهَبَ إِلَى المَدْرَسَةِ بِالحَافِلَةِ.','تَعَلَّمَ دَرْسًا جَدِيدًا وَعَادَ سَعِيدًا.'],\n   q:[{q:'بِمَاذَا ذَهَبَ خَالِدٌ إِلَى المَدْرَسَةِ؟',o:[['بِالدَّرَّاجَةِ','🚲'],['بِالسَّيَّارَةِ','🚗'],['بِالحَافِلَةِ','🚌']],a:2},{q:'مَاذَا حَمَلَ خَالِدٌ؟',o:[['حَقِيبَتَهُ','🎒'],['كُرَتَهُ','⚽'],['هَاتِفَهُ','📱']],a:0}]},\n  {title:'العُصْفُورُ الصَّغِيرُ',e:'👧🐦',lines:['وَقَعَ عُصْفُورٌ صَغِيرٌ مِنْ عُشِّهِ.','رَأَتْهُ نُورَةُ فِي الحَدِيقَةِ.','حَمَلَتْهُ بِرِفْقٍ وَأَعَادَتْهُ إِلَى العُشِّ.','شَكَرَتْهَا أُمُّ العُصْفُورِ بِالتَّغْرِيدِ.'],\n   q:[{q:'مَنْ وَجَدَ العُصْفُورَ؟',o:[['سَامِي','👦'],['نُورَة','👧'],['خَالِد','🧒']],a:1},{q:'إِلَى أَيْنَ أَعَادَتْهُ؟',o:[['إِلَى البَيْتِ','🏠'],['إِلَى المَدْرَسَةِ','🏫'],['إِلَى العُشِّ','🪹']],a:2}]},\n  {title:'رِحْلَةُ البَحْرِ',e:'🏖️🌊',lines:['ذَهَبَتِ العَائِلَةُ إِلَى البَحْرِ.','سَبَحَ أَحْمَدُ مَعَ أَبِيهِ.','بَنَتْ أُخْتُهُ قَلْعَةً مِنَ الرَّمْلِ.','عَادُوا إِلَى البَيْتِ عِنْدَ الغُرُوبِ.'],\n   q:[{q:'مَعَ مَنْ سَبَحَ أَحْمَدُ؟',o:[['مَعَ أَبِيهِ','👨'],['مَعَ أُخْتِهِ','👧'],['مَعَ صَدِيقِهِ','🧒']],a:0},{q:'مَاذَا بَنَتْ أُخْتُهُ؟',o:[['بَيْتًا','🏠'],['قَلْعَةً مِنَ الرَّمْلِ','🏰'],['سَفِينَةً','🚢']],a:1}]},\n  {title:'الشُّرْطِيُّ الشُّجَاعُ',e:'👮🚦',lines:['يَقِفُ الشُّرْطِيُّ فِي الشَّارِعِ كُلَّ صَبَاحٍ.','يُسَاعِدُ الأَطْفَالَ عَلَى عُبُورِ الطَّرِيقِ.','رَأَى طِفْلًا ضَائِعًا يَبْكِي.','أَخَذَهُ بِلُطْفٍ وَأَعَادَهُ إِلَى أُمِّهِ.'],\n   q:[{q:'مَاذَا يَفْعَلُ الشُّرْطِيُّ كُلَّ صَبَاحٍ؟',o:[['يَنَامُ','😴'],['يُسَاعِدُ الأَطْفَالَ','🚸'],['يَلْعَبُ','⚽']],a:1},{q:'إِلَى مَنْ أَعَادَ الطِّفْلَ؟',o:[['إِلَى أُمِّهِ','👩'],['إِلَى مُعَلِّمِهِ','🧑‍🏫'],['إِلَى صَدِيقِهِ','🧒']],a:0}]},\n  {title:'حَدِيقَةُ جَدِّي',e:'👴🌱',lines:['عِنْدَ جَدِّي حَدِيقَةٌ جَمِيلَةٌ.','يَزْرَعُ فِيهَا الوَرْدَ وَالنَّخْلَ.','أُسَاعِدُهُ فِي سَقْيِ الأَشْجَارِ.','وَنَأْكُلُ التَّمْرَ مَعًا تَحْتَ النَّخْلَةِ.'],\n   q:[{q:'مَاذَا يَزْرَعُ جَدِّي؟',o:[['الوَرْدَ وَالنَّخْلَ','🌹🌴'],['الأَرُزَّ','🍚'],['الفَرَاوِلَةَ','🍓']],a:0},{q:'مَاذَا نَأْكُلُ تَحْتَ النَّخْلَةِ؟',o:[['المَوْزَ','🍌'],['التَّمْرَ','🌴'],['الخُبْزَ','🍞']],a:1}]},\n  /* قصص أطول للمراحل المتقدمة، مع سؤال استنتاج */\n  {title:'الأَمَانَةُ',e:'👦👛',long:true,lines:['وَجَدَ يُوسُفُ مِحْفَظَةً عَلَى الرَّصِيفِ.','فَتَحَهَا فَرَأَى فِيهَا نُقُودًا وَبِطَاقَةً.','لَمْ يَأْخُذْ يُوسُفُ شَيْئًا مِنْهَا.','ذَهَبَ بِهَا إِلَى مَرْكَزِ الشُّرْطَةِ.','اتَّصَلَ الشُّرْطِيُّ بِصَاحِبِهَا فَشَكَرَ يُوسُفَ كَثِيرًا.'],\n   q:[{q:'أَيْنَ وَجَدَ يُوسُفُ المِحْفَظَةَ؟',o:[['عَلَى الرَّصِيفِ','🛣️'],['فِي المَدْرَسَةِ','🏫'],['فِي السَّيَّارَةِ','🚗']],a:0},{q:'مَاذَا فَعَلَ يُوسُفُ بِالمِحْفَظَةِ؟',o:[['أَخَذَ النُّقُودَ','💰'],['سَلَّمَهَا لِلشُّرْطَةِ','👮'],['رَمَاهَا','🗑️']],a:1},{q:'مَا صِفَةُ يُوسُفَ؟',o:[['كَسُولٌ','😴'],['غَاضِبٌ','😠'],['أَمِينٌ','😇']],a:2}]},\n  {title:'سِبَاقُ الجَرْيِ',e:'🏃🏅',long:true,lines:['اِسْتَعَدَّ مَاجِدٌ لِسِبَاقِ الجَرْيِ فِي المَدْرَسَةِ.','تَدَرَّبَ كُلَّ يَوْمٍ بَعْدَ الظُّهْرِ.','فِي يَوْمِ السِّبَاقِ سَقَطَ مَاجِدٌ عَلَى الأَرْضِ.','نَهَضَ بِسُرْعَةٍ وَأَكْمَلَ الجَرْيَ.','لَمْ يَفُزْ بِالمَرْكَزِ الأَوَّلِ لَكِنَّ الجَمِيعَ صَفَّقُوا لَهُ.'],\n   q:[{q:'لِمَاذَا تَدَرَّبَ مَاجِدٌ؟',o:[['لِلسَّفَرِ','✈️'],['لِسِبَاقِ الجَرْيِ','🏃'],['لِلنَّوْمِ','😴']],a:1},{q:'مَاذَا حَدَثَ يَوْمَ السِّبَاقِ؟',o:[['سَقَطَ مَاجِدٌ','🤕'],['تَأَخَّرَ المُعَلِّمُ','⏰'],['اِنْتَهَى السِّبَاقُ','🏁']],a:0},{q:'لِمَاذَا صَفَّقَ om() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }\nconst pad = n => String(n).padStart(2, '0');\nfunction today() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }\nfunction dayKey(offset) { const d = new Date(); d.setDate(d.getDate() - offset); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }\nfunction median(a) { if (!a.length) return 0; a = a.slice().sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }\nfunction esc(s) { return String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c])); }\n\n/* ---------- الحالة ---------- */\nfunction defaults() {\n  return {\n    v: 2, name: '', created: Date.now(), items: {}, log: [], sessions: [], stars: 0, streak: 0, lastDay: '', totalMin: 0,\n    introduced: [], storiesDone: 0, badges: [], minStage: 1, placement: null, resume: null, fluency: [], conf: {}, parentMsg: null, notes: [], moods: [], focus: '',\n    settings: { voiceURI: '', rate: 0.85, pin: '1234', mic: true, keySpeak: true, lessonLen: 10, readFont: 'naskh', scale: 1.1, sylColor: true, tashkeel: 'auto', goalMin: 10, parentName: '', voiceStyle: 'normal' }\n  };\n}\nfunction loadState() {\n  let st = defaults();\n  try {\n    const r = localStorage.getItem(KEY);\n    if (r) { const o = JSON.parse(r); st = Object.assign(st, o); st.settings = Object.assign(defaults().settings, o.settings || {}); return st; }\n    const old = localStorage.getItem(OLD_KEY);\n    if (old) { const o = JSON.parse(old); ['name', 'items', 'sessions', 'stars', 'streak', 'lastDay', 'totalMin', 'introduced', 'storiesDone', 'badges'].forEach(k => { if (o[k] !== undefined) st[k] = o[k]; }); if (o.settings) st.settings = Object.assign(st.settings, o.settings); }\n  } catch (e) { }\n  return st;\n}\nlet S = loadState();\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) et readyAt = Date.now(); const firstDone = new Set(); const taskStart = Date.now();\n  const A = {\n    t, test: !!t.test,\n    alive: () => RUN === run,\n    say: async (txt, o) => { if (RUN !== run) return; await speak(txt, o); },\n    mood: (m, ms) => { if (RUN === run) setMood(m, ms); },\n    ready() { readyAt = Date.now(); },\n    hints(fns) { if (RUN === run && !A.test) hintsSet(fns); },\n    hintCount: () => HINT.used,\n    attempt(id, good, meta) {\n      meta = meta || {}; const ms = Date.now() - readyAt; readyAt = Date.now(); const L = LESSON; L.attempts++; if (good) L.goods++;\n      const first = !firstDone.has(id);\n      if (first) {\n        firstDone.add(id); mark(id, good, ms, HINT.used);\n        const g = groupOf(id); L.gs[g] = L.gs[g] || { ok: 0, n: 0 }; L.gs[g].n++; if (good) L.gs[g].ok++;\n        if (!good && meta.conf) noteConfusion(meta.conf[0], meta.conf[1]);\n      } else { S.log.push({ t: Date.now(), id, g: good ? 1 : 0, ms, h: HINT.used, r: 1 }); }\n      if (good) { L.okRun++; L.badRun = 0; if (L.okRun > L.bestRun) L.bestRun = L.okRun; }\n      else { L.okRun = 0; L.badRun++; if (meta.echo) L.lastWrong = meta.echo; }\n      updateStatus();\n      return { ms, first, fast: good && ms < 6000 && HINT.used === 0, combo: good ? L.okRun : 0 };\n    },\n    async praise(info) {\n      if (RUN !== run) return; info = info || {};\n      if (A.test) { await speak(pickPhrase('testOk')); return; }\n      const cb = [3, 5, 8].includes(info.combo) ? info.combo : 0;\n      sfxGood(); flash('✅'); setMood(info.combo >= 5 ? 'cheer' : 'happy', 2400);\n      if (cb) { sfxCombo(); showCombo(info.combo); if (cb >= 5) confetti(40); }\n      await speak(praiseText({ combo: cb, hints: HINT.used, fast: info.fast, first: info.first && HINT.used === 0 }));\n    },\n    async oops(info) {\n      if (RUN !== run) return; info = info || {};\n      if (A.test) { await speak(pickPhrase('testOk')); return; }\n      sfxBad(); flash('🤔'); setMood('oops', 2400);\n      await speak(info.msg ? info.msg : pickPhrase(info.tries >= 2 ? 'oops2' : 'oops1'));\n    },\n    async finish(stars) {\n      if (RUN !== run) return;\n      stars = Math.max(0, stars | 0); if (HINT.used > 0 && stars > 1) stars = Math.max(1, stars - Math.min(HINT.used, 2));\n      if (A.test) stars = 0;\n      S.stars += stars; LESSON.stars += stars; LESSON.results.push({ type: t.type, stars, ms: Date.now() - taskStart });\n      save(); updateStars(); updateStatus(); hintsClear();\n      if (stars > 0) { sfxStar(); flash(stars >= 3 ? '🌟' : '⭐'); await sleep(650); }\n      const nb = checkBadges();\n      for (const b of nb) { if (RUN !== run) return; flash(b.ic); confetti(50); setMood('cheer', 2600); await speak('مبروك! حصلت على وسام جديد: ' + b.t); }\n      if (RUN !== run) return;\n      if (!A.test) await adaptLesson(run);\n      if (RUN !== run) return;\n      LESSON.i++; nextTask();\n    }\n  };\n  return A;\n}\n\n/* ---------- التكيّف أثناء الدرس: دعم، تحدٍّ، استراحة، إنهاء مبكر ---------- */\nfunction challengeTask() {\n  const st = stageInfo().st;\n  if (st <= 2) { const l = rnd(HARAKA_LETTERS.filter(x => introducedLetters().includes(x))) || 'ب'; return { type: 'haraka_pick', l, h: Math.floor(Math.random() * 3), long: true, challenge: true, phase: 'challenge' }; }\n  if (st === 3) return { type: 'sentence_read', s: rnd(sentencesLv([1, 2])), challenge: true, phase: 'challenge' };\n  if (st === 4) return { type: 'sentence_read', s: rnd(sentencesLv([3])), challenge: true, phase: 'challenge' };\n  return { type: 'word_read', mode: 'fade', w: rnd(WORDS.D), challenge: true, phase: 'challenge' };\n}\nasync function adaptLesson(run) {\n  const L = LESSON; if (!L) return;\n  if (!L.goalDone && L.stars >= L.goal) { L.goalDone = true; confetti(80); setMood('cheer', 3000); sfxStar(); await speak(fmt('وصلت إلى هدف اليوم يا {n}! ما شاء الله عليك.')); if (RUN !== run) return; }\n  const elapsed = (Date.now() - L.start - L.pausedMs) / 60000;\n  if (L.badRun >= 5 && L.inserted           if (tries >= maxTries) {\n            row.dataset.lock = '1'; Array.from(row.children).forEach(x => { if (String(x.dataset.v) === String(cfg.correct)) x.classList.add('ok'); });\n            await api.oops({ msg: api.test ? null : cfg.revealSay, tries }); resolve({ tries, good: false });\n          } else { setTimeout(() => b.classList.add('dim'), 400); await api.oops({ tries, msg: cfg.wrongSay ? cfg.wrongSay(o.v) : null }); }\n        }\n      };\n      row.appendChild(b);\n    });\n    c.appendChild(row);\n  });\n}\nfunction hintEliminate(c, correct, count) {\n  const row = c.querySelector('#choiceRow'); if (!row) return;\n  let left = count || 1; Array.from(row.children).forEach(b => { if (left > 0 && String(b.dataset.v) !== String(correct) && !b.classList.contains('dim')) { b.classList.add('dim'); left--; } });\n}\n\n/* ---------- الاستقبال: مزاج، رسالة ولي الأمر، ملخص سابق، هدف ---------- */\nfunction lessonGreeting() {\n  const h = new Date().getHours(); const g = h < 12 ? 'صباح الخير' : (h < 17 ? 'مساء الخير' : 'مساء النور');\n  let s = g + ' يا ' + S.name + '! أنا الأستاذة نورة. ';\n  const last = S.sessions.filter(x => !x.test).slice(-1)[0];\n  if (S.streak >= 2) s += 'أنت تتدرب منذ ' + S.streak + ' أيام متتالية، وهذا رائع. ';\n  if (last) { s += 'في المرة الماضية جمعت ' + last.stars + ' نجمة'; if (last.best) s += '، وكنت قويًا في ' + GROUP_NAMES[last.best]; s += '. '; if (last.worst) s += 'واليوم سنراجع قليلًا من ' + GROUP_NAMES[last.worst] + '. '; }\n  return s;\n}\nTASKS.checkin = async (t, api) => {\n  const c = card('center');\n  const pm = S.parentMsg && !S.parentMsg.heard ? S.parentMsg : null;\n  c.innerHTML = '<div style=\"font-size:30px;font-weight:800;color:var(--teal-d)\">كيف حالك اليوم يا ' + esc(S.name) + '؟<\/div><div class=\"hint\" style=\"margin-top:6px\">اختر الوجه الذي يشبهك<\/div><div class=\"row\" id=\"moods\" style=\"margin-top:16px\"><\/div>';\n  const M = [['😄', 'مستعد جدًا', 'great'], ['🙂', 'عادي', 'ok'], ['😴', 'متعب', 'tir isabled = false; if (left === 0) { clearInterval(tick); } }, 500);\n  const fin = () => { clearInterval(tick); LESSON.pausedMs += Date.now() - t0; };\n  c.querySelector('#go').onclick = () => { fin(); api.finish(0); };\n  c.querySelector('#stop').onclick = () => { fin(); LESSON.tasks.length = LESSON.i + 1; api.finish(0); };\n  setMood('happy', 3000); await api.say(pickPhrase('breakStart'));\n};\n\n/* ---------- مقدمة التقييم المبدئي ---------- */\nTASKS.test_intro = async (t, api) => {\n  const c = card('center');\n  c.innerHTML = '<div style=\"font-size:90px\">🎯<\/div><div style=\"font-size:30px;font-weight:800;color:var(--teal-d)\">لعبة التعرّف على مستواك<\/div><div class=\"hint\" style=\"margin:8px 0 14px\">أسئلة قصيرة، لا تقلق إن لم تعرف الإجابة<\/div><button class=\"btn xl\" id=\"go\">▶️ ابدأ<\/button>';\n  c.querySelector('#go').onclick = () => api.finish(0);\n  await api.say(fmt('أهلًا يا {n}! سنلعب لعبة قصيرة أعرف منها ما تتقنه وما سنتدرب عليه. هذا ليس اختبارًا مدرسيًا، ولا يوجد عقاب. أجب بأفضل ما تستطيع، وإن لم تعرف فلا بأس. اضغط ابدأ.'));\n};\n\n;\n/* ============ 06 - الشاشات: الإعداد، الرئيسية، النجوم ============ */\nfunction applyReadSettings() {\n  document.body.setAttribute('data-font', S.settings.readFont || 'naskh');\n  document.documentElement.style.setProperty('--rs', String(S.settings.scale || 1.1));\n}\nfunction langName(code) { try { if (/^ar/i.test(code)) return ''; const dn = new Intl.DisplayNames(['ar'], { type: 'language' }); const n = dn.of(String(code).replace('_', '-')); return n ? ' — ' + n : ''; } catch (e) { return ''; } }\nfunction fillVoiceSelect(sel) {\n  loadVoices(); sel.innerHTML = ''; const ar = rankedArabicVoices();\n  const o0 = el('option', '', IS_IOS ? '⭐ صوت الآيباد المختار في الإعدادات (Mariam Enhanced)' : 'تلقائي (يختار أعلى جودة متاحة)'); o0.value = ''; sel.appendChild(o0);\n  if (!IS_IOS) { const os = el('option', '', 'صوت النظام الافتراضي'); os.value = '__system__'; if (S.settings.voiceURI === '__system__') os.select     pd.textContent = '•'.repeat(pin.length);\n    };\n    pp.appendChild(b);\n  });\n  m.querySelector('#cancel').onclick = () => m.remove();\n}\n\n/* ---------- رسوم SVG بسيطة ---------- */\nconst SKILL_AXES = ['letters', 'harakat', 'listening', 'words', 'sentences', 'spelling', 'expression', 'comprehension', 'fluency'];\nconst SKILL_SHORT = { letters: 'الحروف', harakat: 'المقاطع', listening: 'السمع', words: 'الكلمات', sentences: 'الجمل', spelling: 'الإملاء', expression: 'التعبير', comprehension: 'الفهم', fluency: 'الطلاقة' };\nfunction skillValue(g) {\n  if (g === 'fluency') { const f = S.fluency.slice(-3); if (!f.length) return null; return Math.round(f.reduce((a, x) => a + x.acc, 0) / f.length * 100); }\n  return skillPct(g, 40);\n}\nfunction radarSVG() {\n  const cx = 160, cy = 160, R = 105, n = SKILL_AXES.length; let s = '<svg viewBox=\"0 0 320 320\" width=\"320\" height=\"320\" style=\"max-width:100%\">';\n  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };\n  [25, 50, 75, 100].forEach(p => { s += '<polygon points=\"' + SKILL_AXES.map((_, i) => pt(i, R * p / 100).join(',')).join(' ') + '\" fill=\"none\" stroke=\"#D5E3E4\" stroke-width=\"1\"/>'; });\n  SKILL_AXES.forEach((g, i) => { const [x, y] = pt(i, R); s += '<line x1=\"' + cx + '\" y1=\"' + cy + '\" x2=\"' + x + '\" y2=\"' + y + '\" stroke=\"#D5E3E4\"/>'; const [lx, ly] = pt(i, R + 24); const v = skillValue(g); s += '<text x=\"' + lx + '\" y=\"' + (ly + 4) + '\" text-anchor=\"middle\" font-size=\"13\" fill=\"#23222B\" font-family=\"inherit\">' + SKILL_SHORT[g] + '<\/text>'; });\n  const vals = SKILL_AXES.map(g => skillValue(g) || 0);\n  s += '<polygon points=\"' + vals.map((v, i) => pt(i, R * v / 100).join(',')).join(' ') + '\" fill=\"rgba(15,157,138,.35)\" stroke=\"#0F9D8A\" stroke-width=\"2.5\"/>';\n  vals.forEach((v, i) => { const [x, y] = pt(i, R * v / 100); s += '<circle cx=\"' + x + '\" cy=\"' + y + '\" r=\"4\" fill=\"#0B6F61\"/>'; });\n  return s + '<\/svg>';\n}\nfunction lineSVG(vals, labels, color, w, h, unit) {\n  w = w || 520; h = h || 170; const padL = 30, padB = 26, padT = 14; const pts = vals.map((v, i) => v === null ? null : [padL + i * ((w - padL - 10) / Math.max(1, vals.length - 1)), padT + (1 - v / 100) * (h - padT - padB)]);\n  let s = '<svg viewBox=\"0 0 ' + w + ' ' + h + '\" width=\"100%\" style=\"max-width:' + w + 'px;direction:ltr\">';\n  [0, 50, 100].forEach(g => { const y = padT + (1 - g / 100) * (h - padT - padB); s += '<line x1=\"' + padL + '\" y1=\"' + y + '\" x2=\"' + (w - 6) + '\" y2=\"' + y + '\" stroke=\"#E3EBEC\"/><text x=\"2\" y=\"' + (y + 4) + '\" font-size=\"11\" fill=\"#6B6978\">' + g + unit + '<\/text>'; });\n  const seg = pts.filter(p => p); if (seg.length > 1) s += '<polyline fill=\"none\" stroke=\"' + color + '\" stroke-width=\"3\" points=\"' + seg.map(p => p.join(',')).join(' ') + '\"/>';\n  pts.forEach((p, i) => { if (p) s += '<circle cx=\"' + p[0] + '\" cy=\"' + p[1] + '\" r=\"4\" fill=\"' + color + '\"/>'; s += '<text x=\"' + (padL + i * ((w - padL - 10) / Math.max(1, vals.length - 1))) + '\" y=\"' + (h - 8) + '\" font-size=\"11\" text-anchor=\"middle\" fill=\"#6B6978\">' + labels[i] + '<\/text>'; });\n  return s + '<\/svg>';\n}\nfunction dailyAcc(days) { const out = [], labs = []; for (let i = days - 1; i >= 0; i--) { const k = dayKey(i); const d0 = new Date(k + 'T00:00:00').getTime(), d1 = d0 + 86400000; const L = S.log.filter(l => l.t >= d0 && l.t < d1); out.push(L.length >= 3 ? Math.round(L.reduce((a, l) => a + l.g, 0) / L.length * 100) : null); labs.push(k.slice(8)); } return { out, labs }; }\nfunction respTimes() {\n  const by = {}; S.log.slice(-1500).forEach(l => { if (!l.ms || l.ms > 120000 || l.r) return; const g = groupOf(l.id); (by[g] = by[g] || []).push(l.ms); });\n  const out = {}; Object.keys(by).forEach(g => { if (by[g].length >= 4) out[g] = Math.round(median(by[g]) / 100) / 10; }); return out;\n}\nfunction confusionList() {\n  return Object.keys(S.conf).map(k => { const [a, b] = k.split('>'); return { a, b, n: S.conf[k] }; }).sort((x, y) => y.n - x.n);\n}\n\n/* ---------- التوصيات التلقائية ---------- */\nfunction buildRecs() {\n  const R = []; const add = (cls, ic, text) => R.push({ cls, ic, text });\n  const real = S.sessions.filter(s => !s.test); const last = real.slice(-1)[0];\n  if (S.placement) { const p = S.placement; if (p.stage === 1) add('warn', '🩺', 'نتيجة التقييم المبدئي: ما زال التعرّف على الحروف يحتاج بناءً. نوصي بالتوازي مع البرنامج بمراجعة أخصائي قراءة أو صعوبات تعلّم لتقييم رسمي (يشمل النظر والسمع والعسر القرائي)، فهذا يساعد على اختيار أفضل دعم.'); else add('', '📋', 'نقطة البداية بعد التقييم المبدئي: ' + STAGE_NAMES[p.stage] + '.'); }\n  else add('warn', '🎯', 'لم يُجرَ التقييم المبدئي بعد. من تبويب «رسالة وأهداف» يمكنك بدؤه ليضبط البرنامج مستوى الطفل بدقة.');\n  if (!real.length) { add('', '▶️', 'لم يبدأ الطفل دروسه بعد. ابدأ معه أول درس واجلس بجانبه في الأيام الثلاثة الأولى.'); }\n  else {\n    const gap = Math.floor((Date.now() - last.ts) / 86400000);\n    if (gap >= 3) add('warn', '⏰', 'مرّت ' + gap + ' أيام منذ آخر درس. الانتظام (10 دقائق يوميًا) أهم من الجلسات الطويلة، جرّب تحديد وقت ثابت.');\n    if (S.streak >= 3) add('good', '🔥', 'التزام ممتاز: ' + S.streak + ' أيام متتالية. شجّعه بكلمة طيبة.');\n  }\n  const cf = confusionList().filter(c => c.n >= 2).slice(0, 3);\n  cf.forEach(c => { const la = letterObj(c.a), lb = letterObj(c.b); add('warn', '🔀', 'يخلط بين حرف (' + c.a + ') وحرف (' + c.b + ') — ' + c.n + ' مرات. درّبه على الفرق: ' + (la ? la.word : '') + ' مقابل ' + (lb ? lb.word : '') + '، واطلب منه نطق الحرفين بالتناوب ثم كتابتهما.'); });\n  const rt = respTimes(); const readRt = [rt.words, rt.sentences].filter(Boolean); if (readRt.length && median(readRt) > 12) add('warn', '🐢', 'يتردد طويلًا قبل قراءة الكلمات (متوسط ' + median(readRt) + ' ثانية). هذا طبيعي في البداية؛ شجّعه على القراءة بالمقاطع وإعادة الكلمة ببطء.');\n  if (real.length >= 3) { const hs = real.slic ى: مراجعة ← تعلّم ← تدريب ← تطبيق. تتابع الطفل لحظة بلحظة: تقيس زمن الاستجابة، وتعطي تلميحات متدرجة (مصباح 💡)، وإذا أخطأ 3 مرات متتالية تبسّط وتقرأ معه، وإذا أجاب 5 صحيحة متتالية تعطيه تحديًا، وبعد 12 دقيقة تقترح استراحة.<br><br>' +\n    '<b>التقييم المبدئي:<\/b> لعبة قصيرة تحدد نقطة البداية (من الحروف إلى النصوص). يُنصح بإعادتها كل شهر.<br><br>' +\n    '<b>القراءة الطليقة:<\/b> يقرأ الطفل نصًا قصيرًا وصاحب الجهاز يتابع كلماته وهو يقرأ ويلوّنها ويساعده عند التعثر. على الآيباد تتم المتابعة بضغط الطفل على كل كلمة وهو يقرؤها بصوته (لأن سفاري لا يدعم الاستماع المستمر).<br><br>' +\n    '<b>الآيباد:<\/b> افتح الرابط في سفاري ← زر المشاركة ← «إضافة إلى الشاشة الرئيسية». فعّل الإملاء الصوتي العربي: الإعدادات ← عام ← لوحة المفاتيح ← تمكين الإملاء الصوتي، وأضف لوحة مفاتيح عربية، وأعطِ الموقع إذن الميكروفون عند السؤال.<br><br>' +\n    '<b>نصائح:<\/b> اجلس معه في أول 3 أيام ثم اتركه يعمل وحده • 10 دقائق يوميًا أفضل من ساعة أسبوعيًا • اكتب له رسالة تشجيع من تبويب «رسالة وأهداف» • احفظ نسخة احتياطية أسبوعيًا • عند الشك في صعوبة تعلّم محددة استشر أخصائيًا بالتوازي.<\/div>';\n}\n\n/* ---------- تقرير للطباعة ---------- */\nfunction printReport() {\n  const pa = $('#printArea'); const info = stageInfo(); const real = S.sessions.filter(s => !s.test); const week = S.sessions.filter(s => s.date >= dayKey(6));\n  let h = '<h1>تقرير متابعة — ' + esc(S.name) + '<\/h1><div>التاريخ: ' + today() + ' • المستوى: ' + STAGE_NAMES[info.st] + '<\/div>';\n  h += '<h2>الأرقام العامة<\/h2><table><tr><td>النجوم<\/td><td>' + S.stars + '<\/td><td>الدروس<\/td><td>' + real.length + '<\/td><td>دقائق التعلّم<\/td><td>' + Math.round(S.totalMin) + '<\/td><td>أيام متتالية<\/td><td>' + S.streak + '<\/td><\/tr><\/table>';\n  h += '<h2>المهارات<\/h2><table><tr><th>المهارة<\/th><th>الإتقان<\/th><\/tr>' + SKILL_AXES.map(g => { const v = skillValue(g); return '<tr><td>' + GROUP_NAMES[g] + '<\/td><td>' + (v === null ? '—' : v + '%') + '<\/td><\/tr>'; }).join('') + '<\/table>';\n  h += '<h2>توصيات<\/h2><ul>' + buildRecs().map(r => '<li>' + esc(r.text) + '<\/li>').join('') + '<\/ul>';\n  const cf = confusionList().slice(0, 6); if (cf.length) h += '<h2>حروف يخلط بينها<\/h2><table><tr><th>المطلوب<\/th><th>اختار<\/th><th>المرات<\/th><\/tr>' + cf.map(c => '<tr><td>' + c.a + '<\/td><td>' + c.b + '<\/td><td>' + c.n + '<\/td><\/tr>').join('') + '<\/table>';\n  const fl = S.fluency.slice(-8); if (fl.length) h += '<h2>الطلاقة<\/h2><table><tr><th>التاريخ<\/th><th>النص<\/th><th>كلمات/دقيقة<\/th><th>الدقة<\/th><\/tr>' + fl.map(f => '<tr><td>' + f.date + '<\/td><td>' + esc(f.title) + '<\/td><td>' + (f.wpm || '—') + '<\/td><td>' + Math.round(f.acc * 100) + '%<\/td><\/tr>').join('') + '<\/table>';\n  h += '<h2>جلسات الأسبوع<\/h2><table><tr><th>التاريخ<\/th><th>دقائق<\/th><th>نجوم<\/th><th>ملاحظة المدرّب<\/th><\/tr>' + (week.map(s => '<tr><td>' + s.date + '<\/td><td>' + s.min + '<\/td><td>' + s.stars + '<\/td><td>' + esc(s.note || '') + '<\/td><\/tr>').join('') || '<tr><td colspan=\"4\">—<\/td><\/tr>') + '<\/table>';\n  pa.innerHTML = h; setTimeout(() => { try { window.print(); } catch (e) { } }, 200);\n}\n\n<\/script>\n<script>\n/* ===== جسر المنصة: ملف تعريف مشترك + زر الرجوع ===== */\n(function () {\n  if (!window.PLATFORM) return;\n  var PK = 'platform_profile', KEYS = ['age', 'pin', 'parentName', 'voiceURI', 'voiceEnURI', 'rate'];\n  function rd() { try { return JSON.parse(localStorage.getItem(PK) || 'null'); } catch (e) { return null; } }\n  var P = rd();\n  if (P && typeof S === 'object' && S) {\n    if (P.name) S.name = P.name;\n    KEYS.forEach(function (k) { if (P[k] !== undefined && P[k] !== null) S.settings[k] = P[k]; });\n    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }\n  }\n  var _save = save;\n  save = function () {\n    var r = _save.apply(this, arguments);\n    try { var p = rd() || {}, ch = false; if (S.name && p.name !== S.name) { p.name = S.name; ch = true; } KEYS.forEach(function (k) { var v = S.settings[k]; if (v !== undefined && p[k] !== v) { p[k] = v; ch = true; } }); if (ch) localStorage.setItem(PK, JSON.stringify(p)); } catch (e) { }\n    return r;\n  };\n  function goHome() {\n    try { if (typeof LESSON !== 'undefined' && LESSON && typeof snapshotLesson === 'function') snapshotLesson(); } catch (e) { }\n    try { save(); } catch (e) { } try { stopSpeak(); } catch (e) { } try { stopAllMics(); } catch (e) { }\n    try { parent.postMessage({ type: 'platform-home' }, '*'); } catch (e) { }\n  }\n  function addBtn() {\n    var hb = document.getElementById('homeBtn'); if (!hb || document.getElementById('platBtn')) return;\n    var b = document.createElement('button'); b.id = 'platBtn'; b.className = 'ibtn'; b.title = 'المنصة'; b.textContent = '🏛️';\n    b.style.cssText = 'background:linear-gradient(135deg,#FFD166,#F28C28);margin-inline-start:6px;box-shadow:0 3px 0 #C46A10';\n    b.onclick = goHome; hb.parentNode.insertBefore(b, hb.nextSibling);\n    var w = document.createElement('div'); w.style.cssText = 'display:flex;align-items:center'; hb.parentNode.insertBefore(w, hb); w.appendChild(hb); w.appendChild(b);\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addBtn); else addBtn();\n  window.addEventListener('message', function (e) { if (e.data && e.data.type === 'platform-save') { try { if (typeof LESSON !== 'undefined' && LESSON && typeof snapshotLesson === 'function') snapshotLesson(); save(); stopSpeak(); } catch (x) { } } });\n})();\n\n<\/script>\n<\/body>\n<\/html>",

{height:100%;height:100vh;height:100dvh;padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);display:flex;flex-direction:column;max-width:1180px;margin:0 auto;position:relative}\n\n/* الشريط العلوي */\n#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:10px}\n.ibtn{width:50px;height:50px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:24px;display:flex;align-items:center;justify-content:center}\n#midTop{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}\n#phaseLabel{font-size:15px;font-weight:700;color:var(--teal-d);background:var(--teal-l);border-radius:20px;padding:2px 14px;min-height:24px}\n#progressDots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}\n#progressDots span{width:13px;height:13px;border-radius:50%;background:#D9E3E4;display:inline-block;transition:.3s}\n#progressDots span.done{background:var(--green)}\n#progressDots span.cur{background:var(--orange);transform:scale(1.4)}\n.pill{background:var(--card);border-radius:30px;padding:6px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}\n\n/* المدرّب */\n#teacher{display:flex;align-items:flex-start;gap:12px;padding:2px 14px 0}\n#avatarWrap{flex:0 0 auto;width:132px;position:relative;text-align:center}\n#avatar{width:124px;height:124px;transition:transform .3s}\n#avatar[data-mood=\"cheer\"]{animation:bounce .6s 2}\n#avatar[data-mood=\"oops\"]{animation:tilt .6s 1}\n#avatar[data-mood=\"think\"]{transform:rotate(-4deg)}\n@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.05)}}\n@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}\n#teacherName{font-size:14px;font-weight:700;color:var(--teal-d);margin-top:-4px}\n#bubbleCol{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}\n#bubble{background:var(--card);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);position:relative;min-height:72px;font-size:21px;line-height:1.55;display:flex;align-items:center;justify-content:space-between;gap:10px}\n#bubble:after{content:\"\";position:absolute;right:-11px;top:26px;border:11px solid transparent;border-left-color:var(--card);border-right:0}\n#bubbleText{flex:1}\n#bubbleBtns{display:flex;gap:8px;flex:0 0 auto}\n#bubbleBtns button{width:48px;height:48px;border-radius:50%;font-size:22px;box-shadow:var(--shadow)}\n#replayBtn{background:var(--yellow)}\n#hintBtn{background:#FFF1C7;border:3px solid var(--orange)}\n#hintBtn.pulse{animation:pulse2 1.1s infinite}\n@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(242,140,40,.7)}100%{box-shadow:0 0 0 22px rgba(242,140,40,0)}}\n#statusChip{display:flex;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:700;color:var(--muted)}\n#statusChip span{background:rgba(255,255,255,.75);border-radius:14px;padding:2px 10px}\n#statusChip .goal{position:relative;overflow:hidden}\n.comboBadge{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#F28C28,#E25555);color:#fff;font-weight:800;font-size:26px;padding:8px 24px;border-radius:30px;z-index:70;box-shadow:var(--shadow);animation:pop2 1.4s forwards;pointer-events:none}\n@keyframes pop2{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%{opacity:1;transform:translateX(-50%) scale(1.15)}80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}\n\n/* وجه المدرّب */\n.talking #mTalk{display:block;animation:talk .22s infinite alternate}\n.talking .mouth:not(#mTalk){display:none}\n@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}\n.mouth{display:none;transform-box:fill-box;transform-origin:center}\n#avatar[data-mood=\"calm\"] #mSmile,#avatar:not([data-mood]) #mSmile{display:block}\n#avatar[data-mood=\"happy\"] #mSmile{display:block}\n#avatar[dat Name(st)) + '<\/b><\/div><div class=\"row\" style=\"margin-top:12px\"><button class=\"btn xl\" id=\"go\">' + tr('▶️ ابدأ الدرس', '▶️ Start lesson') + '<\/button><button class=\"btn gr\" id=\"toMap\">' + SUBJ.ic + ' ' + tr('المراحل', 'Stages') + '<\/button><\/div>';\n  stage.appendChild(c); c.querySelector('#go').onclick = () => startLesson(st); c.querySelector('#toMap').onclick = () => screenHome(false);\n  setMood('cheer', 3000); confetti(50);\n  await speak(fmt(tr('شكرًا يا {n}، أحسنت. عرفتُ مستواك، وسنبدأ من المرحلة ', 'Thank you, {n}, well done. Now I know your level, and we will start at stage ') + st + ': ' + stName(st) + '.'));\n}\n$('#homeBtn').onclick = () => { if (LESSON) { snapshotLesson(); LESSON = null; statusStop(); } screenHome(false); };\n\n;\n/* ============ الأنشطة التفاعلية ============ */\nconst TASKS = {};\nfunction card(cls) { const c = el('div', 'card ' + (cls || '')); stage.appendChild(c); return c; }\nfunction tagsHTML(t) { return (t.challenge ? '<span class=\"tag\">' + tr('⚡ تحدٍّ', '⚡ Challenge') + '<\/span> ' : '') + (t.test ? '<span class=\"tag test\">' + tr('📋 تقييم', '📋 Test') + '<\/span> ' : '') + (t.review ? '<span class=\"tag\">' + tr('🔁 مراجعة', '🔁 Review') + '<\/span> ' : ''); }\nfunction waitClick(btns) { return new Promise(res => { btns.forEach(b => { b.addEventListener('click', () => res(b), { once: true }); }); }); }\nconst isLatin = s => /[A-Za-z]/.test(s) && !/[؀-ۿ]/.test(s);\nconst dirOf = s => isLatin(String(s || '')) ? 'ltr' : 'rtl';\nfunction sfxPop() { tone(660, .07, 'sine', .05); setTimeout(() => tone(880, .07, 'sine', .04), 60); }\nfunction sweep(f1, f2, d, type, vol) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f1, AC.currentTime); o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + d); g.gain.value = vol || 0.05; if (AC.state === 'suspended') AC.resume(); o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d); } catch (e) { } }\nfunction sfxWhoosh() { sweep(900, 200, .35, 'sawtooth', .025); }\nfunction sfxReveal() { sweep(300, 900, .25, 'triangle', .05); setTimeout(() => tone(1046, .15, 'sine', .05), 230); }\nfunction sfxBoing() { sweep(400, 120, .4, 'square', .03); }\nconst THEMES = ['th-fruit', 'th-animal', 'th-toy', 'th-sweet', 'th-nature'];\nfunction sceneHTML(pic) { return '<div class=\"scene lscene ' + rnd(THEMES) + '\"><span class=\"lpic\">' + [...String(pic)].join('') + '<\/span><\/div>'; }\nfunction qText(q) { return T(q.q); }\nfunction optHTML(o) { const lab = T(o[0]), e = o[1] || ''; return (e ? '<span class=\"oe\">' + e + '<\/span>' : '') + (lab ? '<span class=\"ol\" dir=\"' + dirOf(lab) + '\">' + esc(lab) + '<\/span>' : ''); }\nfunction sameOpt(a, b) { return JSON.stringify(a) === JSON.stringify(b); }\nfunction stageChip(t) { const st = t.st || 1; return '<span class=\"tag subj\" style=\"background:' + SUBJ.color + '\">' + SUBJ.ic + ' ' + esc(stName(st)) + '<\/span>'; }\n/* نطق الكلمة المعروضة على الخيار (للصغار) */\nfunction sayLabel(o) { const l = T(o[0]); if (l) return speak(l, { silentBubble: true, rate: 1 }); return Promise.resolve(); }\nfunction sparkAt(elm) { const r = elm.getBoundingClientRect(); for (let i = 0; i < 8; i++) { const sp = el('span', 'spark', ['⭐', '✨', '🌟', '💫'][i % 4]); sp.style.left = (r.left + r.width / 2) + 'px'; sp.style.top = (r.top + r.height / 2) + 'px'; sp.style.setProperty('--dx', (Math.cos(i / 8 * 6.28) * 90) + 'px'); sp.style.setProperty('--dy', (Math.sin(i / 8 * 6.28) * 90) + 'px'); document.body.appendChild(sp); setTimeout(() => sp.remove(), 900); } }\n\n/* ---------- الشرح: بطاقات مصوّرة متحركة ---------- */\nTASKS.l_intro = async (t, api) => {\n  const cards = t.cards || []; const c = card('center lintro');\n  c.innerHTML = stageChip(t) + (t.support ? ' <span class=\"tag\">' + tr('🧑‍🏫 نراجع معًا', '🧑‍🏫 Let\\'s review together') + '<\/span>' : '') + '<div class=\"icard\" id=\"ic\"><\/div><div class=\"idots\" id=\"idots\"><\/div><div class=\"row\" id=\"ctl\" style=\"margin-top:10px\"><\/div>';\n  const ic = c.querySelector('#ic'), ctl = c.querySelector('#ctl'), dots = c.querySelector('#idots');\n  dots.innerHTML = cards.map(() => '<i><\/i>').join('');\n  async function show(i) {\n    if (!api.alive()) return; const k = cards[i];\n    ic.innerHTML = '<div class=\"scene lscene ' + THEMES[i % THEMES.length] + '\"><span class=\"ie\">' + k.e + '<\/span><\/div>' + (k.big ? '<div class=\"ibig\" dir=\"' + dirOf(T(k.big)) + '\">' + esc(T(k.big)) + '<\/div>' : '') + '<div class=\"isay\" dir=\"auto\">' + esc(T(k.say)) + '<\/div>';\n    Array.from(dots.children).forEach((d, j) => d.className = j < i ? 'done' : j === i ? 'cur' : '');\n    sfxReveal(); setMood('happy', 2000);\n    await api.say(T(k.say));\n  }\n  for (let i = 0; i < cards.length; i++) {\n    await show(i); if (!api.alive()) return;\n    ctl.innerHTML = ''; const again = el('button', 'btn gr', tr('🔊 أعيدي', '🔊 Again')), next = el('button', 'btn or', i < cards.length - 1 ? tr('التالي ⬅', 'Next ➡') : tr('👍 فهمت', '👍 Got it'));\n    ctl.appendChild(again); ctl.appendChild(next);\n    while (true) { const b = await waitClick([again, next]); if (!api.alive()) return; if (b === again) { await show(i); continue; } break; }\n  }\n  api.finish(1);\n};\n\n/* ---------- السؤال العام ---------- */\nTASKS.q = async (t, api) => {\n  const q = t.q; const f = QT[q.t] || QT.pick;\n  return f(t, q, api);\n};\nfunction qCard(t, q, extraCls) {\n  const tiny = band() === 'tiny';\n  const c = card('center lq' + (tiny ? ' tiny' : '') + (extraCls ? ' ' + extraCls : ''));\n  let h = tagsHTML(t) + stageChip(t);\n  if (q.passage) h += '<div class=\"lpass\" dir=\"' + dirOf(q.passage) + '\">' + esc(q.passage) + '<\/div>';\n  if (q.pic) h += sceneHTML(q.pic);\n  if (q.big) h += '<div class=\"lbig\" dir=\"' + dirOf(q.big) + '\">' + es 0, n).forEach(b => b.classList.add('dim')); }\n  btns.forEach(b => b.onclick = async () => {\n    if (row.dataset.lock || b.classList.contains('dim')) return; row.dataset.lock = '1'; sfxTap();\n    if (band() === 'tiny' && T(b._o[0])) await sayLabel(b._o);\n    if (!api.alive()) return;\n    if (b === corrBtn) {\n      b.classList.add('ok'); const info = api.attempt(true); info.add = T(q.ex); await api.praise(info); return api.finish(starsFor(tries));\n    }\n    b.classList.add('bad'); tries++; api.attempt(false);\n    if (tries >= maxTries) {\n      if (api.test) { await api.oops({}); return api.finish(0); }\n      corrBtn.classList.add('ok', 'reveal'); await api.oops({ msg: tr('انظر، هذا هو الجواب الصحيح. ', 'Look, this is the right answer. ') + exText(), tries });\n      await sleep(700); return api.finish(0);\n    }\n    await api.oops({ msg: pickPhrase('oops1'), tries }); setTimeout(() => b.classList.add('dim'), 250); delete row.dataset.lock;\n  });\n  api.ready(); await askQ(api, q);\n};\n/* صح أو خطأ */\nQT.tf = async (t, q, api) => {\n  const c = qCard(t, Object.assign({}, q, { pic: q.e }));\n  const yn = /[?؟]\\s*$/.test(qText(q));\n  const row = el('div', 'row tfrow'); c.appendChild(row);\n  const bT = el('button', 'btn xl tfb yes', yn ? tr('✔ نعم', '✔ Yes') : tr('✔ صح', '✔ True')), bF = el('button', 'btn xl rd tfb no', yn ? tr('✖ لا', '✖ No') : tr('✖ خطأ', '✖ False'));\n  row.appendChild(bT); row.appendChild(bF);\n  let tries = 0; const maxTries = 1;\n  api.hints([async () => { await askQ(api, q); }, async () => { await api.say(tr('انظر جيدًا إلى الصورة، وفكّر: هل الكلام صحيح؟', 'Look carefully at the picture and think: is it right?')); }]);\n  const truth = () => T(q.ex) || (q.a ? tr('نعم، هذا صحيح.', 'Yes, that is right.') : tr('لا، هذا غير صحيح.', 'No, that is not right.'));\n  const go = async v => {\n    if (row.dataset.lock) return; row.dataset.lock = '1'; sfxTap();\n    const btn = v ? bT : bF;\n    if (v === !!q.a) { btn.classList.add('ok'); cons     '<div class="row" style="margin-top:14px"><button class="btn" id="fGo">✅ حفظ' + (edit ? '' : ' والبدء') + '</button>' + (edit ? '<button class="btn gr" id="fBack">↩️ رجوع</button>' : '') + '</div></div>';
  let age = P.age;
  m.querySelectorAll('.agebtn').forEach(b => b.onclick = () => { m.querySelectorAll('.agebtn').forEach(x => x.classList.remove('on')); b.classList.add('on'); age = b.dataset.age; tone(880, .05, 'square', .03); });
  const fill = () => {
    loadVoices(); const sa = $('#fVoice'), se = $('#fVoiceEn'); if (!sa || !se) return; const ca = sa.value || P.voiceURI, ce = se.value || P.voiceEnURI;
    sa.innerHTML = '<option value="">' + (IS_IOS ? '⭐ صوت الآيباد المختار في الإعدادات' : 'تلقائي (أفضل صوت عربي)') + '</option>' + arVoices().map(v => '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === ca ? ' selected' : '') + '>' + esc(v.name) + ' (' + v.lang + ')</option>').join('');
    se.innerHTML = '<option value="">' + (IS_IOS ? '⭐ الصوت الإنجليزي المختار في الإعدادات' : 'تلقائي (أفضل صوت إنجليزي)') + '</option>' + enVoices().map(v => '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === ce ? ' selected' : '') + '>' + esc(v.name) + ' (' + v.lang + ')</option>').join('');
  };
  fill(); setTimeout(fill, 800);
  $('#tAr').onclick = () => { P.voiceURI = $('#fVoice').value; P.rate = +$('#fRate').value; speak('مرحبًا، أنا الأستاذة نورة.'); };
  $('#tEn').onclick = () => { P.voiceEnURI = $('#fVoiceEn').value; P.rate = +$('#fRate').value; speak('Hello! I am Teacher Noura.', true); };
  $('#fGo').onclick = () => {
    const n = $('#fName').value.trim(); if (!n) { notify('اكتب اسم الطفل أولًا'); return; } if (!age) { notify('اختر عمر المتعلّم أولًا'); return; }
    const pin = $('#fPin').value.trim() || '1234'; if (pin.length < 4) { notify('الرمز 4 أرقام على الأقل'); return; }
    Object.assign(P, { name: n, parentName: $('#fParent').value.trim(), age, pin, voiceURI: $('#fVoice').value, voiceEnURI: $('#fVoiceEn').value, rate: +$('#fRate').value }); saveProfile();
    /* تحديث نسخ البرامج المحفوظة */
    SUBJ.forEach(s => { const o = rdJ(s.key); if (!o) return; o.name = P.name; o.settings = o.settings || {}; ['parentName', 'age', 'pin', 'voiceURI', 'voiceEnURI', 'rate'].forEach(k => o.settings[k] = P[k]); try { localStorage.setItem(s.key, JSON.stringify(o)); } catch (e) { } });
    screenHome(true);
  };
  if (edit) $('#fBack').onclick = () => screenHome(false);
  setBubble('مرحبًا! أنا الأستاذة نورة. هذه الشاشة لولي الأمر.');
}
function openPin() {
  const m = el('div', 'modal'); m.innerHTML = '<div class="box" style="max-width:360px"><h2 style="text-align:center">لوحة ولي الأمر 🔒</h2><div class="pindisp" id="pd"></div><div class="pinpad" id="pp"></div><div class="row"><button class="sbtn gray" id="pc">إغلاق</button></div></div>';
  document.body.appendChild(m); let pin = ''; const pd = m.querySelector('#pd');
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✔'].forEach(k => { const b = el('button', '', k); b.onclick = () => { if (k === '⌫') pin = pin.slice(0, -1); else if (k === '✔') { if (pin === String(P.pin || '1234')) { m.remove(); screenSetup(true); } else { pin = ''; pd.textContent = '✖'; setTimeout(() => pd.textContent = '', 700); } return; } else if (pin.length < 6) pin += k; pd.textContent = '•'.repeat(pin.length); }; m.querySelector('#pp').appendChild(b); });
  m.querySelector('#pc').onclick = () => m.remove();
}

/* ---------- فتح البرنامج داخل المنصة ---------- */
let CUR = null;
function appHTML(s) {
  const head = '<script>window.PLATFORM=true;window.SUBJECT=' + JSON.stringify(s.id) + ';<\/script>';
  return APPS[s.app].replace('<head>', '<head>' + head);
}
function openApp(s) {
  try { speechSynthesis.cancel(); } catch (e) { }
  const ld = el('div', '', '<span class="ic">' + s.ic + '</span>' + s.nm + '<small style="font-size:16px;color:var(--muted)">لحظة...</small>'); ld.id = 'loading'; ld.style.flexDirection = 'column'; document.body.appendChild(ld);
  setTimeout(() => {
    closeFrame();
    const w = el('div'); w.id = 'frameWrap'; const f = document.createElement('iframe'); f.setAttribute('allow', 'microphone; autoplay'); f.title = s.nm;
    f.srcdoc = appHTML(s); w.appendChild(f); document.body.appendChild(w); CUR = s;
    $('#shell').classList.add('hidden');
    f.onload = () => { const x = $('#loading'); if (x) setTimeout(() => x.remove(), 150); };
    setTimeout(() => { const x = $('#loading'); if (x) x.remove(); }, 4000);
    try { history.pushState({ app: s.id }, ''); } catch (e) { }
  }, 60);
}
function closeFrame() { const w = $('#frameWrap'); if (w) { try { w.querySelector('iframe').contentWindow.postMessage({ type: 'platform-save' }, '*'); } catch (e) { } w.remove(); } CUR = null; $('#shell').classList.remove('hidden'); }
function backHome() { closeFrame(); screenHome(false); }
window.addEventListener('message', e => { if (e.data && e.data.type === 'platform-home') { if (history.state && history.state.app) history.back(); else backHome(); } });
window.addEventListener('popstate', () => { if (CUR) backHome(); });

/* ---------- التشغيل ---------- */
function boot() {
  const bg = $('#bg'); const cols = ['#3F7FE0', '#F28C28', '#1F9E89', '#8E5BD6', '#E25577', '#FFD166'];
  for (let i = 0; i < 9; i++) { const c = el('i'); const s = 40 + Math.random() * 120; c.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + Math.random() * 100 + '%;top:' + Math.random() * 100 + '%;background:' + cols[i % cols.length] + ';animation-delay:' + (-Math.random() * 9) + 's;opacity:.12'; bg.appendChild(c); }
  $('#sayBtn').onclick = () => speak($('#bubbleText').textContent);
  try { if (history.state && history.state.app) history.replaceState(null, ''); } catch (e) { }
  if (!P.name || !P.age) screenSetup(false); else screenHome(false);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
}
window.addEventListener('load', boot);

</script>
